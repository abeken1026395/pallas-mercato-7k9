<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>データ攻め</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1a2b;color:#f2f5f8;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;text-align:center;padding:24px}
  h1{font-size:24px;margin:0 0 20px;letter-spacing:.05em}
  p.msg{margin:0 0 12px;line-height:1.9;font-size:15px}
  p.last{margin-bottom:24px}
  .hk{margin:8px auto 24px;max-width:420px;padding:14px;border:1px solid rgba(255,255,255,.25);text-align:left}
  .hk-t{font-weight:700;margin:0 0 6px;text-align:center}
  .hk-d{font-size:13px;line-height:1.8;margin:0 0 8px}
  .hk textarea{width:100%;box-sizing:border-box;font-size:12px;padding:8px;background:transparent;color:#f2f5f8;border:1px solid rgba(255,255,255,.3)}
  .hk button{min-height:44px;padding:0 20px;font-weight:700;font-size:15px;border:0;border-radius:999px;background:#f2f5f8;color:#0b1a2b}
  a{display:inline-block;color:#fff;background:#c4302b;font-weight:700;text-decoration:none;padding:12px 22px;border-radius:999px}
  .yt-cs{margin:18px 0 6px;font-size:26px;letter-spacing:.08em;font-weight:700}
  .yt-m{margin:0 0 12px;line-height:1.9;font-size:15px}
  .yt-live{margin:0 0 16px;line-height:1.9;font-size:15px;font-weight:700}
  .yt-live b{display:inline-block;margin-right:6px;padding:0 6px;background:#c4302b;color:#fff;font-size:13px}
</style>
</head>
<body>
<div>
  <h1>おかえりなさい</h1>
  <p class="msg">データ攻めは、<br>2026年10月24日に住所が変わりました。</p>
  <p class="msg">新しい住所は、<br>オープンチャットのノートでご案内しています。</p>
  <p class="msg last">オープンチャットを抜けた方は、<br>公式LINEから入り直してください。</p>
  <div class="hk" id="hk" hidden>
    <p class="hk-t">フォローの引き継ぎ</p>
    <p class="hk-d">この端末には、前の住所で付けた☆推し・📍場・メモが残っています。<br>新しい住所のトップの「前の住所からフォローを引き継ぐ」に、このコードを貼ってください。</p>
    <textarea id="hk-code" rows="3" readonly aria-label="引き継ぎコード"></textarea>
    <p><button type="button" id="hk-copy">コードをコピー</button></p>
    <p class="hk-d" id="hk-msg" role="status"></p>
  </div>
  <div class="yt">
    <p class="yt-cs">YouTube 復活</p>
    <p class="yt-m">新しいチャンネル<br>「あべけんいち」を開設しました。</p>
    <p class="yt-live" id="ytLive" hidden></p>
    <p><a href="https://www.youtube.com/@abekenichi_boatrace" target="_blank" rel="noopener">チャンネル登録はこちら</a></p>
  </div>
</div>
<script>
/* 前の住所に残っている保存内容を「DZ1.」＋base64 のコードにする（新しい住所は書かない・2026-10-26）。 */
(function(){
  var OK=/^(br_|uranai_|aisho_|senshuCard|tdExtraOpen$)/, data={}, n=0;
  try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(OK.test(k)){ data[k]=localStorage.getItem(k); n++; } } }catch(e){ return; }
  if(!n){
    var hk=document.getElementById("hk");
    hk.querySelector(".hk-d").innerHTML="この開き方（このアイコン、またはこのブラウザ）には、前の住所で付けたフォローは残っていません。<br>iPhone は Safari とホーム画面のアイコンで保存場所が別です。フォローを付けていた方の開き方で、もう一度開いてください。<br>アイコンを消したり置き直したりした場合は、前のフォローは戻せません。";
    hk.querySelector("textarea").hidden=true; document.getElementById("hk-copy").hidden=true;
    hk.hidden=false; return;
  }
  var u=new TextEncoder().encode(JSON.stringify(data)), bin=""; for(var j=0;j<u.length;j++) bin+=String.fromCharCode(u[j]);
  var code="DZ1."+btoa(bin), box=document.getElementById("hk-code"), msg=document.getElementById("hk-msg");
  box.value=code; document.getElementById("hk").hidden=false;
  document.getElementById("hk-copy").addEventListener("click", function(){
    function done(){ msg.textContent="コピーしました。新しい住所のトップで貼ってください。"; }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(done,function(){ box.select(); document.execCommand("copy"); done(); }); }
    else { box.select(); document.execCommand("copy"); done(); }
  });
})();
</script>
<script>
/* YouTube ライブ配信の告知（2026-11-11 けん）。日本時間の日付で文面を変え、11/14 0時からは出さない */
(function(){
  var n=Date.now(), day=function(t){return new Date(t+9*3600e3).toISOString().slice(0,10);},
      L=[Date.UTC(2026,10,11,10),Date.UTC(2026,10,13,10)], lab=["11日（水）","13日（金）"], td=day(n), out=[];
  for(var i=0;i<L.length;i++){ if(day(L[i])>=td) out.push((day(L[i])===td?"今夜":lab[i])+"19時から"); }
  if(!out.length) return;
  var p=document.getElementById("ytLive"), b=document.createElement("b"); b.textContent="LIVE";
  p.appendChild(b); p.appendChild(document.createTextNode("ライブ配信"));
  out.forEach(function(t){ p.appendChild(document.createElement("br")); p.appendChild(document.createTextNode(t)); });
  p.hidden=false;
})();
</script>
</body>
</html>
