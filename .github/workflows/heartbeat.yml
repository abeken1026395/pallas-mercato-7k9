name: heartbeat（GitHub schedule・時刻帯で内部起動）

# 外部cron(cron-job.org)は導入していない。今後も導入しない（2026-08-04 けん裁定）。
# 発火は GitHub schedule のみ。単発の不発火は「多重発火×冪等」で吸収する前提で運用する。
# heartbeat がJST時刻帯を見て nightlyPipeline を
# GITHUB_TOKEN の workflow_dispatch で内部起動する。
# （2026-08-03 writeKansenki の内部起動は停止。観戦記はPCローカルで自走）
#
# 実測（2026-07-14〜08-03）: schedule の発火率は 42.3%（期待336回に対し実測142回）。
#   この発火率でも nightlyPipeline は日6〜11回動いており、実害は出ていない。
#
# 注：workflow_dispatch / repository_dispatch は GITHUB_TOKEN の「再帰防止」の例外であり、
#     GITHUB_TOKEN でも他WFを起動できる（PATは不要・repo secret追加ゼロ）。
on:
  workflow_dispatch: {}       # 手動リカバリ用（外部cronは未導入）
  schedule:
    - cron: "0 8-23 * * *"    # 毎時0分・UTC8-23 = JST17:00〜翌8:00（主発火）

permissions:
  actions: write              # GITHUB_TOKEN で他WFの workflow_dispatch を叩くため

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  fan-out:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: decide & dispatch（JST時刻帯で内部起動）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          H=$(TZ=Asia/Tokyo date +%-H)          # JST時（0-23・先頭ゼロなし）
          NOW=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')
          dispatch () {
            wf="$1"
            code=$(curl -sS -o /tmp/d.out -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${wf}/dispatches" \
              -d '{"ref":"main"}')
            if [ "$code" = "204" ]; then
              echo "dispatch ${wf} → OK(204)"
            else
              echo "::error::dispatch ${wf} 失敗(HTTP ${code})"; cat /tmp/d.out || true; return 1
            fi
          }
          # 起動マトリクス（JST）:
          #   nightly = 17:00-01:59（H>=17 or H<=1） → それ以外は no-op
          # 2026-08-03 writeKansenki の dispatch を停止（観戦記はローカル自走）。
          #            判定用の RW も消費者が無くなったため算出ごと削除した。
          RN=0
          if [ "$H" -ge 17 ] || [ "$H" -le 1 ]; then RN=1; fi
          rc=0
          if [ "$RN" = 1 ]; then dispatch nightlyPipeline.yml || rc=1; fi
          if [ "$RN" = 0 ]; then echo "no-op帯（JST ${H}時）＝内部起動なし"; fi
          {
            echo "### heartbeat 判定（${NOW}）"
            echo "- JST時=\`${H}\` → nightly=\`${RN}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
