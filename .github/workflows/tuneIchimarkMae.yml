name: 1マークの見立て（週1の見直し）

# けん裁定 2026-11-03「2A」：週1回、作り方の候補を直近28日で試し、関門をすべて通ったときだけ自動で切り替える。
# 中身は scripts/ichimark/tuneWeekly.py（関門の数字も同ファイル）。書くのは次の2つだけ。
#   scripts/ichimark/maeConfig.json（切り替えたときだけ。次の朝の見立てから効く。出した見立ては書き換えない）
#   health/ichimarkTune.md（毎回1回分を追記。採用・不採用とも）
# 定時起動は遅れることがあるので月曜に2回置く。同じ日にもう記録があれば何もしない。JST 11:00から11:40 は動かさない。
#   '23 17 * * 0' → 月曜 JST 02:23 ／ '23 5 * * 1' → 月曜 JST 14:23
on:
  schedule:
    - cron: '23 17 * * 0'
    - cron: '23 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ichimark-mae
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 動かすかどうか
        id: chk
        run: |
          D=$(python3 -c "from datetime import datetime,timezone,timedelta;print(datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d'))")
          HM=$(python3 -c "from datetime import datetime,timezone,timedelta;print(datetime.now(timezone(timedelta(hours=9))).strftime('%H%M'))")
          if [ "$HM" -ge 1100 ] && [ "$HM" -le 1140 ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "競合帯なので動かさない: JST $HM"; exit 0
          fi
          if [ -f health/ichimarkTune.md ] && grep -q "^## $D" health/ichimarkTune.md; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "今日はもう見直し済み: $D"; exit 0
          fi

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.skip != '1'
        with:
          python-version: '3.12'

      - name: 依存
        if: steps.chk.outputs.skip != '1'
        run: pip install numpy scikit-learn lightgbm==4.7.0

      - name: 見直し
        if: steps.chk.outputs.skip != '1'
        run: python scripts/ichimark/tuneWeekly.py

      - name: commit and push
        if: steps.chk.outputs.skip != '1'
        env:
          BR: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/ichimark/maeConfig.json health/ichimarkTune.md
          if git diff --staged --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "1マークの見立て：週1の見直し $(python3 -c "import json;print(json.load(open('scripts/ichimark/maeConfig.json'))['id'])")"
          for i in 1 2 3 4 5 6; do
            git fetch origin "$BR" || true
            if git rebase "origin/$BR"; then
              if git push origin "HEAD:$BR"; then echo "pushed (try $i)"; exit 0; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $(( (RANDOM % 6) + 3 ))
          done
          echo "push retries exhausted"; exit 1
