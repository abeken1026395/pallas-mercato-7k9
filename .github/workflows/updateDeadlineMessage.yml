name: 締切一覧メッセージ自動生成

on:
  schedule:
    # JST 23:45（= UTC 14:45）。夜のうちに翌日分の締切一覧を生成する。
    # 直前（JST 23:37）に出走表更新が走るが、cron遅延に備えこのジョブ内でも最新化する。
    - cron: '45 14 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 YYYYMMDD（空なら翌日JST）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: boatrace-deadline-message
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 未設定なら LINE 投稿ステップはスキップ（＝トークン登録まで無害）
      LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
      LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pandas lxml
      # 最新の公開カード（遅く公開されるナイター/ミッドナイトを含む）を取り込む
      - name: refresh racers
        run: python scripts/scrape_racers.py
      - name: build deadline message
        env:
          DEADLINE_DATE: ${{ github.event.inputs.date }}
        run: python scripts/build_deadline_message.py
      # トークンが登録されている場合のみ LINE に投稿
      - name: post to LINE
        id: line
        if: ${{ env.LINE_CHANNEL_TOKEN != '' }}
        run: python scripts/post_line_message.py
      # 順序は「LINE 送信 → commit/push」。送信済みで push に失敗すると、送った内容と公開物が食い違う。
      # 送信は取り消さない。食い違ったことをログ（::error::）とステップサマリに残し、ジョブを落とす。
      - name: commit and push
        env:
          LINE_OUTCOME: ${{ steps.line.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          # 変更なし＝push しない（正常）。
          git diff --staged --quiet && echo "no change（push 不要）" && exit 0
          git commit -m "締切一覧メッセージ自動生成 $(date +'%Y-%m-%d %H:%M')"
          # push に失敗したらリトライし、尽きたら落とす（旧: ループが sleep で終わり exit 0＝緑のまま未公開）。
          # 衝突で止まった rebase は解いてから再試行する（旧: unmerged のまま残り、2回目以降は必ず失敗していた）。
          PUSHED=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then PUSHED=1; break; fi
            git rebase --abort 2>/dev/null || true
            echo "push retry $i ..."
            sleep 5
          done
          if [ "$PUSHED" != "1" ]; then
            if [ "$LINE_OUTCOME" = "success" ]; then
              echo "::error::LINE は送信済みだが push に失敗（5回のリトライを使い切った）。送信した締切一覧と公開物が食い違っている"
              echo "- **食い違い**: LINE 送信済み・push 失敗（公開物は前回のまま）" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::push に失敗（5回のリトライを使い切った）。コミットは公開されていない（LINE 送信: ${LINE_OUTCOME:-なし}）"
            fi
            exit 1
          fi
          echo "pushed"
