name: レース結果 随時更新（日中）

# 当日の結果を、レースが終わるたびに取り込む。1回起動したら夜まで走り続ける見張り（scripts/resultsLoop.py）。
#
# 2026-11-12 に作り直した。以前は「毎時の定時」と「他のWFの完了への相乗り」で1回ずつ取り込む形で、
# 定時がほとんど飛ばされ（2026-11-11 は13回中2回）、日中に最大4時間46分あいた。
# いまは起動のきっかけ（定時・相乗り・手動・自分の中継）のどれか1つが来れば、その便が
#   取得元 v1 を読む → 締切から15分たっても v1 に無いレースだけ公式の結果ページを読む →
#   変わったときだけコミットして配信WFを起動する
# を、次のレースの時刻に合わせて繰り返す。先に起動した便が動いていれば、後から来た便は何もせず終わる。
# ジョブの上限（6時間）の前に、自分で次の便を起動してから終わる。
# 見立て検証(verifyPredictions 等)は夜の updateResults.yml に任せ、ここでは触れない。

on:
  schedule:
    # 朝の起動（JST 05:40〜08:40）。見張りは 08:00 まで待ってから始まる。
    - cron: "40 20-23 * * *"
    # JST 11:15〜23:15 の毎時（UTC 02:15〜14:15）。見張りが止まっていたときの起こし直し。
    - cron: "15 2-14 * * *"
  workflow_run:
    # 高頻度で走る既存ジョブの完了に相乗りする(schedule 不発対策)。見張りが動いていれば何もしない。
    workflows:
      - "気象データ自動更新"
      - "出走表データ自動更新"
      - "モーターデータ自動更新"
      - "荒れ指数 更新"
    types:
      - completed
  workflow_dispatch:
    inputs:
      hd:
        description: "取得する日付(YYYYMMDD)。指定するとその日だけ1回取り込んで終わる（穴埋め用）。空欄なら見張り。"
        required: false
        default: ""
      relay_from:
        description: "中継元の run id（見張りが自分で入れる。手では入れない）"
        required: false
        default: ""
      dry_run:
        description: "1 にするとコミット・push・配信の起動・中継をしない（確かめ用）"
        required: false
        default: ""
      max_ticks:
        description: "この回数だけ回って終わる（確かめ用。空欄なら制限なし）"
        required: false
        default: ""

permissions:
  contents: write
  actions: write   # 配信WFと次の便を起動するため

# 順番待ちの列（concurrency）は置かない。置くと、見張りが走っているあいだ後から来た便が何時間も待ちになる。
# 二重に走らせない判定は resultsLoop.py が自分で行う。results/ への同時コミットは commit の再試行で解く。

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: results loop (当日分・取得元 v1 と公式)
        env:
          HD: ${{ github.event.inputs.hd }}
          RELAY_FROM: ${{ github.event.inputs.relay_from }}
          RESULTS_DRY_RUN: ${{ github.event.inputs.dry_run }}
          RESULTS_MAX_TICKS: ${{ github.event.inputs.max_ticks }}
          OFFICIAL_AFTER_MIN: "15"   # 公式に結果が出るのは締切の14〜15分後（2026-11-11 の記録から）。それより前に読んでも無い
          GH_TOKEN: ${{ github.token }}
          BR: ${{ github.ref_name }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/resultsLoop.py
