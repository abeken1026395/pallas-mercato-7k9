name: M8影運用（着外モデル・記録のみ）

# M8（①＝1号艇が着外＝4着以下 になる確率）の影運用。
# 当日の全レースを推論して predictions/m8/YYYYMMDD.json に記録し、
# 前日ぶんの答え合わせを m8VerifyLog.csv に追記する。
#
# 「影運用」＝記録するだけで読者の画面は一切変えない。
#   ・docs/ には書かない。公開ページ・highlights・verify_log・既存 predictions/ には触れない。
#   ・書き込むのは pv2/ ・ predictions/m8/ ・ m8VerifyLog.csv の3箇所だけ。
#
# ★ schedule は意図的に書いていない。手動（workflow_dispatch）だけで数日試運転し、
#   出力と所要が想定どおりであることを確認してから、別PRで cron を足す。
#   自動実行の追加は運用フローの変更にあたるので、けんの承認を取ってから行う。

on:
  workflow_dispatch:
    inputs:
      hd:
        description: '対象開催日（YYYYMMDD）。空ならJST当日'
        required: false
        default: ''
      verify_only:
        description: '1 を入れると推論せず前日照合だけ行う'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: boatrace-m8
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install numpy pandas scikit-learn

      - name: 素材取得・学習・当日推論・前日照合
        env:
          HD: ${{ github.event.inputs.hd }}
          M8_VERIFY_ONLY: ${{ github.event.inputs.verify_only }}
        run: python scripts/dailyM8.py

      - name: commit and push
        if: always()
        env:
          BR: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # パスは明示。docs/ や既存 predictions/ を巻き込まないため add -A は使わない
          git add pv2 2>/dev/null || true
          git add predictions/m8 2>/dev/null || true
          git add m8VerifyLog.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "M8影運用: 当日推論と前日照合を記録"
          for i in 1 2 3 4 5 6; do
            git fetch origin "$BR" || true
            if git rebase "origin/$BR"; then
              if git push origin "HEAD:$BR"; then echo "pushed (try $i)"; exit 0; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $(( (RANDOM % 6) + 3 ))
          done
          echo "push retries exhausted"; exit 1
