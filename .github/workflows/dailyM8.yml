name: M8影運用（着外モデル・記録のみ）

# M8（①＝1号艇が着外＝4着以下 になる確率）の影運用。朝夜2本立て。
#   am（JST 9:05）… 当日の全レースを推論して predictions/m8/YYYYMMDD.json に記録し、
#                    前日ぶんの答え合わせ（am版・pm版の両方）を m8VerifyLog.csv に追記する。
#   pm（JST 21:30）… その時点の展示込みで全レースを再推論し
#                    predictions/m8/YYYYMMDD_pm.json に記録する。照合はしない。
#
# 「影運用」＝記録するだけで読者の画面は一切変えない。
#   ・docs/ には書かない。公開ページ・highlights・verify_log・既存 predictions/ には触れない。
#   ・書き込むのは pv2/ ・ predictions/m8/ ・ m8VerifyLog.csv の3箇所だけ。
#
# cron は UTC。JST = UTC+9。
#   '5 0 * * *'  → JST 09:05（am。番組表は出ているが展示はまだ）
#   '30 12 * * *' → JST 21:30（pm。展示が揃っている）
# schedule 起動では MODE を JST の時刻から決める（15時より前なら am・以後は pm）。
# 手動起動（workflow_dispatch）では mode 入力が優先。空なら同じ自動判定。

on:
  schedule:
    - cron: '5 0 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      hd:
        description: '対象開催日（YYYYMMDD）。空ならJST当日'
        required: false
        default: ''
      mode:
        description: '実行モード（am / pm）。空ならJST時刻から自動判定'
        required: false
        default: ''
      verify_only:
        description: '1 を入れると推論せず前日照合だけ行う（am のみ有効）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: boatrace-m8
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install numpy pandas scikit-learn

      - name: 実行モードを決める
        id: mode
        env:
          IN_MODE: ${{ github.event.inputs.mode }}
        run: |
          M="$(echo "$IN_MODE" | tr 'A-Z' 'a-z' | tr -d '[:space:]')"
          if [ -z "$M" ]; then
            H=$(TZ=Asia/Tokyo date +%-H)
            if [ "$H" -lt 15 ]; then M=am; else M=pm; fi
          fi
          if [ "$M" != "am" ] && [ "$M" != "pm" ]; then
            echo "mode は am / pm のいずれか（受け取った値: $M）"; exit 1
          fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "MODE=$M（JST $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')）"

      - name: 素材取得・学習・当日推論・前日照合
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          HD: ${{ github.event.inputs.hd }}
          M8_VERIFY_ONLY: ${{ github.event.inputs.verify_only }}
        run: python scripts/dailyM8.py

      - name: commit and push
        if: always()
        env:
          BR: ${{ github.ref_name }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # パスは明示。docs/ や既存 predictions/ を巻き込まないため add -A は使わない
          git add pv2 2>/dev/null || true
          git add predictions/m8 2>/dev/null || true
          git add m8VerifyLog.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "M8影運用(${MODE:-am}): 当日推論と前日照合を記録"
          for i in 1 2 3 4 5 6; do
            git fetch origin "$BR" || true
            if git rebase "origin/$BR"; then
              if git push origin "HEAD:$BR"; then echo "pushed (try $i)"; exit 0; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $(( (RANDOM % 6) + 3 ))
          done
          echo "push retries exhausted"; exit 1
