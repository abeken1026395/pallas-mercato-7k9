name: 更新履歴 追記

# main への push に含まれるコミットメッセージ／PR本文から
#   [updates] ページ名 / 本文
# の行だけを拾い、docs/data/updates.json の先頭に追記する。
# 該当行が無ければ何も書かず、コミットもしない（空コミットを作らない）。

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: boatrace-updates
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 「[updates] ページ名 / 本文」を抽出して先頭に追記
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const FILE = "docs/data/updates.json";

            // 拾うのはこの形の行だけ。ページ名に「/」は使えない（本文との区切りに使うため）。
            const LINE = /^\s*\[updates\]\s*([^\/\n]+?)\s*\/\s*(.+?)\s*$/;

            // コミット日時（UTC）を JST の YYYY-MM-DD にする。
            const jstDate = (iso) => {
              const d = iso ? new Date(iso) : new Date();
              return new Date(d.getTime() + 9 * 3600 * 1000).toISOString().slice(0, 10);
            };

            const commits = context.payload.commits || [];
            const sources = [];   // {text, date} を古い順に積む

            for (const c of commits) {
              sources.push({ text: c.message || "", date: jstDate(c.timestamp) });
            }

            // PR本文も対象にする（squash / merge のどちらでも本文を拾える）。取得できなければ無視。
            for (const c of commits) {
              try {
                const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner, repo: context.repo.repo, commit_sha: c.id,
                });
                for (const pr of prs.data) {
                  if (pr.body) sources.push({ text: pr.body, date: jstDate(c.timestamp) });
                }
              } catch (e) {
                core.info("PR本文の取得をスキップ: " + e.message);
              }
            }

            const found = [];
            for (const s of sources) {
              for (const raw of String(s.text).split(/\r?\n/)) {
                const m = raw.match(LINE);
                if (m) found.push({ date: s.date, page: m[1], text: m[2] });
              }
            }

            // 既存を読む。壊れていたら中断する（既存要素を絶対に壊さない）。
            let list;
            try {
              list = JSON.parse(fs.readFileSync(FILE, "utf8"));
            } catch (e) {
              core.setFailed(FILE + " を読めませんでした: " + e.message);
              return;
            }
            if (!Array.isArray(list)) {
              core.setFailed(FILE + " が配列ではありません");
              return;
            }

            const key = (e) => e.date + "|" + e.page + "|" + e.text;
            const seen = new Set(list.map(key));

            // 古い順に先頭へ入れる → 最終的に新しいものが配列の先頭になる。
            // 既存要素は読むだけで、書き換えも削除もしない。
            let added = 0;
            for (const e of found) {
              if (seen.has(key(e))) continue;
              seen.add(key(e));
              list.unshift(e);
              added++;
            }

            if (added > 0) fs.writeFileSync(FILE, JSON.stringify(list, null, 2) + "\n");
            core.setOutput("added", String(added));
            core.info("追記件数: " + added);

      - name: commit and push
        if: steps.extract.outputs.added != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/updates.json
          if git diff --cached --quiet; then
            echo "差分なし。コミットしない。"
            exit 0
          fi
          git commit -m "update updates.json"
          # push競合(cannot lock ref)は短いランダム待機でリトライする。
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5 6; do
            git fetch origin "$BR" || true
            if git rebase -X theirs "origin/$BR"; then
              if git push origin "HEAD:$BR"; then
                echo "pushed (try $i)"; exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $(( (RANDOM % 6) + 3 ))
          done
          echo "push retries exhausted"; exit 1
