name: beforeinfo部品交換収集

on:
  schedule:
    # 前日分は当日いっぱい有効なので、多少遅延しても間に合うよう枠を厚くする
    # 夜の回は、日付が変わったあとに「前日」＝終わったばかりの開催日を取る（2026-10-28 けん裁定 A）。
    # 朝の回が遅れても、実験場「部品交換のつづき」が前の晩のうちに昨日の交換まで入った状態になる。
    # 1:47 の1回だけだった頃、10/29・10/30 の2晩続けて実行が飛んだ。2回に増やし、時刻もずらす（2026-10-30 けん裁定 A）。
    # 競走成績の本取得（updateResults.yml の JST 23:37）のあと。朝の回は取り直しとして残す。
    - cron: '53 15 * * *'  # JST 0:53
    - cron: '17 18 * * *'  # JST 3:17
    - cron: '7 21 * * *'   # JST 翌 6:07
    - cron: '7 1 * * *'    # JST 10:07
    - cron: '7 5 * * *'    # JST 14:07
  workflow_dispatch:
    inputs:
      hd:
        description: '検証用の対象開催日（YYYYMMDD）。空なら既定（JST前日）を使用'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: boatrace-beforeinfo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pandas lxml
      - name: fetch beforeinfo (部品交換・チルト・プロペラ変更・体重・展示タイム)
        env:
          HD_OVERRIDE: ${{ github.event.inputs.hd }}
        run: python scripts/fetchPartsExchange.py
      - name: build motorKarte.json (モーターページ用の軽量派生JSON)
        # motorParts.json は全列21MBで、そのままブラウザに読ませると iPhone が固まる。
        # 描画に使う8列だけを機ごとに索引した派生ファイルを毎回作り直す（motorParts.json は読むだけ）。
        if: always()
        run: python scripts/buildMotorKarte.py
      - name: build docs/next/buhinTsuzuki.html (実験場「部品交換のつづき」)
        # 前の日までに部品を替えた選手の一覧。取り込みの直後に作らないと「翌日」の選手が載らない（2026-10-27 けん裁定 A）。
        # 実験場のページなので、失敗しても部品交換のコミットは止めない。ただし警告は必ず出す（無言で古いページを残さない）。
        if: always()
        run: |
          if ! python scripts/buildBuhinTsuzuki.py; then
            echo "::warning::buhinTsuzuki.html を作り直せなかった。実験場のページは前回のまま"
          fi
      - name: commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/motorParts.json
          git add docs/data/motorKarte.json
          git add docs/next/buhinTsuzuki.html
          # 変更なし＝push しない（正常）。
          git diff --staged --quiet && echo "no change（push 不要）" && exit 0
          git commit -m "beforeinfo部品交換収集 $(date +'%Y-%m-%d %H:%M')"
          # push に失敗したらリトライし、尽きたら落とす（旧: ループが sleep で終わり exit 0＝緑のまま未公開）。
          # 衝突で止まった rebase は解いてから再試行する（旧: unmerged のまま残り、2回目以降は必ず失敗していた）。
          PUSHED=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then PUSHED=1; break; fi
            git rebase --abort 2>/dev/null || true
            echo "push retry $i ..."
            sleep 5
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::error::push に失敗（5回のリトライを使い切った）。コミットは公開されていない"
            exit 1
          fi
          echo "pushed"
