name: updateWakuStats

on:
  schedule:
    - cron: "40 18 * * *"   # UTC 18:40 = JST 03:40（updateNigeSecond の10分後）
  workflow_dispatch:

concurrency:
  group: updateWakuStats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: update
        run: python3 scripts/updateWakuStats.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wakuStats/base.csv docs/data/wakuStats.json docs/data/wakuST.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "auto: wakuStats daily update"
          git push origin HEAD:main
