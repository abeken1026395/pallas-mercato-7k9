name: updateWakuStats

on:
  schedule:
    - cron: "40 18 * * *"   # UTC 18:40 = JST 03:40（updateNigeSecond の10分後）
  workflow_dispatch:

concurrency:
  group: updateWakuStats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: update
        run: python3 scripts/updateWakuStats.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wakuStats/base.csv docs/data/wakuStats.json docs/data/wakuST.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "auto: wakuStats daily update"
          # 他の自動コミットと同時刻にぶつかると push が拒否される（2026-11-08 実例）。
          # 出走表データ自動更新と同じく、最新を取り込んでから最大5回まで再試行する。
          PUSHED=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort 2>/dev/null || true
            echo "push retry $i ..."
            sleep 5
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::error::push に失敗（5回のリトライを使い切った）。コミットは公開されていない"
            exit 1
          fi
          echo "pushed"
