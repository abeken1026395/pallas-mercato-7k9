name: 検証ページ /kensho/ 更新

on:
  schedule:
    - cron: '20 2 * * *'   # JST 11:20（前日の結果が results/ に入ったあと）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boatrace-kensho
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # docs/kensho/shobugake/index.html を scripts/templateKensho.html から生成する。
      # データ源=BoatraceOpenAPI/programsミラー(GitHub配信,Actions到達可)＋results/。
      # 累積 data/kenshoVerify.json とキャッシュ data/programsCache/ は gitignore。
      # 変わらない日は "kensho: no change (skip write)" を出して書き込まない。
      - run: python scripts/buildKensho.py
      - name: commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/kensho/shobugake/index.html data/kenshoVerify.json
          git diff --staged --quiet || git commit -m "update kensho/shobugake/index.html"
          # push競合(cannot lock ref)は短いランダム待機でリトライする。
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5 6; do
            git fetch origin "$BR" || true
            if git rebase -X theirs "origin/$BR"; then
              if git push origin "HEAD:$BR"; then
                echo "pushed (try $i)"; exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $(( (RANDOM % 6) + 3 ))
          done
          echo "push retries exhausted"; exit 1
