name: lintGuard
on:
  pull_request:
    paths:
      - 'docs/**/*.html'
      - 'docs/players/app.js'
      - 'docs/motor/app.js'
      - 'docs/stadium/app.js'
      - 'docs/fan/app.js'
      - 'scripts/stadium/app.jsx'
      - 'scripts/fan/app.jsx'
      - 'docs/assets/guard.js'
      - 'scripts/lintGuard.py'
      - '.github/workflows/lintGuard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run lintGuard
        run: python3 scripts/lintGuard.py
