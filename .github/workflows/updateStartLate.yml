name: スタート遅れ率の更新

on:
  schedule:
    - cron: '10 18 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boatrace-startlate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: build startLate
        run: python3 scripts/buildStartLate.py

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/startLate.json
          if git diff --cached --quiet; then
            echo "startLate: no change (skip commit)"
            exit 0
          fi
          git commit -m "update startLate.json"
          git push
