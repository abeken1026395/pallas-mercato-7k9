name: update ashiya payouts

on:
  workflow_dispatch:
    inputs:
      START:
        description: '収集開始日 YYYYMMDD（空欄で既定 20250715）'
        required: false
        default: ''
      END:
        description: '収集終了日 YYYYMMDD（空欄で昨日=JST）'
        required: false
        default: ''
  schedule:
    - cron: '20 17 * * *'   # JST 翌2:20（結果確定後・他場と分離）

permissions:
  contents: write

concurrency:
  group: boatrace-ashiya-payouts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo   # 日付境界をJSTに固定（昨日=完全確定日のみ収集）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # mbraceはクラウドIP遮断のため使わない。到達可能な非公式ミラー(BoatraceOpenAPI)を参照。
      - name: scrape ashiya payouts (API source)
        continue-on-error: true
        env:
          START: ${{ github.event.inputs.START }}
          END: ${{ github.event.inputs.END }}
        run: python scripts/scrapeAshiyaPayoutsApi.py

      - name: build man rate json
        if: always()
        run: python scripts/buildAshiyaManRate.py

      - name: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/payouts/ashiyaPayouts.csv docs/payouts/ashiyaManRate.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "update ashiya payouts"
          # push競合(cannot lock ref)は短いランダム待機でリトライする。
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5 6; do
            git fetch origin "$BR" || true
            if git rebase -X theirs "origin/$BR"; then
              if git push origin "HEAD:$BR"; then
                echo "pushed (try $i)"; exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $(( (RANDOM % 6) + 3 ))
          done
          echo "push retries exhausted"; exit 1
