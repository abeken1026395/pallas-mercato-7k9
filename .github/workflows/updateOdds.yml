name: オッズ 翌朝取得

# 前日分のオッズを turnmark/api から odds/YYYYMMDD.json に取り込む。
#
# turnmark は「前日までのデータ」しか出さない。当日日付は404で、ある日のファイルは
# 翌朝(JST 05:30頃)に1回だけ書かれ、その後は更新されない。したがって日中に何度も
# 叩く意味はなく、翌朝以降に1回で足りる。
#
# 発火を2便にしているのは GitHub の schedule 遅延対策(実績で1.5〜3.8時間ずれる)。
#   1便 JST 07:00 … 本命。turnmark の書き込み(JST 05:30頃)の後
#   2便 JST 13:00 … 1便が遅延・不発だった日の回収枠
# ODDS_WINDOW=2 で前日と2日前を見るため、1日落としても翌日に自然に埋まる。
#
# results / preview とは別リポジトリ・別ライフサイクルなので相乗りしない。
# concurrency も別グループにして互いのコミットを待たせない。
#
# odds/ は全項目を持つ生データ（1日 約0.4MB）。読者に出すのは単勝6値だけなので、
# 取得の直後に buildOddsSite.py で docs/results/odds/YYYYMMDD.json（1日 約4KB）へ落とす。
# 別WFに分けない：schedule は実績で1.5〜3.8時間ずれるため、odds/ が書かれる前に
# 走ると取りこぼす。取得と同じジョブで直列に回すのが唯一確実。

on:
  schedule:
    # JST 07:00（UTC 22:00 前日）と JST 13:00（UTC 04:00）。
    - cron: "0 22 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      hd:
        description: "取得する日付(YYYYMMDD)。カンマ区切りで複数可。空欄なら前日から2日ぶん。"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # results / preview とは別グループ。
  group: boatrace-odds
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build odds (前日分・turnmark v1)
        run: python scripts/buildOdds.py
        env:
          HD: ${{ github.event.inputs.hd }}
          # 前日と2日前。日付境界をまたぐ実行で前日分を取りこぼさないための窓。
          ODDS_WINDOW: "2"

      - name: build odds site (単勝のみの軽量JSON)
        if: always()
        run: python scripts/buildOddsSite.py

      - name: commit
        if: always()
        env:
          BR: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add odds/ 2>/dev/null || true
          git add docs/results/odds/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no changes"; exit 0
          fi
          # 先にコミット（未コミット変更を残さない）→ autostash衝突でマーカーが混入する事故を防ぐ。
          git commit -m "auto: odds update"
          # 生成物はrun毎に取得時刻が変わるため既存コミットと衝突しうる。
          # rebase(-X theirs=自分の再生成データを優先)で機械的に解消し、衝突マーカーは絶対にコミットしない。
          # push競合は指数的でなく短いランダム待機でリトライ。
          for i in 1 2 3 4 5 6; do
            git fetch origin "$BR" || true
            if git rebase -X theirs "origin/$BR"; then
              if git push origin "HEAD:$BR"; then
                echo "pushed (try $i)"; exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $(( (RANDOM % 6) + 3 ))
          done
          echo "push retries exhausted"; exit 1
