# kick 2026-06-20
name: モーターデータ自動更新

on:
  schedule:
    # 朝（JST 8:07 / 8:37 / 9:07）当日分
    - cron: '7 23 * * *'
    - cron: '37 23 * * *'
    - cron: '7 0 * * *'
    # 夜（JST 22:50 / 23:20）翌日分の予習用（出走表より少し前に）
    - cron: '50 13 * * *'
    - cron: '20 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boatrace-motors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pandas lxml
      - run: python scripts/scrape_motors.py
      - name: commit and push
        if: always()  # 途中失敗でも既存CSVを壊さない（保存は成功時のみ・変更無ければ no change で抜ける）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git add docs/motor/motors_all.csv  # 累積CSVを確実にコミット対象へ
          # 変更なし＝push しない（正常）。
          git diff --staged --quiet && echo "no change（push 不要）" && exit 0
          git commit -m "モーターデータ自動更新 $(date +'%Y-%m-%d %H:%M')"
          # push に失敗したらリトライし、尽きたら落とす（旧: ループが sleep で終わり exit 0＝緑のまま未公開）。
          # 衝突で止まった rebase は解いてから再試行する（旧: unmerged のまま残り、2回目以降は必ず失敗していた）。
          PUSHED=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then PUSHED=1; break; fi
            git rebase --abort 2>/dev/null || true
            echo "push retry $i ..."
            sleep 5
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::error::push に失敗（5回のリトライを使い切った）。コミットは公開されていない"
            exit 1
          fi
          echo "pushed"
