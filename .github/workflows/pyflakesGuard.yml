name: pyflakesGuard
# build_highlights.py に「代入したが使っていない変数」などが入ったらPRを落とす。
# 記者の型の計算だけが残って出力につながっていない状態（2026-08-20〜09-19 の fit）を再発させないため。
on:
  pull_request:
    paths:
      - 'scripts/build_highlights.py'
      - '.github/workflows/pyflakesGuard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyflakes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyflakes==3.2.0
      - run: python -m pyflakes scripts/build_highlights.py
