name: probe raceresult (temporary)

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "hd:jcd:rno をスペース区切り"
        required: true
        default: "20261028:03:12 20261028:01:12 20261028:03:06 20261028:01:11 20261028:03:05 20261028:24:12"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch html
        env:
          TARGETS: ${{ github.event.inputs.targets }}
        run: |
          mkdir -p probe
          for t in $TARGETS; do
            IFS=: read hd jcd rno <<< "$t"
            curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -o "probe/${hd}_${jcd}_${rno}.html" -w "%{http_code} ${t}\n" \
              "https://www.boatrace.jp/owpc/pc/race/raceresult?rno=${rno}&jcd=${jcd}&hd=${hd}"
            sleep 1.5
          done
          ls -la probe
      - name: commit html to branch (temporary)
        env:
          BR: ${{ github.ref_name }}
        run: |
          mkdir -p tmpProbe
          cp probe/*.html tmpProbe/
          python -c "import sys,json;sys.path.insert(0,'scripts');import buildResults as b;json.dump(b.fetch_json('20261028'),open('v1.json','w'),ensure_ascii=False)"
          python scripts/probeParse.py scripts v1.json probe > tmpProbe/parsed.txt 2>&1 || true
          python scripts/probeE2e.py 20261028 1:11 3:5 23:9 8:9 8:5 1:9 7:2 > tmpProbe/e2e.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tmpProbe
          git commit -m "tmp: probe html" || exit 0
          git push origin "HEAD:$BR"
