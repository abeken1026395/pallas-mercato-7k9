# docs/ と AI向けの罠（functions/ + edge/）を Cloudflare Pages に載せる。
# リポジトリ連携ではなく直接アップロード：自動更新が数分おきに push するため、
# 連携ビルドだと無料枠（月500回）を1日で使い切る。直接アップロードなら変わったファイルだけが送られる。
# 罠が動くのは docs/_routes.json に書いた対象パスだけ（それ以外は静的配信のまま・関数の回数を使わない）。
# 必要な登録（けんが GitHub の Settings → Secrets and variables → Actions で行う）:
#   Secrets  : CLOUDFLARE_API_TOKEN（権限 Cloudflare Pages:Edit）, CLOUDFLARE_ACCOUNT_ID
#   Secrets  : CF_PAGES_PROJECT_SECRET（配信先の Pages プロジェクト名。名前は公開の場所に書かない＝Secrets に置き、ログでも伏せ字になる）
#
# 注意：自動更新WFが GITHUB_TOKEN で push したコミットは、GitHub の決まりで他のWFを起動しない。
# 1日数十回の自動更新はすべてそれなので、push トリガだけだと配信が止まる
# （2026-10-17 実測：人の push 3回しか動かず、配信先は古いままだった）。
# そのため自動更新WFの終了（workflow_run）と 10 分おきの定時でも動かし、前回の配信から main が変わっていなければ何もしない。
name: Cloudflare Pages 配信

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "functions/**"
      - "edge/**"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  # 自動更新WFが終わるたびに配る（2026-10-24 けん裁定 案A）。定時起動は #766 のマージから約1時間50分、1回も動かなかったため。
  # workflow_run は GITHUB_TOKEN の push の制限を受けない。下の一覧は「main に push するWFの name:」。WFを足したり名前を変えたらここも直す。
  workflow_run:
    branches: [main]
    types: [completed]
    workflows:
      - "選手フォーム指標 racerFormIndex 更新（日次）"
      - "トップ「今日の開催」データ生成"
      - "M8影運用（着外モデル・記録のみ）"
      - "predictions 昼の監視"
      - "夜間パイプライン統合（自己判断）"
      - "観戦記素材 当日朝リカバリ（自己修復）"
      - "regen predictions (parallel)"
      - "predictions 欠番台帳スキャン（夜）"
      - "荒れ指数 更新"
      - "beforeinfo部品交換収集"
      - "1マークの見立て（展示前版・実験場）"
      - "中止情報の取得"
      - "締切一覧メッセージ自動生成"
      - "E30選手別成績 更新"
      - "見どころ「明日」前夜プレビュー生成"
      - "検証ページ /kensho/ 更新（勝負駆け・体重・F持ち）"
      - "update kimarite"
      - "実況天候（直前気象）更新"
      - "モーター整備一覧 更新"
      - "updateNigeSecond"
      - "オッズ 翌朝取得"
      - "update payouts summary"
      - "直前情報 随時更新（日中）"
      - "選手プロフィール軽量版 更新"
      - "見立て結果照合（夜）"
      - "レース結果 随時更新（日中）"
      - "updateSenshuCard"
      - "スタート遅れ率の更新"
      - "updateTenjiStats"
      - "当日潮汐（事実情報）更新"
      - "更新履歴 追記"
      - "updateWakuStats"
      - "見どころJSON自動生成"
      - "モーターデータ自動更新"
      - "出走表データ自動更新"
      - "気象データ自動更新"
      - "遅い場の出走表を取れるまで待つ"
      - "観戦記 執筆起動（headless・前夜便/回収便・場単位・自動公開）"

# 走っている1本は最後まで走らせ、待ちは最新の1本だけ残す（古い待ちは自動で捨てられる）
concurrency:
  group: deployCloudflare
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ secrets.CF_PAGES_PROJECT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 前回の配信から main が変わっていなければ何もしない（定時起動の空回り防止）
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(git rev-parse HEAD)
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deployCloudflare.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          echo "前回の配信 $LAST / 今の main $NOW"
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_run" ]; } && [ "$LAST" = "$NOW" ]; then
            echo "変更なし。何もしない"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 登録の有無を確認（無ければここで赤にして気づけるようにする）
        if: steps.changed.outputs.skip == 'false'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Secrets に CLOUDFLARE_API_TOKEN が無い"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Secrets に CLOUDFLARE_ACCOUNT_ID が無い"; exit 1; }
          test -n "$PROJECT" || { echo "::error::Secrets に CF_PAGES_PROJECT_SECRET が無い"; exit 1; }

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.skip == 'false'
        with:
          node-version: 22

      - name: 罠のテスト
        if: steps.changed.outputs.skip == 'false'
        run: node --test edge/aiNotice.test.mjs

      - name: Pages プロジェクトが無ければ作る（2回目以降は何もしない）
        if: steps.changed.outputs.skip == 'false'
        run: |
          if npx -y wrangler@3 pages project list 2>/dev/null | grep -qw "$PROJECT"; then
            echo "既存プロジェクト $PROJECT を使う"
          else
            npx -y wrangler@3 pages project create "$PROJECT" --production-branch=main
          fi

      # 配信先の名前はリポジトリに書かない（Secrets にだけある）。ページ内の自分の住所は、
      # 旧URLの住所と旧プロジェクト名のまま書いてあり、ここでランナーの中だけ配信先の名前に書き換える。
      # 書き換えないと、新URLでコピー検知の「本物ではありません」の帯が出る。リポジトリの中身は変えない。
      - name: 配る直前に、ページ内の自分の住所を配信先に書き換える（ランナーの中だけ）
        if: steps.changed.outputs.skip == 'false'
        run: |
          rm -rf /tmp/site && cp -r docs /tmp/site
          python3 - <<'PY'
          import os, pathlib, re
          proj = os.environ["PROJECT"]
          # 作業メモ（.md）は配らない（ページからは読まれていない・リポジトリの手がかりが書いてある）
          md = [p for p in pathlib.Path("/tmp/site").rglob("*.md") if p.is_file()]
          for p in md:
              p.unlink()
          print(f"作業メモ（.md）を外した {len(md)} 件")
          old_base = "https://abeken1026395.github.io/pallas-mercato-7k9/"
          new_base = "https://" + proj + ".pages.dev/"
          pairs = [
              (old_base, new_base),
              ("datazeme.pages.dev", proj + ".pages.dev"),
              ("\\.datazeme\\.pages\\.dev", "\\." + proj + "\\.pages\\.dev"),
          ]
          n_files = n_hits = 0
          for p in pathlib.Path("/tmp/site").rglob("*"):
              if p.suffix not in (".html", ".js", ".xml", ".txt", ".webmanifest") or not p.is_file():
                  continue
              s = p.read_text(encoding="utf-8", errors="surrogateescape")
              t = s
              for a, b in pairs:
                  t = t.replace(a, b)
              # コピー検知の「旧URL（github.io）なら本物」の条件は、配信先では常に偽。
              # 条件ごと false にして、リポジトリの持ち主名・リポジトリ名をページに残さない（2026-10-24 けん「1塞ごう」）
              t = re.sub(r'location\.hostname\s*===\s*"abeken1026395\.github\.io"\s*&&\s*location\.pathname\.indexOf\("/pallas-mercato-7k9/"\)\s*===\s*0', "false", t)
              if p.name == "sw.js":
                  t = t.replace('"pallas-mercato-7k9-v1"', '"dz-v1"')
              # 実験場の一覧は GitHub のAPIでサンプルを探す。配信先ではAPIを呼ばない（手書きの一覧はそのまま出る）
              t = re.sub(r'fetch\("https://api\.github\.com/repos/abeken1026395/pallas-mercato-7k9/[^"]*"\)', 'Promise.reject(new Error("off"))', t)
              if p.name == "404.html":
                  t = re.sub(r"<script>[^<]*pallas-mercato-7k9[^<]*</script>\s*", "", t)
              if t != s:
                  n_files += 1
                  n_hits += sum(s.count(a) for a, _ in pairs)
                  p.write_text(t, encoding="utf-8", errors="surrogateescape")
          print(f"書き換え {n_files} ファイル / {n_hits} 箇所")
          # 門番：配るファイルに旧住所・リポジトリの手がかりが1つでも残っていたら配らない
          bad = []
          for p in pathlib.Path("/tmp/site").rglob("*"):
              if not p.is_file() or p.suffix not in (".html", ".js", ".json", ".csv", ".xml", ".txt", ".webmanifest", ".css"):
                  continue
              s = p.read_text(encoding="utf-8", errors="ignore")
              for k in ("datazeme", "abeken1026395", "pallas-mercato"):
                  if k in s:
                      bad.append(f"{p.relative_to('/tmp/site')} : {k} {s.count(k)}")
          for b in bad[:30]:
              print("残った:", b)
          if bad:
              raise SystemExit(f"::error::旧住所・リポジトリの手がかりが {len(bad)} 件残った")
          print("旧住所・リポジトリの手がかり 0 件")
          PY

      - name: docs と罠をアップロード
        if: steps.changed.outputs.skip == 'false'
        run: npx -y wrangler@3 pages deploy /tmp/site --project-name="$PROJECT" --branch=main --commit-dirty=true

      - name: 配信先の罠が効いているか確認（AIの名乗り→冗談、普通のブラウザ→本物）
        if: steps.changed.outputs.skip == 'false'
        run: |
          U="https://$PROJECT.pages.dev/racers/racers_today.csv"
          sleep 20
          AI=$(curl -s -A "Mozilla/5.0 (compatible; ChatGPT-User/1.0)" "$U" | head -c 8000)
          HU=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0) Chrome/130.0" -H "Accept-Language: ja-JP,ja;q=0.9" "$U" | head -c 8000)
          # 冗談の出走表には必ずフリーザが1人いて、場名は「ボートレース○○」（2026-10-24 作り直し・通告の文は無い）
          echo "$AI" | grep -q "フリーザ" || { echo "::error::AIの名乗りで本物が返っている"; exit 1; }
          echo "$HU" | grep -q "フリーザ" && { echo "::error::普通のブラウザに冗談が返っている"; exit 1; }
          echo "罠OK: AI→冗談 / 人間→本物"
          EN=$(curl -s -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7) Chrome/143.0.0.0 Safari/537.36" -H "Accept-Language: en-US,en;q=0.9" "$U" | head -c 8000)
          echo "$EN" | grep -q "フリーザ" || { echo "::error::日本語の無い言語設定（Grok 型）に本物が返っている"; exit 1; }
          echo "罠OK: 日本語の無い言語設定→冗談"
          G=$(curl -s "https://$PROJECT.pages.dev/assets/guard.js")
          echo "$G" | grep -q "$PROJECT.pages.dev" || { echo "::error::配信先の guard.js に配信先の名前が入っていない（新URLで偽物の帯が出る）"; exit 1; }
          echo "コピー検知OK: 配信先を本物として扱う"
          T=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0) Chrome/130.0" "https://$PROJECT.pages.dev/")
          echo "$T$G" | grep -q "abeken1026395\|pallas-mercato" && { echo "::error::配信先のトップか guard.js にリポジトリの手がかりが残っている"; exit 1; }
          echo "リポジトリの手がかりOK: トップ・guard.js とも0件"
