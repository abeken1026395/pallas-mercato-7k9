# mbrace 遮断のため Actions から実行不可。
# ローカルタスク boatrace-updateKimarite が正規経路。
#
#   scrapeKimarite.py は www1.mbrace.or.jp から競走成績(Kファイル)を取得するが、
#   GitHub Actions のランナーIPは mbrace に遮断されている。
#   このWFは 2026-07-16 実行分から失敗し続け、racerKimarite.csv は
#   2026-07-02 を最後に更新が止まっていた。
#
#   正規経路（毎月2・16日 JST 06:30・ローカルPC）:
#     scripts/updateKimariteLocal.ps1（登録: scripts/registerUpdateKimariteLocal.ps1）
#
#   schedule は削除した。workflow_dispatch は非常口として残す
#   （lhasa が入る Linux ランナーなら、mbrace に到達さえできれば動作するため）。
name: update kimarite

on:
  workflow_dispatch:        # 手動実行できるようにする（非常口。通常はローカルタスクが正規経路）

# 同時実行の取り合いを避ける（このジョブ専用グループ）
concurrency:
  group: boatrace-kimarite
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lhasa (lzh解凍)
        run: sudo apt-get update && sudo apt-get install -y lhasa

      - name: Run scraper
        env:
          KIMARITE_DAYS: "183"
          KIMARITE_SLEEP: "1.0"
        run: python scripts/scrapeKimarite.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/players/racerKimarite.csv
          if git diff --cached --quiet; then
            echo "変更なし。コミットしない。"
          else
            git commit -m "update kimarite (racerKimarite.csv)"
            git push
          fi
