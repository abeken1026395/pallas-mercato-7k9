name: updateNigeSecond

on:
  schedule:
    - cron: "30 18 * * *"   # UTC 18:30 = JST 03:30（results live update 後・kansenki 05:30 前）
  workflow_dispatch:

concurrency:
  group: updateNigeSecond
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: update
        run: python3 scripts/updateNigeSecond.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nigeSecond/base.csv docs/data/nigeSecond.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "auto: nigeSecond daily update"
          git push origin HEAD:main
