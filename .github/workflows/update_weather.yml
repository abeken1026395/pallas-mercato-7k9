name: 気象データ自動更新

on:
  schedule:
    - cron: '5 */3 * * *'   # 3時間ごと（UTC）。0,3,6...時の5分過ぎ
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boatrace-weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/fetch_weather.py
      - name: commit and push
        env:
          BR: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/weather.json
          if git diff --staged --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "update weather.json"
          # push競合(cannot lock ref)は短いランダム待機でリトライする。
          for i in 1 2 3 4 5 6; do
            git fetch origin "$BR" || true
            if git rebase -X theirs "origin/$BR"; then
              if git push origin "HEAD:$BR"; then
                echo "pushed (try $i)"; exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $(( (RANDOM % 6) + 3 ))
          done
          echo "push retries exhausted"; exit 1
