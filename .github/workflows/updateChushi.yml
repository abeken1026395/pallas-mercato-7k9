name: 中止情報の取得

# 公式「本日のレース一覧」から当日の中止レースを取り、docs/data/chushiToday.json に書く。
# 見どころ・出走表はこのJSONを読んで「中止」を出す。
# 中身が変わったときだけコミットする（ふだんの日はコミットもPagesデプロイも起きない）。
on:
  schedule:
    - cron: "*/20 22-23 * * *"   # JST 7:00〜8:40
    - cron: "*/20 0-14 * * *"    # JST 9:00〜23:40
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: updateChushi
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests beautifulsoup4

      - name: 中止情報を取得
        run: python scripts/fetchChushi.py

      - name: コミット＆プッシュ
        env:
          BR: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/chushiToday.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no changes（no-op）"; exit 0
          fi
          git commit -m "auto: update chushiToday.json"
          for i in 1 2 3 4 5 6; do
            git fetch origin "$BR" || true
            if git rebase -X theirs "origin/$BR"; then
              if git push origin "HEAD:$BR"; then echo "pushed (try $i)"; exit 0; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $(( (RANDOM % 6) + 3 ))
          done
          echo "push retries exhausted"; exit 1
