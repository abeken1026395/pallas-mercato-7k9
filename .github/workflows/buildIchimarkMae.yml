name: 1マークの見立て（展示前版）

# 当日の朝、出走表が出たあとに、展示を使わない見立てを作る（けん裁定 2026-10-31：朝に1回）。
# 書くのは docs/ichimark/mae_YYYYMMDD.json と maeIndex.json の2つだけ。
# 既に今日の分があれば作り直さない（冪等）。出走表がまだ無ければ何も書かずに終わる。
# GitHub の schedule は取りこぼすことがあるので朝に4回置く。JST 11:00から11:40の競合帯は外している。
#   '17 22 * * *' → JST 07:17 ／ '47 22 * * *' → JST 07:47 ／ '17 23 * * *' → JST 08:17 ／ '17 1 * * *' → JST 10:17
# 定時起動は数時間遅れたり起動しなかったりする（2026-11-01 初回 10:10、11-02 は 09:47 まで0回）。
# けん裁定 2026-11-02「1」：出走表の自動更新が成功したら続けて起動する。今日の分があれば何もしない。
# 続けての起動は JST 06:00 より前（前日の結果がそろう前）と 11:00から11:40 の競合帯では作らない。
# けん裁定 2026-11-03「1A」：起動のたびに実戦の答え合わせ（kotaeawase.json）も作り直す（11:00から11:40 は除く）。
# 一度出した日の見立ては書き換えない（手動で日付を指定しても、既にあれば作らない）。
on:
  workflow_run:
    workflows: ["出走表データ自動更新"]
    types: [completed]
  schedule:
    - cron: '17 22 * * *'
    - cron: '47 22 * * *'
    - cron: '17 23 * * *'
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      hd:
        description: '対象開催日（YYYYMMDD）。空ならJST当日'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ichimark-mae
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 対象日と既存の確認
        id: day
        env:
          IN_HD: ${{ github.event.inputs.hd }}
        run: |
          HD="$(echo "$IN_HD" | tr -d '[:space:]')"
          if [ -z "$HD" ]; then
            HD=$(python3 -c "from datetime import datetime,timezone,timedelta;print(datetime.now(timezone(timedelta(hours=9))).strftime('%Y%m%d'))")
          fi
          echo "hd=$HD" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            HM=$(python3 -c "from datetime import datetime,timezone,timedelta;print(datetime.now(timezone(timedelta(hours=9))).strftime('%H%M'))")
            if [ "$HM" -ge 1100 ] && [ "$HM" -le 1140 ]; then
              echo "quiet=1" >> "$GITHUB_OUTPUT"; echo "skip=1" >> "$GITHUB_OUTPUT"; echo "競合帯なので何もしない: JST $HM"; exit 0
            fi
            if [ "$HM" -lt 600 ]; then
              echo "skip=1" >> "$GITHUB_OUTPUT"; echo "見立ては作らない時刻（答え合わせだけ）: JST $HM"; exit 0
            fi
          fi
          if [ -f "docs/ichimark/mae_$HD.json" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "既にあります（書き換えない）: $HD"
          fi

      - uses: actions/setup-python@v5
        if: steps.day.outputs.quiet != '1'
        with:
          python-version: '3.12'

      - name: 依存
        if: steps.day.outputs.skip != '1'
        run: pip install numpy scikit-learn lightgbm==4.7.0

      - name: 見立てを作る
        if: steps.day.outputs.skip != '1'
        run: python scripts/ichimark/buildMae.py "${{ steps.day.outputs.hd }}"

      - name: 実戦の答え合わせ
        if: steps.day.outputs.quiet != '1'
        run: python scripts/ichimark/kotaeawase.py

      - name: commit and push
        if: steps.day.outputs.quiet != '1'
        env:
          BR: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ichimark/mae_*.json docs/ichimark/maeIndex.json docs/ichimark/kotaeawase.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "1マークの見立て（展示前版）: ${{ steps.day.outputs.hd }}（見立て・答え合わせ）"
          for i in 1 2 3 4 5 6; do
            git fetch origin "$BR" || true
            if git rebase "origin/$BR"; then
              if git push origin "HEAD:$BR"; then echo "pushed (try $i)"; exit 0; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $(( (RANDOM % 6) + 3 ))
          done
          echo "push retries exhausted"; exit 1
