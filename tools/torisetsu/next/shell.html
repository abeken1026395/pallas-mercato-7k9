<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>データ攻め トリセツ</title>
<meta name="description" content="データ攻めの読み方。記号の意味と、画面ごとの見かたを引けます。">
__FONTS__
<style>
:root{
  --mizu:#0d2730;      /* 水の底：地 */
  --mizuU:#143842;     /* 水面：引いた部分 */
  --sen:#23606a;       /* レーンの線 */
  --moji:#c3d0d0;
  --mojiS:#8aa6aa;
  --kigen:#e4ad4e;     /* 強調はこの1色だけ */
  --disp:'Dela Gothic One','Hiragino Sans','Noto Sans JP',sans-serif;
  --w1:#dfe6e6; --w1t:#10222a;
  --w2:#2b3238; --w2t:#f3f6f6;
  --w3:#cf4234; --w3t:#fff;
  --w4:#3579c6; --w4t:#fff;
  --w5:#ddb244; --w5t:#231c04;
  --w6:#2f8f5f; --w6t:#fff;
  --maru:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--mizu);color:var(--moji);
  font-family:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",sans-serif;
  font-size:16.5px;line-height:1.88;font-weight:400;
  letter-spacing:.01em;
}
.wrap{max-width:33em;margin:0 auto;padding:0 20px}
img{max-width:100%;display:block}
a{color:var(--kigen)}

/* ── 水位：読んだ量 ───────────────────── */
#gauge{position:fixed;top:0;left:0;height:3px;width:0;z-index:60;
  background:var(--sen);opacity:.9;transition:width .12s linear}

/* ── ヒーロー：6レーンのスタート ───────── */
#hero{position:relative;overflow:hidden;padding:0 0 34px;
  background:
    radial-gradient(120% 60% at 50% 0%,#153c47 0%,rgba(13,39,48,0) 60%),
    linear-gradient(180deg,#0a2028 0%,#0d2730 70%)}
#hero::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.028) 0 1px,transparent 1px 34px);
  pointer-events:none}
#lanes{position:relative;height:246px;margin-bottom:22px;padding-top:30px}
#lanes .ln{position:absolute;left:0;right:0;height:1px;background:var(--sen);opacity:.45}
#lanes .st{position:absolute;top:22px;bottom:14px;left:78%;width:2px;
  background:var(--kigen);opacity:.5}
#lanes .bt{position:absolute;width:44px;height:27px;
  clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%,10% 50%);
  display:flex;align-items:center;justify-content:center;padding-right:3px;
  font-family:var(--disp);font-size:15px;line-height:1;
  transform:translateX(-78px);opacity:0}
#lanes .wake{position:absolute;height:2px;width:0;
  background:linear-gradient(90deg,transparent,rgba(160,220,228,.34));opacity:0}
.go #lanes .bt{animation:dash 1s cubic-bezier(.16,.86,.4,1) forwards}
.go #lanes .wake{animation:wake 1s cubic-bezier(.16,.86,.4,1) forwards}
@keyframes dash{from{transform:translateX(-78px);opacity:0}
  45%{opacity:1}to{transform:translateX(0);opacity:1}}
@keyframes wake{from{width:0;opacity:0}45%{opacity:.9}to{width:var(--wk);opacity:.55}}

#hero h1{margin:0;font-family:var(--disp);font-weight:400;font-size:58px;color:#eef5f5;
  letter-spacing:.01em;line-height:1.05;
  text-shadow:4px 4px 0 rgba(228,173,78,.55)}
#hero h1 small{display:block;font-family:var(--disp);font-size:15px;letter-spacing:.14em;
  color:var(--kigen);margin-bottom:10px;text-shadow:none}
#hero .cre{margin:18px 0 0;font-size:16px;color:var(--mojiS)}
#hero .cre b{color:var(--moji);font-weight:700}
#hero .date{margin:20px 0 0;font-size:13px;color:#6b8990}
#ver{margin-left:10px;opacity:.75}

/* ── 3つの入口 ───────────────────────── */
.doors{display:grid;gap:10px;margin:24px 0 0}
.door{position:relative;overflow:hidden;display:block;text-decoration:none;color:var(--moji);
  background:linear-gradient(90deg,#123a45,#0f313b);
  padding:16px 18px;border-radius:var(--maru);border:1px solid #1f515b}
.door b{display:block;font-family:var(--disp);font-weight:400;font-size:19px;letter-spacing:.02em}
.door span{font-size:14px;color:var(--mojiS)}
.door i{position:absolute;right:10px;top:-10px;font-family:var(--disp);font-style:normal;
  font-size:76px;line-height:1;color:rgba(228,173,78,.13);pointer-events:none}

/* ── 部の扉 ──────────────────────────── */
.partttl{margin:0;padding:64px 0 34px;border-top:1px solid var(--sen);position:relative;overflow:hidden}
.partttl .no{font-family:var(--disp);font-size:13px;color:var(--kigen);letter-spacing:.16em}
.partttl .nm{font-family:var(--disp);font-weight:400;font-size:40px;letter-spacing:.01em;
  line-height:1.15;margin:6px 0 12px;color:#eef5f5}
.partttl::before{content:attr(data-n);position:absolute;right:-6px;top:22px;
  font-family:var(--disp);font-size:150px;line-height:1;color:rgba(228,173,78,.07);pointer-events:none}
.partttl .cap{font-size:15px;color:var(--mojiS);line-height:1.8}
.bg1 .nm,.bg2 .nm,.bg3 .nm{color:#e6eeee}

/* ── 見出し ──────────────────────────── */
h3.step,h3.pg{position:sticky;top:0;z-index:30;margin:38px 0 14px;
  padding:12px 0 10px;background:var(--mizu);
  font-family:var(--disp);font-weight:400;font-size:21px;letter-spacing:.01em;line-height:1.3;color:#eef5f5;
  border-bottom:1px solid var(--sen);
  display:flex;align-items:center;gap:10px}
h3.step .n{flex:none;width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-family:var(--disp)}
h3.pg::before{content:"";flex:none;width:6px;height:25px;border-radius:3px;background:#36808a}
h3 .tag{flex:none;margin-left:auto;font-size:12px;font-weight:700;letter-spacing:0;
  font-family:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  color:var(--mojiS);border:1px solid var(--sen);border-radius:999px;padding:2px 9px}
h3 .tag.new{color:var(--kigen);border-color:var(--kigen)}
h4{margin:30px 0 8px;font-size:17px;font-weight:700;letter-spacing:0;color:#9fc0c4}
p{margin:0 0 14px}
.small{font-size:14px;color:var(--mojiS);line-height:1.8}

/* ── 枠色（番号・縁） ────────────────── */
.k1{background:var(--w1);color:var(--w1t)}.k2{background:var(--w2);color:var(--w2t);box-shadow:inset 0 0 0 1px #6f7c86}
.k3{background:var(--w3);color:var(--w3t)}.k4{background:var(--w4);color:var(--w4t)}
.k5{background:var(--w5);color:var(--w5t)}.k6{background:var(--w6);color:var(--w6t)}

/* ── 写真と番号の対応 ────────────────── */
figure{margin:18px 0}
figure img{cursor:zoom-in;background:#0d2730;filter:saturate(.92) brightness(.97)}
figcaption{margin-top:7px;font-size:13.5px;color:var(--mojiS)}
ol.lg{counter-reset:c;list-style:none;margin:10px 0 18px;padding:0}
ol.lg>li{counter-increment:c;position:relative;padding:9px 0 9px 40px;cursor:pointer;
  border-bottom:1px solid rgba(29,90,99,.45);font-size:16px;line-height:1.75}
ol.lg>li:last-child{border-bottom:0}
ol.lg>li::before{content:counter(c);position:absolute;left:0;top:10px;
  width:26px;height:26px;border-radius:50%;box-sizing:border-box;
  border:2px solid var(--kigen);color:var(--kigen);background:transparent;
  font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;
  transition:background-color .15s,color .15s}
ol.lg>li.on{background:rgba(228,173,78,.07);box-shadow:inset 3px 0 0 var(--kigen)}
ol.lg>li.on::before{background:var(--kigen);color:#241900;box-shadow:0 0 0 4px rgba(228,173,78,.22)}
ul{margin:10px 0 16px;padding-left:1.25em}
li{margin-bottom:6px}

/* ── 囲み ────────────────────────────── */
.use,.miss{margin:18px 0;padding:14px 16px;font-size:15.5px;line-height:1.8}
.use{background:rgba(255,255,255,.035);border-left:3px solid #4a8a94}
.miss{background:rgba(255,255,255,.035);border-left:3px solid var(--kigen)}
.use b,.miss b{display:block;font-family:var(--disp);font-weight:400;font-size:13px;letter-spacing:.08em;margin-bottom:6px}
.use b{color:#9fc6cc}.miss b{color:var(--kigen)}
.sign{margin:22px 0;padding:16px;background:var(--mizuU);border-radius:var(--maru);
  font-size:15.5px;line-height:1.8}
.end{margin:34px 0 0;padding:26px 0;border-top:1px solid var(--sen);
  font-size:15px;color:var(--mojiS)}

/* ── Q&A：押すと開く ─────────────────── */
.sy{border-bottom:1px solid rgba(29,90,99,.55)}
.sy .q{margin:0;padding:15px 34px 15px 0;position:relative;cursor:pointer;
  font-size:17px;font-weight:700;line-height:1.6;list-style:none;transition:padding .2s}
.sy.open .q{padding-left:14px;box-shadow:inset 3px 0 0 var(--kigen);color:#eef5f5}
.sy.open .a>div{padding-left:14px}
.sy .q::after{content:"";position:absolute;right:6px;top:22px;
  width:9px;height:9px;border-right:2px solid var(--kigen);border-bottom:2px solid var(--kigen);
  transform:rotate(45deg);transition:transform .22s ease}
.sy.open .q::after{transform:rotate(-135deg)}
.sy .a{overflow:hidden;max-height:0;transition:max-height .28s ease}
.sy .a>div{padding:0 0 15px;font-size:16px;line-height:1.85;color:#b8cacb}

/* ── 記号の表 ────────────────────────── */
table.sym{width:100%;border-collapse:collapse;margin:10px 0 20px;font-size:15.5px}
table.sym td{padding:10px 8px;border-bottom:1px solid rgba(29,90,99,.5);vertical-align:top;line-height:1.7}
table.sym td.k{width:6.4em;white-space:nowrap}
.chip{display:inline-block;padding:2px 8px;border-radius:4px;color:#fff;
  font-size:13px;font-weight:700;line-height:1.6}
.chipo{display:inline-block;padding:2px 8px;border-radius:4px;border:1px solid;
  font-size:13px;font-weight:700;line-height:1.6}
.waku{display:inline-block;width:34px;height:34px;line-height:34px;text-align:center;
  border-radius:5px;font-weight:900;margin:0 3px;font-size:17px}
.w1{background:var(--w1);color:var(--w1t)}.w2{background:var(--w2);color:var(--w2t);box-shadow:inset 0 0 0 1px #6f7c86}
.w3{background:var(--w3);color:var(--w3t)}.w4{background:var(--w4);color:var(--w4t)}
.w5{background:var(--w5);color:var(--w5t)}.w6{background:var(--w6);color:var(--w6t)}
.kim{display:inline-block;width:46px;height:13px;border-radius:2px}

/* ── もくじ ──────────────────────────── */
#toc{position:fixed;left:0;right:0;bottom:0;height:90vh;z-index:70;background:#0b222a;
  border-radius:24px 24px 0 0;border-top:1px solid #2a6470;
  box-shadow:0 -12px 40px rgba(0,0,0,.5);
  overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.3,1);
  -webkit-overflow-scrolling:touch}
#toc::before{content:"";position:sticky;top:10px;display:block;width:44px;height:5px;
  margin:0 auto;border-radius:3px;background:#2f6a75;z-index:1}
#shade{position:fixed;inset:0;z-index:69;background:rgba(3,14,18,.55);
  opacity:0;pointer-events:none;transition:opacity .3s}
#shade.on{opacity:1;pointer-events:auto}
#toc.on{transform:translateY(0)}
#toc .inr{max-width:33em;margin:0 auto;padding:12px 20px 120px}
#toc h2{font-family:var(--disp);font-weight:400;font-size:26px;letter-spacing:.02em;margin:0 0 4px}
#toc .gp{margin:28px 0 8px;font-family:var(--disp);font-size:12px;letter-spacing:.14em;color:var(--kigen)}
#toc a{display:flex;gap:11px;align-items:center;padding:11px 0;
  border-bottom:1px solid rgba(29,90,99,.45);color:var(--moji);
  text-decoration:none;font-size:17px;font-weight:700}
#toc a i{flex:none;width:24px;height:24px;border-radius:50%;font-style:normal;
  font-family:var(--disp);font-size:11px;display:flex;align-items:center;justify-content:center}
#toc a i.dot{width:10px;height:10px;margin:0 7px;background:#2d7b84}
#toc a i.bar{width:5px;height:19px;border-radius:3px;margin:0 9.5px;background:#2d7b84}
#toc .gp.hide,#toc a.hide{display:none}
#srch{width:100%;margin:14px 0 0;padding:13px 14px;font-size:17px;
  background:var(--mizuU);color:var(--moji);border:1px solid var(--sen);border-radius:10px;
  font-family:inherit}
#srch::placeholder{color:#6b8f94}
#hit{margin:8px 0 0;font-size:13px;color:var(--mojiS);min-height:1.6em}

/* ── 下の帯 ──────────────────────────── */
#bar{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:65;display:flex;border-radius:999px;overflow:hidden;
  background:rgba(14,44,53,.92);border:1px solid #2a6470;
  box-shadow:0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(10px)}
#bar button{flex:1;background:none;border:0;color:var(--moji);min-width:0;
  font-family:inherit;font-size:14.5px;font-weight:700;padding:15px 4px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar #bBack{color:var(--kigen)}
#siteTop{position:absolute;left:12px;top:4px;z-index:2;display:inline-flex;align-items:center;
  min-height:44px;padding:0 8px;font-size:13px;color:var(--mojiS);
  text-decoration:underline;text-underline-offset:3px}
#bar button+button{border-left:1px solid #2a6470}
#bar button:active{background:rgba(228,173,78,.14)}

/* ── 写真の拡大 ──────────────────────── */
#zoom{position:fixed;inset:0;z-index:90;background:rgba(9,28,35,.97);
  display:none;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
#zoom.on{display:flex}
#zoom img{max-width:100%;max-height:92vh;object-fit:contain;border:1px solid var(--sen)}

.sec{position:relative}
ol.lg>li>b{display:block;color:#dde8e8;font-size:16.5px;margin-bottom:1px}

/* ── 図の順番再生 ───────────────────── */
.playbtn{display:inline-flex;align-items:center;gap:8px;margin:2px 0 0;
  background:none;border:1px solid var(--sen);color:var(--moji);
  font-family:inherit;font-size:14px;font-weight:700;
  padding:7px 14px;border-radius:999px;cursor:pointer}
.playbtn::before{content:"";width:0;height:0;border-left:9px solid var(--kigen);
  border-top:6px solid transparent;border-bottom:6px solid transparent}
.playbtn.on::before{width:9px;height:11px;border:0;background:var(--kigen);border-radius:1px}
figure.play{position:sticky;top:54px;z-index:20;
  background:var(--mizu);padding-bottom:8px;margin-bottom:10px}
figure.play figcaption{display:none}
.vp{position:relative;overflow:hidden;border-radius:16px;border:1px solid #2a5c66;
  box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.04)}
figure.play .vp{background:#0d2730;border-color:#3d7c87}
.pan{position:relative;transition:transform .6s cubic-bezier(.3,.85,.3,1)}
.pan img{display:block;width:100%;border:0}
.hot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
  background:transparent;border:0;padding:0;margin:0;cursor:pointer}
.hot:focus-visible{outline:2px solid var(--kigen)}
figure.play .pan img{filter:none}
.ring{position:absolute;border-radius:50%;pointer-events:none;
  border:3px solid #fff;opacity:0;transition:opacity .2s;
  box-shadow:0 0 0 5px rgba(228,173,78,.85),0 0 22px rgba(228,173,78,.55)}
figure.play .ring{opacity:1;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:translate(-50%,-50%) scale(1)}
  16%{transform:translate(-50%,-50%) scale(1.25)}
  38%{transform:translate(-50%,-50%) scale(1)}}
.ring{transform:translate(-50%,-50%)}
.cue{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;
  background:var(--kigen);color:#241900;font-weight:900;font-size:17px;
  display:none;align-items:center;justify-content:center;
  box-shadow:0 0 0 5px rgba(228,173,78,.25)}
figure.play .cue{display:flex;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
figure{position:relative}

/* ── 部の扉：線が引かれる ───────────── */
.partttl{position:relative}
.partttl::after{content:"";position:absolute;left:0;bottom:16px;height:2px;width:0;
  background:linear-gradient(90deg,var(--kigen),transparent);transition:width 1.1s cubic-bezier(.16,.86,.4,1)}
.partttl.seen::after{width:78%}

/* ── 答えが開いたときの一瞬の光 ─────── */
@keyframes flash{from{background:rgba(228,173,78,.16)}to{background:transparent}}
.sy.just .a>div{animation:flash .9s ease-out}

/* ── もくじ：下から順に ─────────────── */
#toc.on #list>*{animation:rise .34s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#lanes{cursor:pointer}


/* ── 送りの残り時間が帯で出る ───────── */
.playbtn{position:relative;overflow:hidden}
.playbtn .bar{position:absolute;left:0;top:0;bottom:0;width:0;
  background:rgba(228,173,78,.22);pointer-events:none}
.playbtn.on .bar{animation:fill 2.4s linear infinite}
@keyframes fill{from{width:0}to{width:100%}}
.nav{display:none;gap:8px;margin:10px 0 0 8px;vertical-align:middle}
figure .playbtn{margin-top:10px}
.nav.on{display:inline-flex}
.nav button{width:38px;height:38px;border-radius:50%;background:none;
  border:1px solid var(--sen);color:var(--moji);font-size:15px;
  font-family:inherit;cursor:pointer;position:relative;overflow:hidden}

/* ── 貼りついた見出しは細くなる ─────── */
h3.step,h3.pg{transition:padding .22s ease,font-size .22s ease}
h3.stuck{font-size:17px;padding:9px 0 8px;border-bottom-color:var(--kigen)}
h3.stuck .n{width:24px;height:24px;font-size:13px}
h3.stuck::before{height:19px}
figure.play{top:46px}

/* ── 押したときの手ごたえ ──────────── */
*{-webkit-tap-highlight-color:transparent}
.playbtn,.nav button,#bar button,.door,#toc a,.sy .q{
  transition:transform .09s ease,background-color .09s ease,border-color .09s ease}
.playbtn:active,.nav button:active{transform:scale(.94);border-color:var(--kigen)}
.door:active{transform:scale(.985);background:#19424d}
.sy .q:active{color:var(--kigen)}
figure img:active{opacity:.82}

/* ── 水紋：ポワンと広がって薄く消える ── */
#ripL{position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;
  pointer-events:none;overflow:hidden}
.rip{position:absolute;border-radius:50%;box-sizing:border-box;
  transform:translate(-50%,-50%);
  width:14px;height:14px;opacity:0;
  border:4px solid rgba(228,173,78,.62);
  box-shadow:0 0 14px rgba(228,173,78,.45),inset 0 0 14px rgba(228,173,78,.35);
  animation:rip 1.15s linear forwards}
.rip.r2{animation-delay:.13s;animation-duration:1.3s;border-color:rgba(228,173,78,.45)}

@keyframes rip{
  0%  {width:14px; height:14px; opacity:0;   border-width:4px}
  7%  {opacity:1}
  25% {width:118px;height:118px;border-width:3px}
  55% {width:184px;height:184px;opacity:.55;border-width:2px}
  100%{width:238px;height:238px;opacity:0;   border-width:1px}
}

/* ── 水位の先に艇の点 ───────────────── */
#gauge{position:fixed;overflow:visible}
#gauge::after{content:"";position:absolute;right:-2px;top:-2px;
  width:7px;height:7px;border-radius:50%;background:var(--kigen);
  box-shadow:0 0 10px rgba(228,173,78,.9)}

/* ── スタートラインの揺らぎ（ヒーローだけ） ── */
#lanes .st{animation:sway 5.5s ease-in-out infinite}
@keyframes sway{0%,100%{opacity:.35}50%{opacity:.7}}

main{padding-bottom:112px}
@media (max-width:380px){
  body{font-size:16px}#hero h1{font-size:33px}.partttl .nm{font-size:29px}
  h3.step,h3.pg{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  #lanes .bt{transform:none;opacity:1}
}
</style>
</head>
<body>
<div id="gauge"></div>

<section id="hero">
  <a id="siteTop" href="../">← データ攻め トップ</a>
  <div id="lanes"></div>
  <div class="wrap">
    <h1><small>データ攻め</small>トリセツ</h1>
    <p class="cre"><b>材料はそろえた。決めるのは、あなた。</b><br>
    このサイトの記号と画面の見かたを、ここに全部置いています。</p>
    <div class="doors">
      <a class="door d1" href="#p1"><i>1</i><b>はじめの3分</b><span>まずここだけ。5つの手順です</span></a>
      <a class="door d2" href="#p2"><i>2</i><b>困ったとき</b><span>記号の意味／画面がおかしく見えるとき</span></a>
      <a class="door d3" href="#p3"><i>3</i><b>画面の辞書</b><span>12の画面を1つずつ。引いてください</span></a>
    </div>
    <p class="date">2026年9月30日の画面です（出走表とモーターは10月1日）<span id="ver"></span></p>
  </div>
</section>

<main class="wrap">
__BODY__
</main>

<div id="toc"><div class="inr">
  <h2>もくじ</h2>
  <input id="srch" type="search" placeholder="記号や言葉でさがす（例：N少）" autocomplete="off">
  <p id="hit"></p>
  <div id="list">__TOC__</div>
</div></div>

<div id="bar">
  <button id="bBack">◀ データ攻め</button>
  <button id="bTop">さいしょへ</button>
  <button id="bToc">もくじ・さがす</button>
</div>

<div id="zoom"><img alt=""></div>

<script>
var VER='n';document.getElementById('ver').textContent='版 '+VER;
__CUE__
/* ヒーロー：レーンを描いて、1回だけ走らせる */
(function(){
  var L=document.getElementById('lanes');
  var back=[0,7,13,22,30,41];          /* 助走のちがい：きれいに揃えない */
  for(var i=0;i<6;i++){
    var y=30+i*34, dl=(.12+i*.065)+'s', px=back[i];
    var ln=document.createElement('div');ln.className='ln';
    ln.style.top=(y+27)+'px';L.appendChild(ln);
    var w=document.createElement('div');w.className='wake';
    w.style.top=(y+13)+'px';w.style.right='calc(22% + '+(px+38)+'px)';
    w.style.setProperty('--wk',(32+i*9)+'%');
    w.style.animationDelay=dl;L.appendChild(w);
    var b=document.createElement('div');b.className='bt k'+(i+1);b.textContent=i+1;
    b.style.top=y+'px';b.style.left='calc(78% - '+(42+px)+'px)';
    b.style.animationDelay=dl;L.appendChild(b);
  }
  var st=document.createElement('div');st.className='st';L.appendChild(st);
  requestAnimationFrame(function(){document.body.classList.add('go');});
})();


/* 図と説明をつなぐ：行を押すと図がその丸を映す。順番再生もできる */
(function(){
  var CUE=window.CUE||{},timer=null,cur=null;

  function leave(){
    if(timer){clearInterval(timer);timer=null;}
    if(!cur)return;
    cur.fig.classList.remove('play');
    cur.btn.classList.remove('on');
    cur.btn.label.nodeValue='順番に見る';
    cur.nav.classList.remove('on');
    cur.pan.style.transform='';cur.vp.style.height='';
    cur.lis.forEach(function(x){x.classList.remove('on');});
    cur=null;
  }

  document.querySelectorAll('figure').forEach(function(fig){
    var img=fig.querySelector('img');
    if(!img)return;
    var ol=fig.nextElementSibling;
    while(ol&&ol.tagName!=='OL'&&ol.tagName!=='FIGURE'&&ol.tagName!=='H3'&&ol.tagName!=='H4')
      ol=ol.nextElementSibling;
    if(!ol||ol.tagName!=='OL'||!ol.classList.contains('lg'))return;
    var lis=[].slice.call(ol.querySelectorAll('li'));
    var key=(img.getAttribute('src')||'').replace(/^.*\/|\.jpg$/g,'');
    var c=CUE[key];
    if(!c||c.ys.length!==lis.length||lis.length<3){
      lis.forEach(function(li){               /* 図と対応が取れない表は印だけ */
        li.addEventListener('click',function(){
          var on=li.classList.contains('on');
          lis.forEach(function(x){x.classList.remove('on');});
          if(!on)li.classList.add('on');
        });
      });
      return;
    }

    var vp=document.createElement('div');vp.className='vp';
    var pan=document.createElement('div');pan.className='pan';
    img.parentNode.insertBefore(vp,img);
    pan.appendChild(img);vp.appendChild(pan);
    var ring=document.createElement('span');ring.className='ring';pan.appendChild(ring);
    var cue=document.createElement('div');cue.className='cue';fig.appendChild(cue);
    c.ys.forEach(function(y,i){                 /* 図の中の番号そのものを押せる */
      var h=document.createElement('button');h.className='hot';h.type='button';
      h.setAttribute('aria-label','説明 '+(i+1));
      h.style.left=(c.cx*100)+'%';h.style.top=(y*100)+'%';
      h.addEventListener('click',function(e){e.stopPropagation();enter(i,false);});
      pan.appendChild(h);
    });
    function sizeHot(){
      var d=Math.max(44,2*c.r*img.offsetWidth+10)+'px';
      pan.querySelectorAll('.hot').forEach(function(h){h.style.width=d;h.style.height=d;});
    }
    img.addEventListener('load',sizeHot);sizeHot();addEventListener('resize',sizeHot);

    var btn=document.createElement('button');btn.className='playbtn';
    var bar=document.createElement('span');bar.className='bar';btn.appendChild(bar);
    var label=document.createTextNode('順番に見る');btn.appendChild(label);btn.label=label;
    var nav=document.createElement('span');nav.className='nav';
    var prev=document.createElement('button');prev.textContent='◀';prev.setAttribute('aria-label','前へ');
    var next=document.createElement('button');next.textContent='▶';next.setAttribute('aria-label','次へ');
    nav.appendChild(prev);nav.appendChild(next);
    fig.appendChild(btn);fig.appendChild(nav);

    var at=-1,last=0;
    function show(i){
      last=i;
      var iw=img.offsetWidth,ih=img.offsetHeight;
      if(!img.complete||ih<60){img.loading='eager';return;}
      vp.style.height=Math.round(Math.min(innerHeight*0.46,ih))+'px';
      var vh=vp.clientHeight,d=2*c.r*iw;
      ring.style.width=d+'px';ring.style.height=d+'px';
      ring.style.left=(c.cx*100)+'%';ring.style.top=(c.ys[i]*100)+'%';
      var t=vh*0.42-c.ys[i]*ih;
      t=Math.max(Math.min(t,0),Math.min(0,vh-ih));
      pan.style.transform='translateY('+t+'px)';
      cue.textContent=i+1;
      cue.style.animation='none';void cue.offsetHeight;cue.style.animation='';
    }
    img.addEventListener('load',function(){if(fig.classList.contains('play'))show(last);});

    function enter(i,scroll){
      if(cur&&cur.fig!==fig)leave();
      if(!cur){
        cur={fig:fig,btn:btn,lis:lis,pan:pan,vp:vp,nav:nav};
        fig.classList.add('play');nav.classList.add('on');
        img.loading='eager';
        vp.style.height=Math.round(innerHeight*0.46)+'px';
      }
      at=i;
      lis.forEach(function(x){x.classList.remove('on');});
      lis[i].classList.add('on');
      show(i);
      setTimeout(function(){
        if(scroll){
          var r=fig.getBoundingClientRect();
          if(r.top<40||r.top>innerHeight*0.4)scrollBy({top:r.top-46,behavior:'smooth'});
          return;
        }
        /* 図は上に貼りつくので、貼りついたときの下端で測る */
        var base=46+fig.offsetHeight+14;
        var q=lis[i].getBoundingClientRect();
        if(q.top<base||q.bottom>innerHeight-72)
          scrollTo({top:scrollY+q.top-base,behavior:'smooth'});
      },40);
    }

    lis.forEach(function(li,i){
      li.addEventListener('click',function(){
        if(cur&&cur.fig===fig&&at===i&&!timer){leave();return;}
        if(timer){clearInterval(timer);timer=null;
          btn.classList.remove('on');btn.label.nodeValue='順番に見る';}
        enter(i,false);
      });
    });

    function tick(){
      if(at+1>=lis.length){
        clearInterval(timer);timer=null;
        btn.classList.remove('on');btn.label.nodeValue='順番に見る';
        return;
      }
      enter(at+1,false);
    }
    btn.addEventListener('click',function(){
      if(timer){clearInterval(timer);timer=null;
        btn.classList.remove('on');btn.label.nodeValue='順番に見る';return;}
      enter(cur&&cur.fig===fig&&at>=0?at:0,at<0);
      btn.classList.add('on');btn.label.nodeValue='とめる';
      bar.style.animation='none';void bar.offsetHeight;bar.style.animation='';
      timer=setInterval(tick,2400);
    });
    function step(d){
      var i=Math.max(0,Math.min(lis.length-1,(at<0?0:at)+d));
      enter(i,false);
      if(timer){clearInterval(timer);timer=setInterval(tick,2400);
        bar.style.animation='none';void bar.offsetHeight;bar.style.animation='';}
    }
    prev.onclick=function(e){e.stopPropagation();step(-1);};
    next.onclick=function(e){e.stopPropagation();step(1);};
  });

  addEventListener('keydown',function(e){if(e.key==='Escape')leave();});
})();

/* 貼りついた見出しを細くする */
(function(){
  var hs=[].slice.call(document.querySelectorAll('h3.step,h3.pg')),tick=false;
  function upd(){
    tick=false;
    hs.forEach(function(h){
      var t=h.getBoundingClientRect().top;
      h.classList.toggle('stuck',t<=1&&t>-4);
    });
  }
  addEventListener('scroll',function(){
    if(!tick){tick=true;requestAnimationFrame(upd);}
  },{passive:true});
  upd();
})();

/* 水紋：画面のどこを押しても出る（スクロールのときは出さない） */
(function(){
  var L=document.createElement('div');L.id='ripL';document.body.appendChild(L);
  var sx=0,sy=0,sv=0,ok=false;
  function pt(e){var t=(e.changedTouches&&e.changedTouches[0])||(e.touches&&e.touches[0])||e;
    return {x:t.clientX,y:t.clientY};}
  function down(e){var p=pt(e);sx=p.x;sy=p.y;sv=window.pageYOffset;ok=true;}
  function up(e){
    if(!ok)return;ok=false;
    var p=pt(e);
    if(Math.abs(p.x-sx)>12||Math.abs(p.y-sy)>12)return;
    if(Math.abs(window.pageYOffset-sv)>4)return;
    ['','r2'].forEach(function(k){
      var s=document.createElement('span');s.className='rip '+k;
      s.style.left=p.x+'px';s.style.top=p.y+'px';
      L.appendChild(s);
      setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},1900);
    });
  }
  if(window.PointerEvent){
    addEventListener('pointerdown',down,true);
    addEventListener('pointerup',up,true);
    addEventListener('pointercancel',function(){ok=false;},true);
  }else{
    addEventListener('touchstart',down,true);
    addEventListener('touchend',up,true);
    addEventListener('mousedown',down,true);
    addEventListener('mouseup',up,true);
  }
})();

/* 水位 */
var g=document.getElementById('gauge');
function gauge(){
  var h=document.documentElement.scrollHeight-innerHeight;
  g.style.width=(h>0?Math.min(100,scrollY/h*100):0)+'%';
}
addEventListener('scroll',gauge,{passive:true});gauge();

/* Q&A：押すと開く */
document.querySelectorAll('.sy').forEach(function(s){
  var q=s.querySelector('.q'),a=s.querySelector('.a');
  if(!q||!a)return;
  var in_=document.createElement('div');
  while(a.firstChild)in_.appendChild(a.firstChild);
  a.appendChild(in_);
  q.setAttribute('tabindex','0');q.setAttribute('role','button');
  function tg(){
    var o=s.classList.toggle('open');
    a.style.maxHeight=o?(in_.scrollHeight+4)+'px':'0px';
    s.classList.remove('just');
    if(o){void s.offsetWidth;s.classList.add('just');}
    q.setAttribute('aria-expanded',o?'true':'false');
  }
  q.addEventListener('click',tg);
  q.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();tg();}
  });
});

/* 写真の拡大 */
var z=document.getElementById('zoom'),zi=z.querySelector('img');
document.querySelectorAll('figure img').forEach(function(im){
  im.addEventListener('click',function(){zi.src=im.currentSrc||im.src;z.classList.add('on');});
});
z.addEventListener('click',function(){z.classList.remove('on');});

/* もくじ・さがす */
var toc=document.getElementById('toc');
var shade=document.createElement('div');shade.id='shade';document.body.appendChild(shade);
function openToc(o){toc.classList.toggle('on',o);shade.classList.toggle('on',o);
  document.body.style.overflow=o?'hidden':'';}
shade.addEventListener('click',function(){openToc(false);});
document.getElementById('bToc').addEventListener('click',function(){openToc(!toc.classList.contains('on'));});
document.getElementById('bTop').addEventListener('click',function(){openToc(false);scrollTo({top:0,behavior:'smooth'});});
toc.addEventListener('click',function(e){if(e.target.closest('a'))openToc(false);});

/* ページ内の移動（もくじ・入口）は履歴に積まない。積むと「戻る」が元のページに戻れなくなる */
document.addEventListener('click',function(e){
  var a=e.target.closest('a[href^="#"]'); if(!a)return;
  var t=document.getElementById(a.getAttribute('href').slice(1)); if(!t)return;
  e.preventDefault(); t.scrollIntoView();
  try{history.replaceState(null,'','#'+t.id);}catch(_){}
});

/* 戻る：来たページの名前を出して、そのページに戻す。外から来たときはトップへ */
(function(){
  var NAMES={'':'トップ','racers':'出走表','highlights':'見どころ','motor':'モーター',
    'motor-maintenance':'モーター整備','stadium':'24場','players':'選手図鑑','results':'レース結果',
    'payouts':'万舟のツボ','kensho':'検証','fan':'場の文化','uranai':'占い','announcers':'実況アナ',
    'glossary':'用語辞典','updates':'更新履歴'};
  var root=location.pathname.replace(/(torisetsu\/(index\.html)?|next\/torisetsu\.html)$/,'');
  var b=document.getElementById('bBack'), back=false;
  try{
    var u=new URL(document.referrer);
    if(u.origin===location.origin&&u.pathname.indexOf(root)===0&&u.pathname!==location.pathname){
      var seg=u.pathname.slice(root.length).split('/')[0];
      if(Object.prototype.hasOwnProperty.call(NAMES,seg)){ b.textContent='◀ '+NAMES[seg]; back=true; }
    }
  }catch(_){}
  b.addEventListener('click',function(){
    openToc(false);
    if(back&&history.length>1) history.back(); else location.href=root;
  });
})();
addEventListener('keydown',function(e){if(e.key==='Escape'){openToc(false);z.classList.remove('on');}});

/* 検索：見出しの中を順に当てる */
var items=[].map.call(document.querySelectorAll('#list a'),function(a){
  var t=document.getElementById(a.getAttribute('href').slice(1));
  var sec=[],n=t;
  while(n&&(n=n.nextElementSibling)){
    if(/^(H3)$/.test(n.tagName)||n.classList.contains('partttl'))break;
    sec.push(n.textContent);
  }
  return {a:a,txt:(a.textContent+' '+(t?t.textContent:'')+' '+sec.join(' ')).replace(/\s+/g,'')};
});
var srch=document.getElementById('srch'),hit=document.getElementById('hit');
var gps=[].slice.call(document.querySelectorAll('#list .gp'));
function groups(){
  gps.forEach(function(g){
    var any=false,n=g;
    while((n=n.nextElementSibling)&&n.tagName==='A'){
      if(!n.classList.contains('hide')){any=true;break;}
    }
    g.classList.toggle('hide',!any);
  });
}
srch.addEventListener('input',function(){
  var q=srch.value.replace(/\s+/g,'');
  if(!q){
    items.forEach(function(o){o.a.classList.remove('hide');});
    groups();hit.textContent='';return;
  }
  var n=0;
  items.forEach(function(o){
    var ok=o.txt.indexOf(q)>=0;o.a.classList.toggle('hide',!ok);if(ok)n++;
  });
  groups();
  hit.textContent=n?(n+'か所に出てきます'):'見つかりません。ちがう言葉でためしてください';
});
</script>
