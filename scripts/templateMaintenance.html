<style>
/* 1列のカード。表層＝その日の交換とモーターの経歴、深層＝全場の傾向と定義。サイト共通の濃紺に合わせた単一のダーク */
:root{
  color-scheme:dark;
  --bg:#0b1219; --panel:#111c27; --panel2:#0e1822; --line:#1e2d3c; --line2:#2a3d50;
  --txt:#e6edf3; --sub:#9db0c2; --dim:#7f93a6;
  /* 色の辞書（このページだけ）：橙＝大掛かり／鋼青＝軽微／青緑＝ペラ新／緑＝開催中／青＝選択中 */
  --big:#ffc27a; --bigbg:#3a2410; --bigb:#a8662a;
  --lite:#d6e9ff; --litebg:#16324a; --liteb:#2d5577;
  --pera:#8fe3cf; --perabg:#0f2e2a; --perab:#2f7d6c;
  --live:#9be39b;
  --steel:#7fb8e6;
  --sel:#2563a8; --selb:#5fa8ff;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:8px 64px}
a{color:#8fd0ff}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 10px 0 0;font-size:13px;color:var(--sub);text-underline-offset:3px}
header{padding:4px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.eyebrow{color:var(--steel);font-size:12px;letter-spacing:.18em;font-weight:700}
h1{font-size:24px;font-weight:800;margin-top:2px;text-wrap:balance}
.date{color:var(--sub);font-size:13px;margin-top:2px}
.lead{color:var(--sub);font-size:14px;margin-top:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.lead b{color:var(--txt)}
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.tab{flex:1;min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--sub);font:700 14px var(--font);cursor:pointer}
.tab[aria-selected="true"]{color:#fff;background:var(--sel);border-color:var(--selb)}
.tab:focus-visible,.chipbtn:focus-visible,.mbtn:focus-visible,select:focus-visible,input:focus-visible,.ev:focus-visible{outline:2px solid var(--selb);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.chipbtn{min-height:36px;padding:0 12px;border:1px solid var(--line2);border-radius:18px;background:var(--panel);color:var(--sub);font:600 13px var(--font);cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--sel);color:#fff;border-color:var(--selb)}
.summary{color:var(--sub);font-size:13px;margin:4px 0 10px}
.summary b{color:var(--txt);font-variant-numeric:tabular-nums}
.vhead{scroll-margin-top:72px;font-size:15px;font-weight:800;margin:16px 0 6px;display:flex;align-items:baseline;gap:8px}
.vhead small{font-size:12px;color:var(--dim);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ev{display:grid;grid-template-columns:64px 1fr;gap:2px 10px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit}
.ev:first-child{border-top:0}
.ev:hover{background:#142231}
.mno{grid-row:span 2;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.mno small{display:block;font-size:11px;color:var(--dim);font-weight:600}
.who{font-size:14px;font-weight:700;min-width:0}
.who .tb{color:var(--dim);font-weight:500;font-size:12px;margin-left:4px}
.what{font-size:13.5px;color:var(--sub);min-width:0}
.p{display:inline-block;font-size:13px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--litebg);color:var(--lite);border:1px solid var(--liteb);margin:2px 4px 2px 0}
.p.big{color:var(--big);border-color:var(--bigb);background:var(--bigbg)}
.p.pera{background:var(--perabg);border-color:var(--perab);color:var(--pera)}
.tag{font-size:11.5px;font-weight:700;color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.tag.big{color:var(--big);border-color:var(--bigb)}
.tag.live{color:var(--live);border-color:#3f7a3f}
.tag.live::before{content:"● ";font-size:9px;vertical-align:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--dim);margin:8px 0 2px;align-items:center}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.ctl label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--dim);min-width:0}
select,input[type=search],input[type=number]{min-height:44px;background:var(--panel2);color:var(--txt);border:1px solid var(--line2);border-radius:8px;padding:0 10px;font:15px var(--font)}
input[type=search]{width:min(320px,100%)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin:8px 0 4px}
.mbtn{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--txt);font:700 15px var(--font);font-variant-numeric:tabular-nums;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:4px 0}
.mbtn i{font-style:normal;font-size:10px;color:var(--dim);letter-spacing:1px;min-height:12px}
.mbtn.has i{color:var(--steel)}
.mbtn.hasbig i{color:var(--big)}
.mbtn[aria-pressed="true"]{background:var(--sel);border-color:var(--selb);color:#fff}
.mbtn[aria-pressed="true"] i{color:#fff}
.karte{margin-top:14px;scroll-margin-top:72px}
.khead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.khead h2{font-size:20px;font-weight:800}
.xl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.xl a{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:1px solid var(--line2);border-radius:18px;font-size:13px;font-weight:700;color:var(--steel);text-decoration:none;background:var(--panel)}
.vhead .xs{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--steel)}
.khead .s{font-size:13px;color:var(--sub)}
.runs{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:6px}
.runs .rn{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--txt)}
.runs .ru{font-size:14px;color:var(--sub);font-weight:700}
.runs .rs{font-size:12.5px;color:var(--dim)}
.fresh{margin-top:6px;font-size:13px;color:var(--big);background:var(--bigbg);border:1px solid var(--bigb);border-radius:8px;padding:6px 10px}
.spark{margin:10px 0 2px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.spark svg{display:block;width:100%;height:auto}
.cap{font-size:12px;color:var(--dim);margin-top:4px}
.setsu{padding:11px 12px;border-top:1px solid var(--line)}
.setsu:first-child{border-top:0}
.sline{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.sline .per{font-weight:700;font-variant-numeric:tabular-nums}
.sline .nm{color:var(--sub);font-size:13px;min-width:0}
.sline .r2{margin-left:auto;font-size:13px;color:var(--sub);white-space:nowrap}
.sline .r2 b{color:var(--txt);font-size:15px;font-variant-numeric:tabular-nums}
.rider{font-size:14px;margin-top:2px}
.evl{font-size:13.5px;color:var(--sub);margin-top:4px}
.evl .d{color:var(--txt);font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.none{color:var(--dim);font-size:13px;margin-top:2px}
.note1{font-size:12px;color:var(--dim);margin-top:3px}
details{margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;padding:0 12px;font-weight:700;font-size:14px;color:var(--txt)}
details>div{padding:0 12px 12px;font-size:14px;color:var(--sub)}
details h3{font-size:14px;color:var(--txt);margin:12px 0 4px}
details p{margin:4px 0}
details ul{margin:4px 0 4px 18px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums;margin:6px 0}
.bars .lab{color:var(--sub);white-space:nowrap}
.bars .bar{height:12px;background:var(--liteb);border-radius:2px}
.bars .val{color:var(--txt);white-space:nowrap}
.bars .val small{color:var(--dim)}
.tw{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:3px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:600}
.more{margin-top:8px}
.empty{padding:18px;color:var(--dim);text-align:center}
footer{margin-top:18px;font-size:12px;color:var(--dim)}
.sample{font-size:12px;color:var(--steel);border:1px dashed var(--liteb);border-radius:8px;padding:6px 10px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

<div class="wrap">
<nav class="nav"><a href="../">← データ攻め トップ</a><a href="../motor/">モーター成績</a></nav>
<header>
  <div class="eyebrow">MOTOR MAINTENANCE</div>
  <h1>モーター整備</h1>
  <div class="date" id="hdate"></div>
  <p class="lead">出走表の<b>場と機番</b>から、そのモーターに<b>いつ・何を替えたか</b>を節ごとにたどれます。出典は公式の直前情報です。交換は場の記録で、誰の判断かは分かりません。</p>
  <p class="note1">直前情報は毎朝、前日分をまとめて取り込みます。載るのは前日までです。</p>
</header>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="t-recent" aria-selected="true">直近の交換</button>
  <button class="tab" role="tab" id="t-motor" aria-selected="false">モーターで探す</button>
  <button class="tab" role="tab" id="t-racer" aria-selected="false">選手で探す</button>
</div>

<section id="v-recent">
  <div class="row" id="days"></div>
  <div class="summary" id="rsum"></div>
  <div class="row" id="vjump" aria-label="場へ移動"></div>

  <div id="rlist"></div>
</section>

<section id="v-motor" hidden>
  <div class="ctl">
    <label for="m-venue">場<select id="m-venue"></select></label>

  </div>

  <div class="karte" id="karte"></div>
</section>

<section id="v-racer" hidden>
  <div class="ctl">
    <label for="r-q">選手（氏名・登番）<input type="search" id="r-q" placeholder="例：峰 竜太 / 4320"></label>
  </div>
  <div id="rres"></div>
</section>

<details id="trend">
  <summary>整備はいつ入るか（全場の傾向）</summary>

  <div id="defsbody"></div>

<script>
(function(){
// 生成時に埋め込んだ motorMaintenance.json（行はキー名つき）を、描画用の配列に並べ替える
var RAW=window.__D,V={};
var M={updated:RAW.updated,source:RAW.source,window:RAW.window,"節内日交換率":RAW["節内日交換率"],"節末逆算交換率":RAW["節末逆算交換率"],"節内日不明の交換件数":RAW["節内日不明の交換件数"],venues:V};
var D={m:M,r:(RAW.rows||[]).map(function(r){
  V[r.jcd]=r["場名"];
  return [r.jcd,r["開始日"],r["終了日"],r["日数"],r["節名"]||"",r["節名_出所"],r["登番"],r["氏名"],r["機番"],r["走数"],r["節末2連率"],
    r["不完全節"]?1:0,r["欠測あり"]?1:0,r["女子"]?1:0,r["整備規模"]||"",
    (r["交換イベント"]||[]).map(function(e){return [e["日付"],e["節内日"],e["rno"],e["部品"]||[]]}),
    (r["プロペラ新"]||[]).map(function(p){return [p["日付"],p["節内日"]]}),r["節名_注記"]||""];
})};
// 行の並び：0 jcd 1 開始日 2 終了日 3 日数 4 節名 5 出所 6 登番 7 氏名 8 機番 9 走数 10 2連率 11 不完全 12 欠測 13 女子 14 規模 15 交換 16 ペラ 17 注記
var R=D.r;
var BIG={"ピストン":1,"シリンダ":1,"シャフト":1,"キャリボ":1};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function md(s){return (+s.slice(4,6))+"/"+(+s.slice(6,8))}
function wd(s){return "日月火水木金土"[new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8)).getDay()]}
function norm(s){return String(s||"").replace(/[\s　]+/g,"")}
function chips(parts){return parts.map(function(p){return '<span class="p'+(BIG[p[0]]?' big':'')+'">'+esc(p[0])+(p[1]>1?"×"+p[1]:"")+'</span>'}).join("")}
function dnum(s){return Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8))/864e5}
// 節内日は行の初日から数える（節の区切りが誤る不具合を避ける）。初日が記録の窓で切れた行は出さない
function dayOf(r,d){return r[12]?null:dnum(d)-dnum(r[1])+1}
function dayLabel(n){return n==null?"":n+"日目 "}
var LAST=M.window.to;
function isOpen(r){return r[5]==="未完了"||(r[11]&&r[2]===LAST)}

$("hdate").textContent="記録 "+md(M.window.from)+"〜"+md(M.window.to)+" ・ 更新 "+M.updated;

// ---------- 直近の交換 ----------
var byDate={};
R.forEach(function(r){
  r[15].forEach(function(e){(byDate[e[0]]=byDate[e[0]]||[]).push({r:r,d:e[0],day:e[1],rno:e[2],parts:e[3]})});
  r[16].forEach(function(p){(byDate[p[0]]=byDate[p[0]]||[]).push({r:r,d:p[0],day:p[1],rno:null,pera:1})});
});
var dates=Object.keys(byDate).sort().reverse().slice(0,5);
var curDate=dates[0];
function drawDays(){
  $("days").innerHTML=dates.map(function(d){return '<button class="chipbtn" data-d="'+d+'" aria-pressed="'+(d===curDate)+'">'+md(d)+"（"+wd(d)+"）</button>"}).join("");
}
$("days").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;curDate=b.dataset.d;drawDays();drawRecent()});
function drawRecent(){
  var list=byDate[curDate]||[],g={},nEx=0,nPe=0,nBig=0;
  list.forEach(function(x){(g[x.r[0]]=g[x.r[0]]||[]).push(x);if(x.pera)nPe++;else{nEx++;if(x.parts.some(function(p){return BIG[p[0]]}))nBig++}});
  var js=Object.keys(g).sort();
  $("rsum").innerHTML="<b>"+js.length+"</b>場 ・ 部品交換 <b>"+nEx+"</b>件（うち大掛かり <b>"+nBig+"</b>）・ ペラ新 <b>"+nPe+"</b>件";
  $("vjump").innerHTML=js.map(function(j){return '<button class="chipbtn" data-j="'+j+'">'+esc(V[j])+" "+g[j].length+"</button>"}).join("");
  $("rlist").innerHTML=js.map(function(j){
    var xs=g[j].slice().sort(function(a,b){return (a.rno||99)-(b.rno||99)||a.r[8]-b.r[8]});
    return '<div class="vhead" id="vh'+j+'">'+esc(V[j])+"<small>"+xs.length+'件</small><a class="xs" href="../highlights/#v'+j+'">見どころ</a><a class="xs" style="margin-left:10px" href="../racers/#v'+j+'">出走表</a></div>'+'<div class="card">'+xs.map(function(x){
      var r=x.r,w=x.pera?'<span class="p pera">ペラ新</span>':chips(x.parts);
      var when=dayLabel(dayOf(x.r,x.d))+(x.rno?x.rno+"R の直前情報":"");
      return '<button class="ev" data-j="'+r[0]+'" data-m="'+r[8]+'"><span class="mno">'+r[8]+"<small>号機</small></span>"
        +'<span class="who">'+esc(r[7])+'<span class="tb">'+r[6]+"</span></span>"
        +'<span class="what">'+w+(when?' <span class="note1" style="display:inline">'+esc(when)+"</span>":"")+"</span></button>";
    }).join("")+"</div>";
  }).join("");
}
$("rlist").addEventListener("click",function(e){var b=e.target.closest(".ev");if(!b)return;openMotor(b.dataset.j,+b.dataset.m)});

// ---------- モーターで探す ----------
var byMotor={};
R.forEach(function(r){var k=r[0]+"-"+r[8];(byMotor[k]=byMotor[k]||[]).push(r)});
var venueList=Object.keys(V).sort();
$("m-venue").innerHTML=venueList.map(function(j){return '<option value="'+j+'">'+esc(V[j])+"</option>"}).join("");
var curJ=dates.length?byDate[dates[0]][0].r[0]:venueList[0],curM=null;
function setsuOf(rows){ // 節ごとにまとめる
  var s={};rows.forEach(function(r){var k=r[1];(s[k]=s[k]||[]).push(r)});
  return Object.keys(s).sort().map(function(k){return s[k]});
}
function drawGrid(){
  $("m-venue").value=curJ;
  var ms=Object.keys(byMotor).filter(function(k){return k.split("-")[0]===curJ}).map(function(k){return +k.split("-")[1]}).sort(function(a,b){return a-b});
  $("mgrid").innerHTML=ms.map(function(m){
    var ss=setsuOf(byMotor[curJ+"-"+m]),n=0,big=0;
    ss.forEach(function(g){var has=g.some(function(r){return r[15].length});if(has)n++;if(g.some(function(r){return r[14]==="大掛かり"}))big=1});
    return '<button class="mbtn'+(n?" has":"")+(big?" hasbig":"")+'" data-m="'+m+'" aria-pressed="'+(m===curM)+'" aria-label="'+m+'号機 交換のあった節 '+n+'">'+m+"<i>"+"●".repeat(Math.min(n,5))+"</i></button>";
  }).join("");
}
$("vjump").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;$("vh"+b.dataset.j).scrollIntoView({behavior:"smooth",block:"start"})});
$("m-no").addEventListener("input",function(){var m=+this.value;if(byMotor[curJ+"-"+m]){curM=m;drawGrid();drawKarte(false)}});
$("m-venue").addEventListener("change",function(){curJ=this.value;curM=null;drawGrid();$("karte").innerHTML=""});
$("mgrid").addEventListener("click",function(e){var b=e.target.closest(".mbtn");if(!b)return;curM=+b.dataset.m;drawGrid();drawKarte(true)});
function spark(ss){
  var pts=ss.map(function(g){var v=null;g.forEach(function(r){if(r[10]!=null)v=r[10]});return{v:v,ex:g.some(function(r){return r[15].length}),big:g.some(function(r){return r[14]==="大掛かり"}),d:g[0][1]}}).filter(function(p){return p.v!=null});
  if(pts.length<2)return "";
  var W=320,H=92,L=30,Rr=12,T=12,B=22;
  var vs=pts.map(function(p){return p.v}),lo=Math.floor(Math.min.apply(null,vs)/5)*5,hi=Math.ceil(Math.max.apply(null,vs)/5)*5;if(hi-lo<10){hi=lo+10}
  function x(i){return L+(W-L-Rr)*(pts.length===1?0.5:i/(pts.length-1))}
  function y(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo))}
  var path=pts.map(function(p,i){return (i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)}).join(" ");
  var s='<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="節ごとの節末2連率">';
  [lo,hi].forEach(function(v){s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#1e2d3c" stroke-width="1"/><text x="'+(L-5)+'" y="'+(y(v)+4)+'" fill="#7f93a6" font-size="10" text-anchor="end">'+v+"%</text>"});
  s+='<path d="'+path+'" fill="none" stroke="#7fb8e6" stroke-width="1.6"/>';
  pts.forEach(function(p,i){
    var c=p.big?"#ffc27a":p.ex?"#d6e9ff":"#0b1219",st=p.big?"#ffc27a":"#7fb8e6";
    s+='<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="'+(p.ex?4:3)+'" fill="'+c+'" stroke="'+st+'" stroke-width="1.4"/>';
  });
  var last=pts[pts.length-1];
  s+='<text x="'+x(0)+'" y="'+(H-6)+'" fill="#7f93a6" font-size="10" text-anchor="start">'+md(pts[0].d)+'</text><text x="'+x(pts.length-1)+'" y="'+(H-6)+'" fill="#7f93a6" font-size="10" text-anchor="end">'+md(last.d)+"</text>";
  s+="</svg>";
  return '<div class="spark">'+s+'<div class="cap">節末2連率の推移（○交換なし　<span style="color:var(--lite)">●</span>交換あり　<span style="color:var(--big)">●</span>大掛かりあり）。替えた節と2連率を並べただけで、交換の効果は測っていません。2連率＝2着以内に入った割合で、新替からの通算です。</div></div>';
}
function drawKarte(scroll){
  if(curM==null){$("karte").innerHTML="";return}
  var rows=byMotor[curJ+"-"+curM]||[],all=setsuOf(rows),rn=((M.renewInfo||{})[curJ]||[])[0],ss=rn?all.filter(function(g){return g[0][1]>=rn}):all,old=all.length-ss.length,nEx=0;
  ss.forEach(function(g){if(g.some(function(r){return r[15].length}))nEx++});
  var h='<div class="khead"><h2>'+esc(V[curJ])+" "+curM+'号機</h2><span class="s">'+ss.length+"節のうち交換あり "+nEx+"節</span></div>";
  h+='<div class="xl"><a href="../highlights/#v'+curJ+'">'+esc(V[curJ])+'の見どころ</a><a href="../racers/#v'+curJ+'">'+esc(V[curJ])+'の出走表</a></div>';
  var ri=(M.renewInfo||{})[curJ],run=(M.usage||{})[curJ+"-"+curM];
  if(ri&&run!=null)h+='<div class="runs"><span class="rn">'+run.toLocaleString()+'</span><span class="ru">走</span><span class="rs">新替 '+md(ri[0])+"（"+(ri[1]==="記録"?"手元の記録":ri[1])+"）から "+md(M.usageTo)+" まで</span></div>";
  var ns=(M.setsuSince||{})[curJ];
  if(ns!=null&&ns<5)h+='<div class="fresh">新替から'+ns+'節目まで終了（5節までは各機の走った数が少なく、2連率の比べ合いは参考程度）</div>';
  if(rn&&old)h+='<div class="note1">'+md(rn)+"にモーター新替。それより前の"+old+"節は別のモーターなので省いています。</div>";
  h+=spark(ss);
  h+='<div class="card" style="margin-top:10px">'+ss.slice().reverse().map(function(g){
    var r0=g[0],v=null;g.forEach(function(r){if(r[10]!=null)v=r[10]});
    var open=g.some(isOpen),head=g.some(function(r){return r[12]});
    var nm=r0[4]||"";
    var body=g.map(function(r){
      var evs=r[15].map(function(e){return '<div class="evl"><span class="d">'+md(e[0])+(e[2]?" "+e[2]+"R":"")+"</span>"+chips(e[3])+(dayOf(r,e[0])!=null?'<span class="note1" style="display:inline">'+dayOf(r,e[0])+"日目</span>":"")+"</div>"}).join("")
        +r[16].map(function(p){return '<div class="evl"><span class="d">'+md(p[0])+'</span><span class="p pera">ペラ新</span></div>'}).join("");
      return '<div class="rider">'+esc(r[7])+' <span class="tb" style="color:var(--dim);font-size:12px">'+r[6]+" ・ "+r[9]+(r[11]?"+":"")+"走</span></div>"+(evs||'<div class="none">交換なし</div>');
    }).join("");
    var live=g.some(function(r){return r[2]===LAST});
    var tags=(open?(live?'<span class="tag live">開催中</span>':'<span class="tag">節の記録待ち</span>'):"")+(head?'<span class="tag">7/15より前は記録なし</span>':"")+(g.some(function(r){return r[14]==="大掛かり"})?'<span class="tag big">大掛かり</span>':"");
    return '<div class="setsu"><div class="sline"><span class="per">'+md(r0[1])+"〜"+md(g[0][2])+'</span><span class="nm">'+esc(nm)+"</span>"+tags
      +'<span class="r2">'+(v==null?"":open?"最新":"節末")+"2連率 <b>"+(v==null?"―":v.toFixed(1)+"%")+"</b></span></div>"+body
      +(r0[17]?'<div class="note1">'+esc(r0[17])+"</div>":"")+"</div>";
  }).join("")+"</div>";
  $("karte").innerHTML=h;
  if(scroll)$("karte").scrollIntoView({behavior:"smooth",block:"start"});
}
function openMotor(j,m){curJ=j;curM=m;show("motor");drawGrid();drawKarte(true)}

// ---------- 選手で探す ----------
var NOTES={"毒島誠":"本人がエンジン調整の経緯を語ったインタビュー（マクール・一次）","峰竜太":"本人が整備の考え方を解説した動画（本人YouTube・一次）","赤岩善生":"深谷知博・渡邉雄朗が整備で尊敬する選手として言及（二次）"};
function drawRacer(){
  var q=norm($("r-q").value).toLowerCase();
  if(!q){$("rres").innerHTML='<div class="empty">氏名か登番を入れると、その選手が乗ったモーターと交換の記録が出ます。</div>';return}
  var hit=R.filter(function(r){return (norm(r[7])+r[6]).toLowerCase().indexOf(q)>=0}).sort(function(a,b){return b[1].localeCompare(a[1])});
  if(!hit.length){$("rres").innerHTML='<div class="empty">該当する選手がいません。</div>';return}
  var names={};hit.forEach(function(r){names[r[7]]=r[6]});
  var nk=Object.keys(names);
  var h='<div class="summary"><b>'+nk.length+"</b>人 ・ <b>"+hit.length+"</b>節</div>";
  if(nk.length===1&&NOTES[norm(nk[0])])h+='<div class="note1" style="margin-bottom:8px">参考：'+esc(NOTES[norm(nk[0])])+"</div>";
  h+='<div class="card">'+hit.slice(0,60).map(function(r){
    var parts=[];r[15].forEach(function(e){parts=parts.concat(e[3])});
    var w=(parts.length?chips(parts):"")+(r[16].length?'<span class="p pera">ペラ新</span>':"");
    return '<button class="ev" data-j="'+r[0]+'" data-m="'+r[8]+'"><span class="mno">'+r[8]+"<small>"+esc(V[r[0]])+"</small></span>"
      +'<span class="who">'+esc(r[7])+'<span class="tb">'+md(r[1])+"〜"+md(r[2])+"</span></span>"
      +'<span class="what">'+(w||'<span class="note1" style="display:inline">交換なし</span>')+"</span></button>";
  }).join("")+"</div>"+(hit.length>60?'<div class="note1 more">新しい順に60節まで表示しています。</div>':"");
  $("rres").innerHTML=h;
}
$("r-q").addEventListener("input",drawRacer);
$("rres").addEventListener("click",function(e){var b=e.target.closest(".ev");if(!b)return;openMotor(b.dataset.j,+b.dataset.m)});

// ---------- タブ ----------
function show(v){["recent","motor","racer"].forEach(function(k){$("t-"+k).setAttribute("aria-selected",k===v);$("v-"+k).hidden=k!==v})}
$("t-recent").onclick=function(){show("recent")};
$("t-motor").onclick=function(){show("motor");drawGrid()};
$("t-racer").onclick=function(){show("racer");drawRacer()};

// ---------- 深層：傾向と定義（数字はすべてデータから計算） ----------
(function(){
  var a=M["節内日交換率"].filter(function(x){return x["節内日"]<=6}),b=M["節末逆算交換率"];
  var mx=Math.max.apply(null,a.map(function(x){return x["交換率"]}));
  function bars(xs,lab,key){return '<div class="bars">'+xs.map(function(x){return '<span class="lab">'+lab(x)+'</span><span class="bar" style="width:'+(x[key]/mx*100).toFixed(1)+'%"></span><span class="val">'+x[key].toFixed(1)+"% <small>n="+x["観測"].toLocaleString()+"</small></span>"}).join("")+"</div>"}
  var top=a.slice().sort(function(p,q){return q["交換率"]-p["交換率"]})[0],last=b[0];
  var h="<p>節の何日目に部品交換が入ったか（その日に走ったモーターのうち、交換があった割合）。</p>";
  h+="<h3>節の頭から</h3>"+bars(a,function(x){return x["節内日"]+"日目"},"交換率");
  h+="<h3>節の終わりから</h3>"+bars(b.slice(0,6),function(x){return x["ラベル"]},"交換率");
  h+="<ul><li>いちばん多いのは"+top["節内日"]+"日目（"+top["交換率"].toFixed(1)+"%）。最終日は"+last["交換率"].toFixed(1)+"%</li><li>準優の前に手が入る形は出ていません</li><li>7日目以降は節が長い開催だけなので分母が小さく、省いています</li></ul>";
  h+='<p class="note1">分母は「その節内日に実際に走った（モーター, 日）」の数。7/15に頭が切れた節は分子・分母とも除いています。</p>';
  $("trendbody").innerHTML=h;

  var ev=[];R.forEach(function(r){r[15].forEach(function(e){ev.push(e)})});
  var tot={},alone={},bigRows=0,smallRows=0;
  ev.forEach(function(e){var ps={};e[3].forEach(function(p){ps[p[0]]=1});var k=Object.keys(ps);k.forEach(function(p){tot[p]=(tot[p]||0)+1;if(k.length===1)alone[p]=(alone[p]||0)+1})});
  R.forEach(function(r){if(r[14]==="大掛かり")bigRows++;else if(r[14]==="軽微")smallRows++});
  var order=Object.keys(tot).sort(function(p,q){return tot[q]-tot[p]});
  var d='<h3>1行の単位</h3><p>節 × 場 × 機番 × 選手。「その節で、その選手が、そのモーターに乗った記録」です。</p>';
  d+='<h3>大掛かりと軽微</h3><p>ピストン・シリンダ・シャフト・キャリボのどれかを替えた記録を<b style="color:var(--big)">大掛かり</b>、それ以外を軽微としています。このページで作った機械的な区分です。期間内の大掛かりは <b>'+bigRows+'</b> 行、軽微は <b>'+smallRows+"</b> 行。</p>";
  d+='<div class="tw"><table><tr><th>部品</th><th>交換件数</th><th>単独で替えた割合</th></tr>'+order.map(function(p){return "<tr><td"+(BIG[p]?' style="color:var(--big)"':"")+">"+esc(p)+"</td><td>"+tot[p].toLocaleString()+"</td><td>"+(alone[p]/tot[p]*100||0).toFixed(1)+"%</td></tr>"}).join("")+"</table></div>";
  d+='<p class="note1">件数は直前情報の1回の掲載を1件として数えています。</p>';
  d+="<h3>部品名</h3><p>直前情報の略称のまま出しています。リング＝ピストンリング、キャブ＝キャブレター、ギヤ＝ギヤケース、電気＝電気一式、シャフト＝クランクシャフト、キャリボ＝キャリアボデー。</p>";
  d+="<h3>交換は場の記録</h3><p>誰の判断で替えたかはデータから分かりません。「この選手が乗った節に交換記録がある」までで、「整備が上手い」とは読めません。交換の多さは場の整備方針でも変わるので、場をまたいで比べないでください。</p>";
  d+="<h3>表示の印</h3><ul><li><b>開催中</b>：節がまだ終わっていない。2連率は節末ではなく最新の値</li><li><b>7/15より前は記録なし</b>：記録の初日で節が切れている。日数・走数は下限（+）</li><li>7/13・7/14 は公式から取り直せず欠けています</li></ul>";
  d+="<h3>載せていないもの</h3><p>展示タイムから作った「節の中でどれだけ速くなったか」は、選手ごとの差が偶然を超えるか判定できない（p=0.25）ため出していません。ランキングも作っていません。</p>";
  $("defsbody").innerHTML=d;
  $("foot").textContent="出典："+M.source+"。節内日が分からない交換 "+M["節内日不明の交換件数"]+"件は日別の集計から除いています。";
})();

drawDays();drawRecent();
// 見どころ・出走表から来たとき：#m24-35 はそのモーターの経歴、#v24 はその場の機番一覧を開く
(function(){
  var h=location.hash||"",m=/^#m(\d{2})-(\d{1,3})$/.exec(h),v=/^#v(\d{2})$/.exec(h);
  if(m&&V[m[1]]){openMotor(m[1],+m[2]);return;}
  if(v&&V[v[1]]){curJ=v[1];curM=null;show("motor");drawGrid();}
})();

// 新替日と新替後の走行数（motorUsage.json）、新替後の節数（motorHistory.json）。
// 届かなくても本体は壊さない（経歴に新替の区切りと走行数が出ないだけ）。
Promise.all([
  fetch("../data/motorUsage.json").then(function(r){return r.ok?r.json():null}).catch(function(){return null}),
  fetch("../data/motorHistory.json").then(function(r){return r.ok?r.json():null}).catch(function(){return null})
]).then(function(a){
  var u=a[0],h=a[1];
  if(u&&u.venues&&u.motors){
    M.renewInfo={};M.usage={};M.usageTo=u.coverageTo||"";
    Object.keys(u.venues).forEach(function(j){var v=u.venues[j];if(/^\d{8}$/.test(String(v.coverageFrom||"")))M.renewInfo[String(j).padStart(2,"0")]=[v.coverageFrom,v.startSource||(v.windowSource==="motorReplace"?"記録":"推定")]});
    Object.keys(u.motors).forEach(function(k){var m=u.motors[k];M.usage[String(m.jcd).padStart(2,"0")+"-"+(+m["モーターNo"])]=m["走"]});
    if(h&&Array.isArray(h.sessions)){
      M.setsuSince={};
      Object.keys(M.renewInfo).forEach(function(j){var d=M.renewInfo[j][0];M.setsuSince[j]=h.sessions.filter(function(s){return String(s.jcd).padStart(2,"0")===j&&String(s["開催日"]||"")>=d}).length});
    }
    if(curM!=null)drawKarte(false);
  }
});
})();
</script>
