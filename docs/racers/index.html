/* 場カード */

/* 開催中のグレード。色は公式の月間スケジュールに合わせる（G1のみ、既存の黄と衝突するため紫に振替）。

.gbadge { display:inline-block; font-size:13px; border-radius:4px; padding:1px 6px; margin-right:6px; }
.gb-sg { background:#ee3f3d; color:#0b1219; }
.gb-g1 { background:#dcbd78; color:#0b1219; }
.gb-lady { background:#f4c2d0; color:#0b1219; }
.gb-g2 { background:#b8c4d2; color:#0b1219; }
.gb-plain { border:1px solid #9fb0c355; color:#9fb0c3; }
.date-head { font-size:13px; font-weight:bold; color:#e0e6ed; margin:16px 2px 4px; padding-bottom:4px; border-bottom:1px solid #2a3548; }
.date-head:first-child { margin-top:6px; }
/* 開催日のタブ（2日分あるときだけ出す）。色は並び替えボタンと同じ「青＝押せる・選択中」 */

.date-tab { flex:1; font-size:15px; font-weight:bold; border:1px solid #24344a; background:#0f1a26; color:#9fb0c3; border-radius:8px; padding:6px 10px; cursor:pointer; min-height:44px; font-family:inherit; }
.date-tab.on { background:rgba(127,180,255,.16); color:#7fb4ff; border-color:#7fb4ff; font-weight:800; }
.date-tab:active { background:#182535; }

/* Rグリッド */
.rgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
.rbtn { background:#121c28; border:1px solid #1f2b3a; border-radius:8px; padding:8px 4px; text-align:center; cursor:pointer; position:relative; }
.rbtn:active { background:#182535; }

.dot-高 { background:#f2b155; } .dot-中 { background:transparent; box-shadow:inset 0 0 0 2px #f2b155; } .dot-低 { background:#5cc8b0; }

/* レースヘッダ */
.rnav { position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; gap:6px; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:rgba(10,20,34,.97); border-top:1px solid #3d5a80; }
.rnav-b { flex:1; min-height:48px; display:flex; align-items:center; justify-content:center; gap:6px; background:#12233a; border:1px solid #3d5a80; color:#eef2f5; font:inherit; font-size:14px; line-height:1.2; cursor:pointer; padding:4px 6px; }

.rnav-t { display:flex; flex-direction:column; align-items:center; }
.rnav-t b { font-size:16px; }
.rnav-ar { font-size:12px; color:#c8a45e; }
.rnav-list { flex:1.2; text-align:center; flex-direction:column; gap:0; }
.rnav-off { background:#0a1422 !important; border:1px dashed #2b4568; cursor:default; }
.rnav { background:#0a1422 !important; }
#app:has(.rnav) { padding-bottom:76px; }
.race-head { background:#121c28; border:1px solid #1f2b3a; border-radius:10px; padding:12px 14px; margin-top:10px; }
.race-head .line1 { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.race-head .rt { font-size:18px; font-weight:bold; color:#e0e6ed; }
.race-head .kikaku { font-size:13px; color:#e0e6ed; }
.race-head .dl { font-size:13px; color:#9fb0c3; margin-top:4px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.race-links { margin-top:9px; display:flex; gap:8px; flex-wrap:wrap; }
.offlink { display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:bold; text-decoration:none; border-radius:6px; padding:5px 12px; min-height:44px; }
.offlink-result { color:#0b1219; background:#7fb4ff; }
.offlink-result:active { background:#e8bd50; }
.offlink-pend { color:#8a94a3; background:#0f1a26; border:1px solid #2a3a4d; }
.offlink-card { color:#7fb4ff; background:#0f1a26; border:1px solid #7fb4ff88; }
.cd { font-size:13px; font-weight:bold; border-radius:5px; padding:2px 8px; }
.cd-open { background:transparent; color:#7fb4ff; border:1px solid #7fb4ff88; }
.cd-soon { background:#3a2a12; color:#ffd166; border:1px solid #6a4d18; font-weight:800; }
.cd-closed { background:#241820; color:#b98; border:1px solid #4a2f3a; }
/* 中止（chushiToday.json）。色は増やさず、本文色の枠付き文字で出す */
.cd-chushi { background:transparent; color:#e6edf3; border:1px solid #8a94a3; }
.rbtn.chushi .dl { color:#e6edf3; font-weight:bold; }

.chip b { font-weight:bold; }

.chip-arare-中 { border-color:#f2b15566; color:#f2b155; }
.chip-arare-低 { border-color:#5cc8b066; color:#5cc8b0; }
.chip-fix { border-color:#3a4d63; color:#cdd6e0; }
/* ①の下振れ要因（事実提示・件数のみ。荒れ判定と混同させないため赤系は使わない） */
.chip-down-1 { border-color:#33465c; color:#9fb8cc; }
.chip-down-2 { border-color:#3a3a5c; color:#b3a9dd; }
.rbtn .rbtn-down { display:inline-flex; margin-top:4px; font-size:13px; padding:1px 6px; }
/* ファン化：見どころへの導線チップ */
.chip-link { border-color:#7fb4ff66; color:#7fb4ff; text-decoration:none; background:rgba(127,180,255,.08); min-height:44px; }
/* ファン化：読む派の一言 */
.reader-line { font-size:13px; color:#8a94a3; margin-top:2px; }
.reader-line b { color:#cdd6e0; font-weight:600; }
/* 企画レース（進入固定/A級系/選抜）＝teal。事実の当日判定・生名称由来 */
.chip-plan { border-color:#3a4d63; color:#e0e6ed; background:transparent; }
/* 節ステージ（準優勝戦/優勝戦）＝gold。企画系と区分を分け「企画」と誤読させない */
.chip-stage { border-color:#3a4d63; color:#e0e6ed; background:transparent; }

/* パネル */
.panel { border-radius:10px; padding:10px 12px; margin-top:8px; font-size:13px; line-height:1.7; }

.panel-tenkai li { margin:2px 0; }
.panel-tenkai .note { font-size:13px; color:#8a94a3; margin-top:5px; }
.panel-wind { background:#0f1a26; border:1px solid #2a3a57; color:#cdd6e0; }
.panel-wind .ttl { color:#e0e6ed; }
.panel-tide { background:#0f1a26; border:1px solid #2a3a57; color:#cdd6e0; }
.panel-tide .ttl { color:#e0e6ed; }
.panel-tide .note { font-size:13px; color:#8a94a3; margin-top:5px; }
.lv-高 { color:#f2b155; font-weight:bold; } .lv-中 { color:#f2b155; font-weight:bold; } .lv-低 { color:#5cc8b0; font-weight:bold; }

/* 並び替え */
.sortbar { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
.sortbtn { font-size:13px; border:1px solid #24344a; background:#0f1a26; color:#9fb0c3; border-radius:6px; padding:4px 10px; cursor:pointer; min-height:44px; }
.sortbtn.on { background:rgba(127,180,255,.16); color:#7fb4ff; border-color:#7fb4ff; font-weight:800; }

.k-A1 { background:#c8a45e; } .k-A2 { background:#e07a1f; color:#0b1219; } .k-B1 { background:#86a6cf; color:#0b1a33; } .k-B2 { background:#5c6773; }
.pname { font-size:16px; font-weight:bold; color:#fff; display:inline-flex; align-items:center; min-height:44px; }
.badge-local { font-size:13px; color:#e0e6ed; background:transparent; border-radius:999px; padding:0 8px; font-weight:bold; flex:none; border:1px solid #9fb0c3; }
.badge-f { font-size:13px; color:#e0e6ed; background:transparent; border-radius:3px; padding:1px 5px; font-weight:800; flex:none; border:2px solid #e0e6ed; }
.badge-st { font-size:13px; color:#e0e6ed; background:transparent; border-radius:3px; padding:1px 5px; font-weight:bold; flex:none; border:1.5px dashed #c3ccd6; }

.badge-detail { display:inline-block; font-size:13px; padding:1px 5px; border-radius:8px; background:transparent; color:#7fb4ff; margin-left:4px; letter-spacing:.5px; vertical-align:middle; font-weight:normal; flex:none; border:1px solid #7fb4ff88; }
.pkana { font-size:13px; color:#8a94a3; letter-spacing:.02em; margin-top:2px; }
.nick { font-size:13px; color:#9fb0c3; font-style:italic; margin-top:2px; }
.boat-sub { font-size:13px; color:#8a94a3; margin-top:3px; }
.tags { display:flex; gap:5px; flex-wrap:wrap; margin-top:5px; }
.tag { font-size:13px; border-radius:4px; padding:1px 6px; border:1px solid #2a3a4d; color:#9fb0c3; }
.tag-mach-high { border-color:#3a4d63; color:#e0e6ed; background:transparent; border:1.5px dashed #c3ccd6; border-radius:3px; } .tag-mach-low { border-color:#4a2f3a; color:#e0e6ed; background:transparent; border:1.5px dashed #c3ccd6; border-radius:3px; }
.tag-local { border-color:#3a4d63; color:#e0e6ed; background:transparent; border:1.5px dashed #c3ccd6; border-radius:3px; }

.stats { display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; }

.stat.mach .lb { color:#9fb0c3; } .stat.mach .v { color:#a9c6dd; }

    .kinmotor .km-shinkae { color:#8a94a3; margin-left:6px; font-size:13px; font-variant-numeric:tabular-nums; }

/* E30該当場成績（事実の生データ・二層表示） */
.e30d { margin-top:8px; border:1px solid #24344a; border-radius:8px; background:#0f1a26; overflow:hidden; }

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function nowJST(){ return new Date(Date.now()+9*3600*1000); }
function fmtNum(s){ var f=parseFloat(s); return isNaN(f)?"-":f.toFixed(2); }
function fmtPct(s){ var f=parseFloat(s); return isNaN(f)?"-":f.toFixed(1)+"%"; }
function toMin(dl){ var m=/^(\d{1,2}):(\d{2})$/.exec(dl); return m?parseInt(m[1])*60+parseInt(m[2]):null; }
function curMin(){ var n=nowJST(); return n.getUTCHours()*60+n.getUTCMinutes(); }
function curYmd(){ var n=nowJST(); return n.getUTCFullYear()*1e4+(n.getUTCMonth()+1)*100+n.getUTCDate(); }

/* ===== 記憶と回収ループ（localStorage・賭け要素なし。読む体験の“開いたループ”を閉じさせる） ===== */
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
var WATCH=lsGet("br_watch",[]);       /* 気になる（明示スター） */
var VIEWED=lsGet("br_viewed",[]);     /* 最近見た（自動） */
var COLLECTED=lsGet("br_collected",[]); /* 結果を回収済みのキー */
function rkey(jcd,hd,rno){ return jcd+"_"+hd+"_"+rno; }
/* レース状態: 'pre'(締切前) / 'wait'(結果待ち〜締切+12分) / 'done'(結果確定) */
function raceStatus(hd,dl){
  var dm=toMin(dl); if(dm===null||!/^\d{8}$/.test(hd)) return 'pre';
  var cur=curYmd(), h=parseInt(hd);
  if(cur>h) return 'done';
  if(cur<h) return 'pre';
  var diff=curMin()-dm;
  if(diff<0) return 'pre';
  return diff<12?'wait':'done';
}
function pruneOld(){
  /* 3日以上前のレースは間引く（無限肥大防止） */
  var cut=curYmd()-3;
  function keep(x){ return parseInt(x.hd||"0")>=cut; }
  WATCH=WATCH.filter(keep); VIEWED=VIEWED.filter(keep);
  COLLECTED=COLLECTED.filter(function(k){ return parseInt((k.split("_")[1]||"0"))>=cut; });
}
function isWatched(jcd,hd,rno){ var k=rkey(jcd,hd,rno); return WATCH.some(function(x){return rkey(x.jcd,x.hd,x.rno)===k;}); }
function toggleWatch(v,rno){
  var rc=v.races[rno], k=rkey(v.jcd,v.hd,rno);
  if(isWatched(v.jcd,v.hd,rno)){ WATCH=WATCH.filter(function(x){return rkey(x.jcd,x.hd,x.rno)!==k;}); }
  else { WATCH.unshift({jcd:v.jcd,hd:v.hd,rno:rno,venue:v.name,deadline:rc.deadline,kikaku:rc.kikaku,ts:Date.now()}); }
  lsSet("br_watch",WATCH);
}
function recordViewed(v,rno){
  var rc=v.races[rno], k=rkey(v.jcd,v.hd,rno);
  VIEWED=VIEWED.filter(function(x){return rkey(x.jcd,x.hd,x.rno)!==k;});
  VIEWED.unshift({jcd:v.jcd,hd:v.hd,rno:rno,venue:v.name,deadline:rc.deadline,ts:Date.now()});
  if(VIEWED.length>40) VIEWED=VIEWED.slice(0,40);
  lsSet("br_viewed",VIEWED);
}
function isCollected(jcd,hd,rno){ return COLLECTED.indexOf(rkey(jcd,hd,rno))>=0; }
function markCollected(jcd,hd,rno){ var k=rkey(jcd,hd,rno); if(COLLECTED.indexOf(k)<0){ COLLECTED.push(k); lsSet("br_collected",COLLECTED); } }
function raceUrl(kind,jcd,hd,rno){ return "https://www.boatrace.jp/owpc/pc/race/"+kind+"?rno="+rno+"&jcd="+jcd+"&hd="+hd; }
function resultUrl(jcd,hd,rno){ return raceUrl("raceresult",jcd,hd,rno); }
/* 回収対象＝結果確定・未回収のレース。
   ソース: 気になる(WATCH) / 最近見た(VIEWED) / 推しの出走(自動)。
   推しが走ったレースはフォローだけで自動的に回収対象になる（明示操作不要）。 */
function harvestList(){
  var map={};
  function add(x, oshiName){
    /* 締切を過ぎたレースは公式結果リンクで確認（確定判定はアプリでは持たない） */
    if(!x.hd || raceStatus(x.hd,x.deadline)==='pre') return;
    if(isCollected(x.jcd,x.hd,x.rno)) return;
    var k=rkey(x.jcd,x.hd,x.rno);
    if(!map[k]) map[k]={jcd:x.jcd,hd:x.hd,rno:x.rno,venue:x.venue||"",deadline:x.deadline||"",kikaku:x.kikaku||"",oshi:false,oshiNames:[]};
    if(oshiName){ map[k].oshi=true; if(map[k].oshiNames.indexOf(oshiName)<0) map[k].oshiNames.push(oshiName); }
  }
  WATCH.forEach(function(x){ add(x); });
  VIEWED.forEach(function(x){ add(x); });
  oshiEntries().forEach(function(x){ add(x, x.name); });
  var out=Object.keys(map).map(function(k){ return map[k]; });
  out.sort(function(a,b){
    if(a.oshi!==b.oshi) return a.oshi?-1:1;               /* 推し優先 */
    var ka=a.hd+("0"+a.deadline).slice(-5), kb=b.hd+("0"+b.deadline).slice(-5);
    return ka>kb?-1:1;                                     /* 新しい順 */
  });
  return out;
}

/* ===== 読者ログ（自分の読み） =====
   締切前に「①は残る / 崩れる」の二択だけを記録し、
   結果確定後に docs/data/inSurvival.json で自動照合する。
   買い目は記録しない。連勝・ランキング・報酬は置かない。
   保持は専用キー br_yomi（pruneOld の間引き対象外・直近200件ローリング）。*/
var YOMI=lsGet("br_yomi",[]);   /* [{jcd,hd,rno,venue,y,ts,res}] y:1=崩れる / 0=残る, res:null/0/1 */
var ISV=null;                   /* inSurvival.json */
var YOMI_MAX=200;               /* localStorage容量対策の上限 */
var YOMI_MIN=10;                /* これ未満は傾向を出さない */
var YOMI_BASE=19.2;             /* 過去1年の①着外率。見どころのREFと同一 */
var YOMI_TOL=5.0;               /* 実測に近いとみなす幅（±pt） */

function yomiFind(jcd,hd,rno){
  var k=rkey(jcd,hd,rno);
  for(var i=0;i<YOMI.length;i++){ if(rkey(YOMI[i].jcd,YOMI[i].hd,YOMI[i].rno)===k) return YOMI[i]; }
  return null;
}
/* 締切前のみ記録・変更可。締切後は一切受け付けない（結果を見る前に確定保存の鉄則）。*/
function yomiSet(v,rno,y){
  var rc=v.races[rno]; if(!rc) return;
  if(isClosed(v.hd,rc.deadline)) return;
  var e=yomiFind(v.jcd,v.hd,rno);
  if(e){
    if(e.y===y){ YOMI=YOMI.filter(function(x){ return x!==e; }); }   /* 同じボタンで取消 */
    else { e.y=y; e.ts=Date.now(); }
  }else{
    YOMI.unshift({jcd:v.jcd,hd:v.hd,rno:rno,venue:v.name,y:y,ts:Date.now(),res:null});
  }
  if(YOMI.length>YOMI_MAX) YOMI=YOMI.slice(0,YOMI_MAX);
  lsSet("br_yomi",YOMI);
}
/* 結果確定分だけ res を埋める。一度埋まった値は変えない。*/
function yomiSync(){
  if(!ISV||!ISV["日"]||!YOMI.length) return;
  var ch=false;
  YOMI.forEach(function(e){
    if(e.res===0||e.res===1) return;
    var d=ISV["日"][e.hd]; if(!d) return;
    var s=d[e.jcd]; if(!s||s.length<e.rno) return;
    var c=s.charAt(e.rno-1);
    if(c==="0"||c==="1"){ e.res=parseInt(c,10); ch=true; }
  });
  if(ch) lsSet("br_yomi",YOMI);
}
function yomiStats(){
  var j=YOMI.filter(function(e){ return e.res===0||e.res===1; });
  var n=j.length, kz=0, same=0;
  j.forEach(function(e){ if(e.y===1) kz++; if(e.y===e.res) same++; });
  return { n:n, total:YOMI.length, kuzure:kz,
           rate:n?(100*kz/n):0, same:n?(100*same/n):0 };
}
function yomiVerdict(r){
  if(r.rate>YOMI_BASE+YOMI_TOL) return "崩れる側に寄りやすい傾向があります";
  if(r.rate<YOMI_BASE-YOMI_TOL) return "残る側に寄りやすい傾向があります";
  return "実測に近い読み方です";
}
/* 集計パネル（主役は偏り。一致率は注記に従で置く）*/
function yomiPanel(){
  if(!YOMI.length) return "";
  var r=yomiStats();
  var h='<div class="my-sec yomi"><div class="my-h">📝 自分の読み</div>';
  if(r.n<YOMI_MIN){
    h+='<div class="my-note">記録 '+r.total+'件（判定済み '+r.n+'件）。あと'+(YOMI_MIN-r.n)+'件で傾向が出ます。</div>';
    return h+'</div>';
  }
  h+='<div class="yomi-line">「崩れる」と読んだ：<b>'+r.kuzure+'回</b>（'+r.rate.toFixed(1)+'%）</div>'
   +'<div class="yomi-line">実際に①が着外だった：<b>'+YOMI_BASE.toFixed(1)+'%</b></div>'
   +'<div class="yomi-verdict">── '+yomiVerdict(r)+'</div>'
   +'<div class="my-note">判定済み '+r.n+'件／読みと結果が一致 '+r.same.toFixed(0)+'%。'
   +'比較値は過去1年の①着外率（全体19.2%）。</div>';

var ZODIAC=["牡羊座","牡牛座","双子座","蟹座","獅子座","乙女座","天秤座","蠍座","射手座","山羊座","水瓶座","魚座"];

  ["ペースは掴みにくいが、粘れば形になる。","小さな発見がある日。メモしておくと後で活きる。","足元を固めるほど安定する一日。"],

];
function hashStr(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=(h*16777619)>>>0; } return h>>>0; }

function dailyFortune(sign){
  var seed=hashStr(sign+"|"+todayYmdStr());

      var pf=PROF[x.toban]||{}, nick=pf.nickname||pf.tagline||"";
      /* 締切前=公式出走表リンク、締切後=公式結果リンク（どの行にも公式ページへの入口を出す。確定は公式が持つ） */
      var tmr=parseInt(x.hd)>curYmd();
      var right=st==='pre'
        ? '<a class="oshi-result oshi-card" href="'+raceUrl("racelist",x.jcd,x.hd,x.rno)+'" target="_blank" rel="noopener">公式出走表 →</a>'
        : '<a class="oshi-result" href="'+resultUrl(x.jcd,x.hd,x.rno)+'" target="_blank" rel="noopener">🏁 結果 →</a>';
      return '<div class="my-row"><div class="my-rl" data-open="'+esc(rkey(x.jcd,x.hd,x.rno))+'">'
        +'<div class="my-rt">'+esc(x.name)+(nick?' <span class="oshi-nick">“'+esc(nick)+'”</span>':'')+'</div>'
        +'<div class="my-rs">'+(tmr?'明日 ':'')+esc(x.venue)+' '+x.rno+'R｜締切 '+esc(x.deadline||"")+'</div></div>'+right+'</div>';
    }).join("");
  }
  h+='<div class="oshi-note">フォローはこの端末にのみ保存され、外部には送信されません。</div>';
  return h+'</div>';
}

function isClosed(hd,dl){
  var dm=toMin(dl); if(dm===null||!/^\d{8}$/.test(hd)) return false;
  var cur=curYmd();
  if(cur>parseInt(hd)) return true;
  if(cur<parseInt(hd)) return false;
  return curMin()>dm;
}
/* 締切までの残り（分）。過去日=締切、未来日=null（大きく先） */
function minsToClose(hd,dl){
  var dm=toMin(dl); if(dm===null||!/^\d{8}$/.test(hd)) return null;
  var cur=curYmd();
  if(cur>parseInt(hd)) return -1;
  if(cur<parseInt(hd)) return 9999;
  return dm-curMin();
}

function findArare(jcd,rno,hd){
  if(!arare||!arare.races) return null;
  var hit=null, hasHd=false;
  Object.keys(arare.races).forEach(function(k){
    var r=arare.races[k];
    if(String(r.jcd)!==String(jcd)||parseInt(r.rno)!==parseInt(rno)) return;
    if(r.hd){ hasHd=true; if(String(r.hd)===String(hd)) hit=r; }
    else if(!hit){ hit=r; }   /* 開催日フィールドが無い旧データ */
  });
  /* 旧データ(hd無し)は生成日ガードで別日を排除。新データはhd厳密一致済み */
  if(!hasHd && hd && arareHd && arareHd!==hd) return null;
  return hit;
}
function findWind(jcd,hd,dl){
  if(!weather||!weather.stadiums||!weather.stadiums[jcd]) return null;
  if(!/^\d{8}$/.test(hd)||!/^\d{1,2}:\d{2}$/.test(dl)) return null;
  var target=hd.slice(0,4)+"-"+hd.slice(4,6)+"-"+hd.slice(6,8)+"T"+("0"+dl).slice(-5);
  var tms=Date.parse(target+"+09:00"), best=null, bd=1e15;
  (weather.stadiums[jcd].hourly||[]).forEach(function(h){
    var d=Math.abs(Date.parse(h.time+"+09:00")-tms);
    if(d<bd){bd=d;best=h;}
  });
  return best;
}
var WIND_ARROW={"北":"↓","北東":"↙","東":"←","南東":"↖","南":"↑","南西":"↗","西":"→","北西":"↘"};
function windArrow(dir){ if(!dir) return ""; for(var k in WIND_ARROW){ if(dir.indexOf(k)>=0) return WIND_ARROW[k]; } return ""; }

/* ===== 描画 ===== */

/* レース画面は締切表示のため30秒ごとに render() で描き直す。innerHTML を作り直すため
   開いていた <details> が閉じる。描き直しの前後で開閉状態を保存・復元する。
   キーは summary のテキスト（同一画面内で重複しないため識別子として使える）。 */
var DOPEN={};
/* data-dk があればそれを開閉のキーにする。summary の文字が同じ details（艇ごとの内訳）を
   1つのキーに潰して、6艇まとめて開閉させないため。data-dk が無いものは従来どおり文字で識別する。 */
function nsDetailKey(d,i){
  var a=d.getAttribute("data-dk");
  if(a) return a;
  var s=d.querySelector("summary");
  return s?(s.textContent||"").replace(/\s+/g,"").slice(0,60):("i"+i);
}
function nsSnapshotDetails(){
  var app=document.getElementById("app"); if(!app) return;
  DOPEN={};
  var ds=app.querySelectorAll("details");
  for(var i=0;i<ds.length;i++){
    var k=nsDetailKey(ds[i],i);
    if(k) DOPEN[k]=ds[i].open;
  }
}
function nsRestoreDetails(){
  var app=document.getElementById("app"); if(!app) return;
  var ds=app.querySelectorAll("details");
  for(var i=0;i<ds.length;i++){
    var k=nsDetailKey(ds[i],i);
    if(k && Object.prototype.hasOwnProperty.call(DOPEN,k)) ds[i].open=DOPEN[k];
  }
}
function render(){
  nsSnapshotDetails();
  renderBody();
  nsRestoreDetails();
}
function renderBody(){
  var _s=calcViewport(); if(!_s) return;
  var _add=function(){
    if(document.getElementById(_s.k)) return;
    var _e=document.querySelector("footer");
    if(_e && _e.textContent.indexOf(_s.t)>=0) return;
    var _f=document.createElement("div"); _f.id=_s.k;
    _f.style.cssText="margin:24px auto 8px;text-align:center;font-size:13px;color:#8a94a3;line-height:1.7";
    _f.textContent="\u00a9 2026 "+_s.t;
    document.body.appendChild(_f);
  };
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",_add,{once:true}); } else { _add(); }
  var app=document.getElementById("app"), crumb=document.getElementById("crumb");
  document.getElementById("updated").textContent="更新: "+(RAW.updated||"-")+"｜出典: BOATRACE公式出走表 ほか";
  var keys=Object.keys(venues);
  if(keys.length===0){ app.innerHTML='<div class="empty">本日の出走表データがありません</div>'; crumb.innerHTML=""; return; }

  if(view.page==="venues"){ renderVenues(app,crumb,keys); return; }
  var v=venues[view.key];
  if(!v){ view={page:"venues",sort:view.sort}; render(); return; }
  VDATE=v.hd;  /* 戻ったとき、開いていた場の日のタブを出す */

  renderRace(app,crumb,v);
}

function renderVenues(app,crumb,keys){
  crumb.innerHTML="場を選択";
  var byDate={};
  keys.forEach(function(k){ var v=venues[k]; (byDate[v.hd]=byDate[v.hd]||[]).push(v); });
  var dates=Object.keys(byDate).sort();
  var todayJST=(function(){ var n=nowJST(); return n.getUTCFullYear()+("0"+(n.getUTCMonth()+1)).slice(-2)+("0"+n.getUTCDate()).slice(-2); })();
  /* 開催日のタブ：今日より前の日は出さない（0時から朝の更新までに残る前日分）。全部が前日なら残す */
  var fut=dates.filter(function(d){ return d>=todayJST; });
  if(fut.length) dates=fut;
  if(dates.indexOf(VDATE)<0) VDATE=dates.indexOf(todayJST)>=0?todayJST:(fut.length?dates[0]:dates[dates.length-1]);
  var useTabs=dates.length>1;
  var html=buildOshiToday()+buildMyPanel()+buildFortune();
  if(useTabs){
    html+='<div class="date-tabs" role="tablist">'+dates.map(function(hd){
      var mm=hd.slice(4,6),dd=hd.slice(6,8);
      var dow=["日","月","火","水","木","金","土"][new Date(parseInt(hd.slice(0,4)),parseInt(mm)-1,parseInt(dd)).getDay()];
      return '<button type="button" class="date-tab'+(hd===VDATE?' on':'')+'" role="tab" aria-selected="'+(hd===VDATE?'true':'false')+'" data-hd="'+esc(hd)+'">'
        +esc(parseInt(mm,10)+"/"+parseInt(dd,10)+"("+dow+")")+'</button>';
    }).join("")+'</div>';
    dates=[VDATE];
  }
  dates.forEach(function(hd){
    var list=byDate[hd].sort(function(a,b){ var pa=isPin(a.jcd)?0:1, pb=isPin(b.jcd)?0:1; if(pa!==pb) return pa-pb; return a.jcd<b.jcd?-1:1; });
    var mm=hd.slice(4,6),dd=hd.slice(6,8);
    var dow=["日","月","火","水","木","金","土"][new Date(parseInt(hd.slice(0,4)),parseInt(mm)-1,parseInt(dd)).getDay()];
    var dnum=function(x){ return Date.UTC(parseInt(x.slice(0,4),10),parseInt(x.slice(4,6),10)-1,parseInt(x.slice(6,8),10)); };
    var df=Math.round((dnum(hd)-dnum(todayJST))/86400000);
    var lab=df===0?"本日":df===1?"翌日":df===-1?"前日":(df<0?(-df)+"日前":df+"日後");
    if(!useTabs) html+='<div class="date-head">'+esc(lab+" "+mm+"/"+dd+"("+dow+")")+'</div>';
    html+=list.map(function(v){
      var rs=Object.keys(v.races).map(Number).sort(function(a,b){return a-b;});
      var ch=chushiOf(v);
      var live=rs.filter(function(r){ return !isChushi(v,r); });  /* 締切の範囲は中止でないレースだけで出す */
      var first=v.races[live[0]],last=v.races[live[live.length-1]];
      var fix=HL_META.fix.indexOf(v.name)>=0?'<span class="chip chip-fix" style="margin-left:6px">進入固定</span>':'';
      var gb=gradeBadges(gradeInfo(v.jcd,v.hd));
      var span=live.length?esc(first.deadline)+'〜'+esc(last.deadline):'';
      var chTag=ch?'<span class="chushi-tag">'+esc(ch["表記"])+'</span>':'';
      return '<div class="venue-card'+gb.cls+'" data-k="'+esc(v.key)+'">'
        +'<div class="venue-name">'+(isPin(v.jcd)?'<span class="pin-mk">📍</span>':'')+esc(v.name)+'</div>'
        +'<div class="venue-meta">'+gb.html+esc(v.setsu)+fix+'<br>'+rs.length+'R'+(span?'｜'+span:'')+chTag+'</div>'
        +'<div class="venue-day">'+esc(v.day)+'</div></div>';
    }).join("");
  });
  app.innerHTML=html;
  Array.prototype.forEach.call(app.querySelectorAll(".date-tab"),function(el){
    el.onclick=function(){ VDATE=el.getAttribute("data-hd"); render(); };
  });
  Array.prototype.forEach.call(app.querySelectorAll(".venue-card"),function(el){
    el.onclick=function(){ navGo({page:"races",key:el.getAttribute("data-k"),rno:null,sort:view.sort}); };
  });
  wireMyPanel(app);
  wireFortune(app);
}

/* ── 観戦記（場ごとのレース一覧の下に1本）──────────────────────────
   記事は見どころと同じ ../data/kansenki/articles/<開催日>-<場コード>.json。
   30秒ごとの再描画で取り直さないよう KSK に持つ（null＝その日の記事なし＝何も出さない）。
   開閉は details の data-dk で再描画をまたいで保持される。                        */
var KSK={}, KSKP={};
function kskLoad(v){
  var k=v.key;
  if(Object.prototype.hasOwnProperty.call(KSK,k) || KSKP[k]) return;
  if(!/^\d{8}$/.test(String(v.hd||""))){ KSK[k]=null; return; }
  KSKP[k]=true;
  fetch("../data/kansenki/articles/"+v.hd+"-"+v.jcd+".json?_="+Date.now())
    .then(function(r){ return r.ok?r.json():null; })
    .catch(function(){ return null; })
    .then(function(a){
      KSK[k]=(a && a.body)?a:null; delete KSKP[k];
      if(KSK[k] && document.getElementById("ksk-slot-"+k)) render();
    });
}
function kskHtml(v){
  var a=KSK[v.key]; if(!a) return "";
  var body=String(a.body||"");
  var wp=String(a.watchPoint||"").trim();
  var lead=wp?("きょうの観察点　"+esc(wp)):esc(body.replace(/\s+/g,"").split("。")[0]+"。");
  var paras=body.split(/\n+/).filter(function(x){ return x.trim(); }).map(function(x){
    var h=esc(x.trim());
    (a.racersMentioned||[]).forEach(function(rm){
      var nm=esc(rm.name||""), tb=esc(String(rm.toban||""));
      if(nm && tb) h=h.split(nm).join('<a class="ksk-link" href="../players/?toban='+tb+'">'+nm+'</a>');
    });
    return "<p>"+h+"</p>";
  }).join("");
  return '<details class="ksk" data-dk="ksk-'+esc(v.key)+'"><summary>'
    +'<span class="ksk-tag">📝 場の朝刊</span>'
    +'<span class="ksk-title">'+esc(a.title||"")+'</span>'
    +'<span class="ksk-lead">'+lead+'</span>'
    +'<span class="ksk-caret"></span></summary>'
    +'<div class="ksk-full">'+paras
    +'<div class="ksk-note">前日までの確定データだけで書いています。予想・買い目は扱いません。</div></div></details>';
}

/* 決まり手構成バー */
/* ── 期間タブ付きの成績表（枠別成績 / 逃げ時2着） ─────────────────────
   どちらも 2ヶ月・3ヶ月・半年・1年・2年 の5期間を持つ。JSONは回数だけを保持し、
   率はここで計算する。選んだ期間は PSEL に持ち、30秒ごとの再描画をまたいで保持する
   （render() が innerHTML を作り直すため、変数に持たないと既定値に戻る）。
   母数は必ず「回数/走行数」の分数で併記する。走っていない（n=0）セルだけは
   率が定義できないので「—」と出す。0%とは書かない。                            */
var WS=null;                 /* 枠別成績（wakuStats.json） */
var PSEL={ws:"1y", ns:"1y", tj:"t1"}; /* 選択中の期間。表ごとに独立（tj は展示タイム別の成績の着順区分） */
var PLBL={"2m":"2ヶ月","3m":"3ヶ月","6m":"半年","1y":"1年","2y":"2年","t1":"1着","t2":"2着以内","t3":"3着以内"};

function periodTabs(kind, periods, sel){

      +' aria-selected="'+(p===sel?'true':'false')+'">'+(PLBL[p]||p)+'</button>';
  }).join("")+'</div>';
}

/* 率と分数のセル。n=0 は率を出さない（走っていないだけで0%ではない） */
function rateCell(k, n, cls){
  var pct = n ? Math.round(k/n*100)+"%" : "—";
  return '<td class="'+(cls||"")+(n&&n<20?" ns-thin":"")+'"><span class="ns-p">'+pct
    +'</span><span class="ns-k">'+k+"/"+n+'</span></td>';

function laneChip(lane){

/* ── 6艇の比較 ─────────────────────────────────────────── */
function cmp6Table(boats){
  if(!boats||!boats.length) return "";
  /* [列名, 見出し, 一番の向き(-1=小さいほど上), 小数桁] */
  var cols=[["平均ST","平均ST",-1,2],["全国勝率","全国勝率",1,2],["当地勝率","当地勝率",1,2],["モーター2連率","モーター",1,1]];
  var best=cols.map(function(c){
    var xs=boats.map(function(r){return parseFloat(g(r,c[0]));}).filter(function(x){return !isNaN(x);});
    return xs.length?(c[2]<0?Math.min.apply(null,xs):Math.max.apply(null,xs)):null;
  });
  var head='<tr><th>枠・選手</th><th>級</th>'+cols.map(function(c){return '<th>'+c[1]+'</th>';}).join("")+'</tr>';
  var rows=boats.map(function(row){
    var lane=parseInt(g(row,"枠"));
    var nm=g(row,"氏名").replace(/　+/g,"").slice(0,4);
    return '<tr><td>'+laneChip(lane)+'<span class="ns-nm">'+esc(nm)+'</span></td><td>'+esc(g(row,"級別"))+'</td>'
      +cols.map(function(c,j){
        var x=parseFloat(g(row,c[0]));
        if(isNaN(x)) return '<td>-</td>';
        return '<td'+(x===best[j]?' class="cmp-top"':'')+'>'+x.toFixed(c[3])+'</td>';
      }).join("")+'</tr>';
  }).join("");
  return '<div class="ns cmp6"><div class="ns-body"><div class="cmp-h">6艇の比較</div><table>'+head+rows+'</table>'
    +'<div class="cmp-note">太字は6艇の中の一番（平均STは最も早い艇）。モーターは2連率%。並びは上の並び替えに合わせています。</div></div></div>';
}

/* ── 枠別成績 ───────────────────────────────────────────── */
function wakuStatsTable(boats){
  if(!WS||!WS.cells||!WS.base||!WS.meta) return "";
  var ps=WS.meta.periods||[], i=ps.indexOf(PSEL.ws);
  if(i<0){ i=ps.indexOf("1y"); if(i<0) i=ps.length-1; PSEL.ws=ps[i]; }
  var head='<tr><th>枠・選手</th><th>走行</th><th>1着</th><th>2連対</th><th>3連対</th></tr>';
  /* 各選手の直後に、その枠の全体平均を細い行で挟む。比較対象が隣にある形にする。
     全体は母数が5万走規模なので分数は出さず、率だけを添える。 */
  var rows=boats.slice().sort(function(a,b){return parseInt(g(a,"枠"))-parseInt(g(b,"枠"));}).map(function(row){
    var lane=parseInt(g(row,"枠")), toban=g(row,"登録番号");
    var nm=g(row,"氏名").replace(/　+/g,"").slice(0,4);
    var arr=(WS.cells[toban]&&WS.cells[toban][String(lane)]);
    var c=(arr&&arr[i])||[0,0,0,0];
    var n=c[0];
    var tr='<tr><td>'+laneChip(lane)+'<span class="ns-nm">'+esc(nm)+'</span></td>'
      +'<td class="ns-n">'+n+'</td>'+rateCell(c[1],n)+rateCell(c[2],n)+rateCell(c[3],n)+'</tr>';
    var b=(WS.base[i]&&WS.base[i][String(lane)])||[0,0,0,0], bn=b[0];
    var avg='<tr class="ns-avg"><td>\u67a0'+lane+' \u5168\u4f53</td><td></td>'
      +[1,2,3].map(function(k){ return '<td>'+(bn?Math.round(b[k]/bn*100)+"%":"\u2014")+'</td>'; }).join("")+'</tr>';
    return tr+avg;
  }).join("");
  var brow="";
  return '<details class="ns" data-dk="waku"><summary>'
    +'<span class="ns-badge">枠別成績</span>'
    +'<span class="ns-sum">その枠に入ったとき、どれだけ来ていたか</span>'
    +'<span class="ns-caret"></span></summary>'
    +'<div class="ns-body">'+periodTabs("ws", ps, PSEL.ws)
    +'<table>'+head+rows+brow+'</table>'
    +'<details class="ns-help" data-dk="waku-help"><summary>表の読み方</summary><dl>'
    +'<dt>この表は何か</dt><dd>その選手がその枠で走ったとき、1着・2着以内・3着以内に入った割合。進入が変わった分も枠番のまま数えている。</dd>'
    +'<dt>下段の分数</dt><dd>回数／走行数。上の％はこの分数から出している。走行数が少ないほど％は当てにならない。</dd>'
    +'<dt>「—」のセル</dt><dd>その期間にその枠で1走もしていない。0%ではない。</dd>'
    +'<dt>薄い字</dt><dd>走行数が20未満。1回の増減で大きく動く。</dd>'
    +'<dt>各行の下の「枠n 全体」</dt><dd>同じ期間・同じ枠の全選手平均。すぐ上の選手の％をこれと引き算して読む。母数が5万走規模なので分数は省いている。</dd>'
    +'<dt>期間の切り替え</dt><dd>短い期間ほど直近の調子が出るが、走行数が減る。2ヶ月だと1〜4走のことが多い。</dd>'
    +'<dt>出典</dt><dd>公式競走成績。補正はかけていない実数そのまま。</dd>'
    +'</dl></details></div></details>';
}

/* ── 逃げ時2着 ──────────────────────────────────────────── */
function nsShrink(pi,c,x,n,k){
  var sp=NS.shrink[pi]&&NS.shrink[pi][String(c)]&&NS.shrink[pi][String(c)][String(x)];
  if(!sp) return null;
  var p=sp[0], t=sp[1]; if(!n) return null;
  var w=t/(t+p*(1-p)/n); return w*(k/n)+(1-w)*p;
}
function nigeSecondTable(boats){
  if(!NS||!NS.cells||!NS.base||!NS.meta) return "";
  var ps=NS.meta.periods||[], i=ps.indexOf(PSEL.ns);
  if(i<0){ i=ps.indexOf("1y"); if(i<0) i=ps.length-1; PSEL.ns=ps[i]; }
  var tot=(NS.meta.races&&NS.meta.races[i])||0;
  var head='<tr><th>枠・選手</th>'+[2,3,4,5,6].map(function(x){return '<th>2着'+x+'</th>';}).join("")+'</tr>';
  var rows=boats.slice().sort(function(a,b){return parseInt(g(a,"枠"))-parseInt(g(b,"枠"));}).map(function(row){
    var lane=parseInt(g(row,"枠")), toban=g(row,"登録番号");
    var nm=g(row,"氏名").replace(/　+/g,"").slice(0,4);
    var arr=(NS.cells[toban]&&NS.cells[toban][String(lane)]);
    var cell=(arr&&arr[i])||[0,0,0,0,0,0];
    var n=cell[0];
    var tds=[2,3,4,5,6].map(function(x){
      var k=cell[x-1], s=nsShrink(i,lane,x,n,k);
      var pct=(s===null)?"—":Math.round(s*100)+"%";
      return '<td class="'+(x===lane?"ns-self":"")+(n&&n<20?" ns-thin":"")+'">'
        +'<span class="ns-p">'+pct+'</span><span class="ns-k">'+k+"/"+n+'</span></td>';
    }).join("");
    return '<tr><td>'+laneChip(lane)+'<span class="ns-nm">'+esc(nm)+'</span><span class="ns-k">該当'+n+'</span></td>'
      +tds+'</tr>';
  }).join("");
  var b=NS.base[i]||[0,0,0,0,0];
  var base='<tr class="ns-base"><td>全体<span class="ns-k">該当'+tot.toLocaleString("ja-JP")+'</span></td>'+[2,3,4,5,6].map(function(x){
    var k=b[x-2]; return '<td><span class="ns-p">'+(tot?Math.round(k/tot*100)+"%":"—")+'</span></td>';
  }).join("")+'</tr>';
  return '<details class="ns" data-dk="nige"><summary>'
    +'<span class="ns-badge">逃げ時２着</span>'
    +'<span class="ns-sum">1号艇が逃げたとき、2着はどのコースだったか</span>'
    +'<span class="ns-caret"></span></summary>'
    +'<div class="ns-body">'+periodTabs("ns", ps, PSEL.ns)
    +'<table>'+head+rows+base+'</table>'
    +'<details class="ns-help" data-dk="nige-help"><summary>表の読み方</summary><dl>'
    +'<dt>この表は何か</dt><dd>1号艇が逃げて決まったレースだけを集めて、そのとき2着がどのコースだったかを数えたもの。1着の話はしていない。</dd>'
    +'<dt>上段の％</dt><dd>走行数が少ない選手ほど全体平均に近づける補正をかけた値。少ない回数のたまたまを、その選手の特徴として読ませないため。</dd>'
    +'<dt>下段の分数</dt><dd>回数／該当レース数。補正前の実数。上段と食い違って見えるときは、右の数が小さい。選手名の下の「該当」は、その選手が1号艇の逃げのレースに出た数。</dd>'
    +'<dt>「—」のセル</dt><dd>その期間に該当レースが1つもない。0%ではない。</dd>'
    +'<dt>いちばん下の全体行</dt><dd>同じ期間の全レースでの2着コース分布。各選手の％をこれと引き算して読む。母数が数万レースなので分数は省いている。</dd>'
    +'<dt>期間の切り替え</dt><dd>短い期間を選ぶと該当レースが数走まで減り、％はほとんど全体平均のままになる。動かないこと自体が「この期間では材料がない」という意味。</dd>'
    +'<dt>枠番で引いている</dt><dd>出走表の時点では進入が決まっていないため、枠番どおりに進入したものとして引いている。前づけがあれば実際の進入とずれる。</dd>'
    +'<dt>出典</dt><dd>公式競走成績（Kファイル）。</dd>'
    +'</dl></details></div></details>';
}

/* タブのクリック。render() で作り直されるため、毎回 bind し直す側で呼ぶ */
function bindPeriodTabs(){
  var app=document.getElementById("app"); if(!app) return;
  var bs=app.querySelectorAll("[data-ptab]");
  for(var i=0;i<bs.length;i++){
    (function(el){
      el.onclick=function(e){
        e.preventDefault(); e.stopPropagation();
        PSEL[el.getAttribute("data-ptab")]=el.getAttribute("data-p");
        render();
      };
    })(bs[i]);
  }
}

function kimariteBar(km){
  if(!km) return "";
  /* ％の母数は見出しの1着数（抜き・恵まれは「その他」の1行にまとめる） */
  var cats=[["逃げ",km.nige],["差し",km.sashi],["まくり",km.makuri],["まくり差し",km.makurizashi],["その他",(km.nuki||0)+(km.megumare||0)]];
  var sum=km.win;
  if(sum<=0) return '<div class="kmr"><div class="kmr-ttl"><span>決まり手構成</span><span>データ僅少</span></div></div>';
  var segs=cats.filter(function(c){return c[1]>0;}).map(function(c){
    var pc=Math.round(c[1]/sum*100);
    return '<div class="kmr-seg" style="width:'+(c[1]/sum*100)+'%;background:'+KMR_COLS[c[0]]+'" title="'+c[0]+' '+pc+'%"></div>';
  }).join("");
  var legend=cats.map(function(c){
    var pc=sum?Math.round(c[1]/sum*100):0;
    return '<span><span class="kmr-dot" style="background:'+KMR_COLS[c[0]]+'"></span>'+c[0]+' '+pc+'%</span>';
  }).join("");
  return '<div class="kmr"><div class="kmr-ttl"><span>決まり手構成（1着'+km.win+'/'+km.out+'走）</span></div>'
    +'<div class="kmr-bar">'+segs+'</div><div class="kmr-legend">'+legend+'</div></div>';
}

/* コース別直近10走（courseLast10.json・進入コース別の生データ）。
   約900KB あるため初期取得には載せず、レース画面を最初に開いたときに1回だけ取る。
   取得に失敗したときはブロックごと出さない（予約した高さも解除する）。 */
function ensureCL10(){
  if(CL10_STATE!=="idle") return;
  CL10_STATE="loading";
  loadJSON("../data/courseLast10.json").then(function(j){
    CL10=(j&&j["選手"])?j:null;
    CL10_STATE=CL10?"ready":"error";
    rerender();
  }).catch(function(){ CL10_STATE="error"; rerender(); });
}
/* E30該当場成績（e30PlayerStats.json）・逃げ時の2着（nigeSecond.json）・枠別成績（wakuStats.json）。
   3つで展開後約3MBあり、どれもレース画面でしか使わないため初期取得には載せず、
   レース画面を最初に開いたときに1回だけ取る（ensureCL10 と同じ型）。取れなければ各ブロックを出さない。 */
var RS_STATE="idle";
function ensureRS(){

  loadJSON("../data/e30PlayerStats.json").then(function(j){ if(j&&j["選手成績"]){E30=j["選手成績"];E30META={期間:j["集計期間"],出典:j["出典"],対象場:j["対象場"]||{}};} rerender(); }).catch(function(){});
  loadJSON("../data/nigeSecond.json").then(function(j){ NS=j||null; rerender(); }).catch(function(){});

}
/* 展示タイム別の成績（tenjiStats.json）。選手ごとに 良い/普通/悪い の回数と、同じ進入コースの
   全選手平均で期待される回数だけを持つ。率はここで計算する。レース画面を開いたときに1回だけ取る。
   取得に失敗したときはブロックごと出さない。30走に満たない区分は率を出さない。 */
var TJ=null, TJ_STATE="idle", TJ_MIN=30;
function ensureTJ(){
  if(TJ_STATE!=="idle") return;
  TJ_STATE="loading";
  loadJSON("../data/tenjiStats.json").then(function(j){
    TJ=(j&&j.r)?j:null;
    TJ_STATE=TJ?"ready":"error";
    rerender();
  }).catch(function(){ TJ_STATE="error"; rerender(); });
}
function tenjiBlock(toban){
  if(TJ_STATE==="error") return "";
  if(TJ_STATE!=="ready") return '<div class="tj tj-wait"></div>';
  var p=TJ.r[String(toban)];
  if(!p) return "";
  var ks=["g","n","b"], lb={g:"展示 良い",n:"展示 普通",b:"展示 悪い"};

  var t={t1:0,t2:1,t3:2}[PSEL.tj]; if(t==null){ t=0; PSEL.tj="t1"; }

    var v=p[k]||[0,0,0,0,0,0,0], n=v[0]; tot+=n;
    var body=n<TJ_MIN?'<div class="tj-few">走数が少ない<br>ため省略</div>'
      :'<div class="tj-bv">'+Math.round(v[t+1]/n*100)+'<small>%</small></div>'
       +'<div class="tj-ba">同コース平均 '+Math.round(v[t+4]/n*100)+'%</div>';
    return '<div class="tj-box"><div class="tj-bl">'+lb[k]+'<span>'+n.toLocaleString()+'走</span></div>'+body+'</div>';
  }).join("");
  var s=String(p.s||""), since=/^\d{6}$/.test(s)?(s.slice(0,4)+'年'+parseInt(s.slice(4),10)+'月から'):'';
  return '<details class="tj" data-dk="tj-'+esc(String(toban))+'"><summary>展示タイム別の成績</summary>'
    +periodTabs("tj",["t1","t2","t3"],PSEL.tj)
    +'<div class="tj-d">良い＝2位に0.03秒差の単独トップ／悪い＝平均より0.03秒遅い</div>'
    +'<div class="tj-3">'+boxes+'</div>'
    +'<div class="tj-note">0.03秒の目安：展示タイムが0.01秒遅くなるごとに、2着以内の割合は1から2ptずつ下がる。1レースの最速と最遅の差は中央値0.12秒</div>'
    +'<div class="tj-n">'+since+'　'+tot.toLocaleString()+'走</div></details>';
}
function cl10Ymd(d){ var s=String(d||""); return /^\d{8}$/.test(s)?(s.slice(0,4)+"."+s.slice(4,6)+"."+s.slice(6,8)):"-"; }
function courseLast10Block(toban,lane){

    +'着順は日付順で左が古い（同じ日の中は場・レース番号の順）。失格・妨害・転覆は6着として数え、欠場はその1走だけ分母から除いている。'
    +'平均着は5走から出す。太字は枠なり以外で3回以上入ったコース。'
    +'出典：results/*.json（'+cl10Ymd(per.from)+'〜'+cl10Ymd(per.to)+'）。全体中央値は2025.7.15〜2026.8.6の実測で、集計期間とは別。</div>'
    +'</div></details></div>';

/* 1号艇の決着内訳（wakuStats.json の k1）。枠1で出たレースを決着で分ける。
   分母は枠別成績の枠1と同じ走数で、期間も枠別成績の切り替え（PSEL.ws）と連動する。
   合計が必ず走行数に一致するよう「その他」は走行数から引いて出す。
   k1 に空欄が残っているとき（meta.k1Blank>0）は内訳が閉じないので出さない。
   1号艇のカードには、データの有無にかかわらず同じ高さを予約する（CLS）。 */
var K1_ROWS=[["e","逃げ（1着）"],["s","差され"],["m","まくられ"],["z","まくり差され"],["x","1コース以外に進入"]];
function k1Block(toban,lane){
  if(lane!==1) return "";
  var none='<div class="k1-slot"></div>';
  if(!WS||!WS.k1||!WS.k1.cells||!WS.k1.base||!WS.meta||WS.meta.k1Blank!==0) return none;
  var ps=WS.meta.periods||[], i=ps.indexOf(PSEL.ws);
  if(i<0){ i=ps.indexOf("1y"); if(i<0) i=ps.length-1; }
  var arr=WS.cells[toban]&&WS.cells[toban]["1"];
  var n=(arr&&arr[i])?arr[i][0]:0;
  if(!n) return none;
  var kc=(WS.k1.cells[toban]&&WS.k1.cells[toban][i])||[0,0,0,0,0];
  var kb=WS.k1.base[i]||[0,0,0,0,0];
  var bn=(WS.base[i]&&WS.base[i]["1"])?WS.base[i]["1"][0]:0;
  var sum=function(a){ var s=0; for(var j=0;j<a.length;j++) s+=a[j]; return s; };
  var bp=function(k){ return bn?Math.round(k/bn*100)+"%":"\u2014"; };
  var rows=K1_ROWS.map(function(r,j){
    return '<tr><td>'+r[1]+'</td>'+rateCell(kc[j],n)+'<td class="k1-b">'+bp(kb[j])+'</td></tr>';
  }).join("")
    +'<tr><td>その他</td>'+rateCell(n-sum(kc),n)+'<td class="k1-b">'+bp(bn-sum(kb))+'</td></tr>';
  return '<div class="k1-slot"><details class="ns k1" data-dk="k1-'+esc(toban)+'"><summary>'
    +'<span class="ns-sum">1号艇で出たときの決着（'+(PLBL[ps[i]]||ps[i])+'・'+n+'走）</span>'
    +'<span class="ns-caret"></span></summary>'
    +'<div class="ns-body"><table><tr><th>決着</th><th>この選手</th><th>枠1 全体</th></tr>'+rows+'</table>'
    +'<details class="ns-help" data-dk="k1-help-'+esc(toban)+'"><summary>表の読み方</summary><dl>'
    +'<dt>この表は何か</dt><dd>その選手が1号艇で出たレースを、どう決着したかで分けた。行を足すと走行数になる。</dd>'
    +'<dt>差され・まくられ・まくり差され</dt><dd>1コースに入り、その決まり手で他の艇に1着を取られた回。</dd>'
    +'<dt>1コース以外に進入</dt><dd>前づけなどで1コースに入れなかった回。決まり手では分けていない。</dd>'

/* 今節モーター2連率（今節成績カラムの着から算出）。モーターは節を通じ艇に固定＝
   選手の今節結果＝そのモーターの今節結果。生データのみ・評価語なし。 */
function kinsetuMotor(row){
  var chaku=[];
  ["1日目成績","2日目成績","3日目成績","4日目成績","5日目成績","6日目成績"].forEach(function(k){
    var cell=(g(row,k)||"").trim(); if(!cell) return;
    cell.split(/\s+/).forEach(function(e){
      var p=e.split("/");                 // レース/進入/ST/着
      if(p.length===4 && /^\d+$/.test(p[3])) chaku.push(parseInt(p[3],10));
    });
  });
  var n=chaku.length, w2=chaku.filter(function(c){return c===1||c===2;}).length;
  return {n:n, w2:w2, rate:n?Math.round(w2/n*100):null};
}
function shinkaeLabel(row){
  var jcd=g(row,"場コード"), rep=HL_META.repl?HL_META.repl[jcd]:null;
  if(!rep) return "";
  var d=String(rep["新替日"]||"");
  if(!/^\d{8}$/.test(d)) return "";
  return '<span class="km-shinkae">新替 '+d.slice(0,4)+'/'+(+d.slice(4,6))+'/'+(+d.slice(6,8))+'</span>';
}
function kinMotorLine(row){
  var tsu=g(row,"モーター2連率"), moNo=g(row,"モーターNo");
  var k=kinsetuMotor(row);
  var sk=shinkaeLabel(row);
  if(k.n===0) return "";
  var few=k.n<5;   // 節序盤の少数走はN少を明示（%は参考）
  return '<div class="kinmotor">今節モーター No.'+esc(moNo)+'：<b>'+k.n+'走</b> 2連対<b>'+k.w2+'</b>（'+k.rate+'%）'
    +(few?'<span class="km-few">N少</span>':'')
    +sk+'</div>';
}

/* 企画レースの当日判定（企画名文字列のキーワードのみ・保守的）。
   企画系(進入固定/A級系/選抜)=teal、節ステージ(準優/優勝戦)=gold で区分を分ける。
   場別マーケ名(エイトビート等)は名称から形式を判定できないため型バッジを付けない（誤情報回避）。 */
function kikakuChips(kikaku, venueIsFix){
  var s=String(kikaku||""); var out=[];
  // 企画系（teal）
  if(/進入固定/.test(s) && !venueIsFix) out.push('<span class="chip chip-plan">進入固定</span>');
  if(/Ａ級|A級|三Ａ|３Ａ/.test(s))       out.push('<span class="chip chip-plan">A級系</span>');
  if(/選抜/.test(s))                      out.push('<span class="chip chip-plan">選抜</span>');
  // 節ステージ（gold・企画とは別区分）。準優勝戦は「優勝戦」を含むため先に判定。
  if(/準優/.test(s))          out.push('<span class="chip chip-stage">準優勝戦</span>');
  else if(/優勝戦/.test(s))   out.push('<span class="chip chip-stage">優勝戦</span>');
  return out;
}

/* E30該当場成績（この場がE30該当場のときのみ・事実の生データ・二層表示） */
var E30_TECH=["逃げ","差し","まくり","まくり差し","抜き","恵まれ"];
/* 前づけ実績：その選手が前づけして枠より内のコースに入った走の着順（2026-10-26 けん裁定・読者の依頼から）。
   予想ではなく過去の回数。20走に満たないうちは率を出さず回数だけ。前づけが1走も無い選手は出さない */
function maezukeBlock(toban){

    +(n<20?'':'（3着以内 '+pc(m[1]+m[2]+m[3],n)+'）');
  /* 入ったコースごとの内訳は選手図鑑の「前づけしたとき」に出す（2026-10-26 けん「詳細は選手図鑑に」） */

function fmtYmd(s){ s=String(s||""); return s.length===8?s.slice(0,4)+"/"+(+s.slice(4,6))+"/"+(+s.slice(6,8)):s; }
function e30Block(toban,jcd){

      +'<span class="w1">'+r["1着数"]+'</span><span class="w2">'+r["2連対数"]+'</span>'
      +'<span class="st">'+st+'</span><span class="tk">'+esc(tech||"-")+'</span></div>';
  }).join("");
  var per=E30META.期間, fmtP=function(d){return d?(d.slice(0,4)+"."+d.slice(4,6)+"."+d.slice(6,8)):"-";};
  var venue=E30META.対象場[jcd]["場名"];
  return '<details class="e30d" data-dk="e30-'+toban+'"><summary>'
    +'<span class="e30-badge">E30該当場</span>'
    +'<span class="e30-sum">当地'+esc(venue)+'含む該当場 <b>'+tot+'</b>走 ・ 1着<b>'+w1+'</b> ・ 2連対<b>'+w2+'</b>'+(few?'<span class="e30-few"> N少</span>':'')+'</span>'
    +'<span class="e30-caret"></span></summary>'
    +'<div class="e30-body">'
    +'<div class="e30-row hd"><span class="c">コース</span><span class="n">出走</span><span class="w1">1着</span><span class="w2">2連対</span><span class="st">平均ST</span><span class="tk">決まり手</span></div>'
    +rows
    +'<div class="e30-note">E30該当場（'+esc(Object.keys(E30META.対象場).map(function(k){return E30META.対象場[k]["場名"];}).join("・"))+'）通算の進入コース別・生データ。'
    +(per?fmtP(per["開始"])+'〜'+fmtP(per["終了"]):'')+'。1着の決まり手内訳を併記。平均STはF/欠場等を除外。N数の小さいコースは参考値。出典：'+esc(E30META.出典||"BoatraceOpenAPI/resultsミラー（mbrace由来）")+'。</div>'
    +'</div></details>';
}

/* 今節成績ミニテーブル（進入/着、着色） */
var SHU_COLS=["1日目成績","2日目成績","3日目成績","4日目成績","5日目成績","6日目成績"];
var SHU_LABELS=["初日","2日","3日","4日","5日","最終"];

/* ①の下振れ要因パネル。見どころページ(docs/highlights/index.html)のdownFactorHtmlと
   文言・出典・集計期間を揃える（新規集計なし・highlights.jsonの値をそのまま表示）。*/
function downFactorPanel(df){
  var n=(df&&df.count)||0;
  var items=(df&&df.items)||[];
  var list=n>0
    ? '<ul>'+items.map(function(it){return '<li>'+esc(it)+'</li>';}).join("")+'</ul>'
    : '<ul><li class="none">該当なし</li></ul>';
  return '<div class="panel panel-down"><div class="ttl">①の下振れ要因（'+n+'つ）</div>'+list+'</div>';
}

/* レース画面の下に固定する行き来のバー：前のR／レース一覧／次のR */
function raceNavBar(v,rno){
  var rs=Object.keys(v.races).map(Number).sort(function(a,b){return a-b;});
  var i=rs.indexOf(rno), pv=i>0?rs[i-1]:null, nx=(i>=0&&i<rs.length-1)?rs[i+1]:null;
  function side(r,dir){

      +(dir==="prev"?'<span class="rnav-ar">◀</span>':'')

    +'<button type="button" class="rnav-b rnav-list" data-go="list">'+esc(v.name)+'<br><small>レース一覧</small></button>'
    +side(nx,"next")+'</nav>';
}
/* レースの帯の出し入れと、いま見ている艇の札の印（一度だけ登録し、描き直しのたびに対象を差し替える） */
var RBAR={io:null,hooked:false};
function setupRaceBar(app){
  var rb=document.getElementById("rbar"), rh=app.querySelector(".race-head");
  if(RBAR.io){ RBAR.io.disconnect(); RBAR.io=null; }
  if(!rb||!rh) return;
  if("IntersectionObserver" in window){
    RBAR.io=new IntersectionObserver(function(es){ es.forEach(function(e){ rb.hidden=e.isIntersecting||e.boundingClientRect.top>0; }); markRaceBar(); });
    RBAR.io.observe(rh);
  }
  var slow=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  Array.prototype.forEach.call(rb.querySelectorAll(".rbar-b"),function(a){
    a.onclick=function(e){ e.preventDefault(); var t=document.getElementById("bt"+a.getAttribute("data-ln")); if(t) t.scrollIntoView({block:"start",behavior:slow?"auto":"smooth"}); };
  });
  markRaceBar();
  if(!RBAR.hooked){ RBAR.hooked=true; var tk=0; window.addEventListener("scroll",function(){ if(!tk){ tk=1; requestAnimationFrame(function(){ tk=0; markRaceBar(); }); } },{passive:true}); }
}
function markRaceBar(){
  var rb=document.getElementById("rbar"); if(!rb||rb.hidden) return;
  var cur=null; Array.prototype.forEach.call(document.querySelectorAll(".boat[id^=bt]"),function(b){ if(b.getBoundingClientRect().top<=64) cur=b.id.slice(2); });
  Array.prototype.forEach.call(rb.querySelectorAll(".rbar-b"),function(a){ a.classList.toggle("on",a.getAttribute("data-ln")===cur); });
}
function renderRace(app,crumb,v){
  var rc=v.races[view.rno];
  if(!rc){ view={page:"races",key:view.key,sort:view.sort}; render(); return; }
  recordViewed(v,view.rno);   /* 見たレースを記憶（回収ループの起点） */
  crumb.innerHTML='<a href="#" id="back0">場一覧</a> ＞ <a href="#" id="back1">'+esc(v.name)+'</a> ＞ '+view.rno+'R';
  /* 見どころ結合は開催日一致時のみ（stale/翌日データの誤結合を防止） */
  var hlKey=v.jcd+"_"+view.rno+"R";
  var hl=(HL[hlKey]&&HL_META.hd===v.hd)?HL[hlKey]:null;
  /* 中止のレースは見立て・荒れ・締切時刻の風を出さない（締切は実在しない値のため） */
  var chR=isChushi(v,view.rno);
  if(chR) hl=null;

  /* ヘッダ＋締切カウントダウン */
  function fmtMins(m){ if(m<60) return m+"分"; return Math.floor(m/60)+"時間"+(m%60)+"分"; }
  var mins=minsToClose(v.hd,rc.deadline), cdCls="cd-open", cdTxt="";
  if(mins===null){ cdTxt=""; }
  else if(mins<0){ cdCls="cd-closed"; cdTxt="締切済み"; }
  else if(mins>=9999){ cdCls="cd-open"; cdTxt="翌日開催"; }
  else if(mins<=15){ cdCls="cd-soon"; cdTxt="締切まで"+fmtMins(mins); }
  else { cdCls="cd-open"; cdTxt="締切まで"+fmtMins(mins); }
  var cdHtml=cdTxt?'<span class="cd '+cdCls+'">'+esc(cdTxt)+'</span>':'';
  if(chR) cdHtml='<span class="cd cd-chushi">中止</span>';

  /* 気になる（記憶）＋公式リンク（出走表・結果） */
  var wOn=isWatched(v.jcd,v.hd,view.rno);
  var wbtn='<span class="watchbtn'+(wOn?' on':'')+'" id="watchbtn">'+(wOn?'✅ 追加済み':'🔖 気になる')+'</span>';
  var off="";
  if(/^\d{8}$/.test(v.hd)){
    var base="https://www.boatrace.jp/owpc/pc/race/", q="?rno="+view.rno+"&jcd="+v.jcd+"&hd="+v.hd;
    var closed=isClosed(v.hd,rc.deadline);
    off=(chR?'':'<a class="offlink '+(closed?"offlink-result":"offlink-pend")+'" href="'+base+'raceresult'+q+'" target="_blank" rel="noopener">🏁 '+(closed?"レース結果（公式）":"結果（締切後）")+' ↗</a>')
      +'<a class="offlink offlink-card" href="'+base+'racelist'+q+'" target="_blank" rel="noopener">公式出走表 ↗</a>';
  }
  var uranai='<a class="offlink offlink-card" href="../uranai/?jcd='+v.jcd+'&hd='+v.hd+'&rno='+view.rno+'R&from=racers">🔮 この6艇を占う</a>';
  var ichi=MAE_DAYS.indexOf(v.hd)>=0?'<a class="offlink offlink-card" href="../ichimark/?d='+v.hd+'&j='+v.jcd+'&r='+view.rno+'">1マークの見立て</a>':'';
  var links='<div class="race-links">'+wbtn+off+ichi+uranai+'</div>';
  var html='<div class="race-head"><div class="line1"><span class="rt">'+esc(v.name)+' '+view.rno+'R</span><span class="kikaku">'+esc(rc.kikaku)+'</span></div>'
    +'<div class="dl">'+cdHtml+(chR?'':'<span>締切 '+esc(rc.deadline||"-")+'</span>')+'<span>'+esc(v.setsu)+' '+esc(v.day)+'</span></div>'
    +links+'</div>';

  /* サマリーチップ */
  var ar=chR?null:findArare(v.jcd,view.rno,v.hd), wd=chR?null:findWind(v.jcd,v.hd,rc.deadline);
  var chips=[];
  if(ar) chips.push('<span class="chip chip-arare-'+esc(ar.level)+'">荒れ <b>'+esc(ar.level)+'</b>（'+esc((arare&&arare.max_score)||"-")+'点中'+esc(ar.score)+'点）</span>');
  if(hl&&hl.in1!=null) chips.push('<span class="chip">イン1着率 <b>'+esc(hl.in1)+'%</b></span>');
  /* ①着外の段階。見どころの「①着外」と同じ値（区切りは ../assets/haranLv.js にだけ置く） */
  var lvTxt=hl?haranLvOf(hl.hidx,hl.haran):null;
  if(lvTxt!=null) chips.push('<span class="chip">①着外 <b>'+esc(lvTxt)+'</b></span>');
  var venueIsFix=HL_META.fix.indexOf(v.name)>=0;
  if(venueIsFix) chips.push('<span class="chip chip-fix">進入固定</span>');
  kikakuChips(rc.kikaku, venueIsFix).forEach(function(c){ chips.push(c); });
  if(wd) chips.push('<span class="chip">風 <b>'+esc(windArrow(wd.dir)+" "+wd.dir)+'</b> '+esc(wd.wind)+'m</span>');
  if(hl) chips.push('<a class="chip chip-link" href="../highlights/#v'+v.jcd+'r'+view.rno+'">📖 見立てを読む</a>');
  if(chips.length) html+='<div class="chips">'+chips.join("")+'</div>';

  /* 荒れサインは荒れの札の根拠なので表層に残す（点つき）。下振れ要因・展開・風・潮は1つの折りたたみへ */
  var mido='', midoParts=[];
  /* 荒れ要因 */
  if(ar&&ar.factors&&ar.factors.length){
    html+='<div class="panel panel-arare"><div class="ttl">荒れサイン（'+esc((arare&&arare.max_score)||"-")+'点中'+esc(ar.score)+'点）</div><ul>'+ar.factors.map(function(f){return '<li>'+esc(f)+'（'+(/荒れ度高/.test(f)?2:1)+'点）</li>';}).join("")+'</ul><div class="arare-def">6点の内訳：水面の荒れ度（高2点・中1点）、1号艇の級別、1号艇の当地勝率、4号艇のスタート、1号艇の機力（各1点）</div></div>';
  }
  /* ①の下振れ要因（highlights.json の値をそのまま表示。新規集計はしない） */
  if(hl&&hl.df){ mido+=downFactorPanel(hl.df); midoParts.push('下振れ要因'+((hl.df.count)||0)+'つ'); }
  /* 展開（複数シナリオ・断定なし。見立て/波及は非表示） */
  if(hl&&hl.tenkai&&hl.tenkai.length){
    midoParts.push('展開'); mido+='<div class="panel panel-tenkai"><div class="ttl">展開の見どころ</div><ul>'
      +hl.tenkai.map(function(t){return '<li>'+esc(t)+'</li>';}).join("")
      +'</ul><div class="note">※データに基づく複数シナリオの併置。勝敗の断定・買い目ではありません。</div></div>';
  }
  /* 風詳細 */
  if(wd){
    midoParts.push('風'); mido+='<div class="panel panel-wind"><div class="ttl">締切時刻の風予報</div>'
      +esc((windArrow(wd.dir)+" ")+wd.dir)+' '+esc(wd.wind)+'m｜'+esc(wd.wx)+'（'+esc(String(wd.time).replace("T"," ").slice(5))+' 時点）</div>';
  }
  /* 当日干満（潮汐場のみ・水面コンディションの事実。見どころと同じ思想） */
  if(tide && tide['stadiums'] && tide['stadiums'][v.jcd]){
    var ts=tide['stadiums'][v.jcd], tp=[];
    if(tide['潮回り']) tp.push(esc(tide['潮回り']));
    if(ts['干満差']!=null) tp.push('干満差 '+esc(ts['干満差'])+'m');
    if(ts['現在潮位']!=null) tp.push('現在 '+esc(ts['現在潮位'])+'m');
    if(ts['満潮']&&ts['満潮'].length) tp.push('満潮 '+ts['満潮'].map(esc).join('・'));
    if(ts['干潮']&&ts['干潮'].length) tp.push('干潮 '+ts['干潮'].map(esc).join('・'));
    if(tp.length){
      midoParts.push('潮'); mido+='<div class="panel panel-tide"><div class="ttl">当日の潮（水面コンディションの事実）</div>'
        +tp.join('｜')
        +'<div class="note">事実の提示のみ。勝敗・荒れ予想には用いません。</div></div>';
    }
  }

  if(mido) html+='<details class="mido" data-dk="mido"><summary>見どころ：'+midoParts.join('・')+'</summary><div class="mido-body"><div class="mido-note">当ポータルが数字から作った材料で、勝敗の断定・買い目ではありません。</div>'+mido+'</div></details>';

  /* 並び替え */
  var sorts=[["枠","枠順"],["ST","平均ST"],["機力","機力"],["当地","当地勝率"]];
  html+='<div class="sortbar">'+sorts.map(function(s){
    return '<span class="sortbtn'+(view.sort===s[0]?" on":"")+'" data-s="'+s[0]+'">'+esc(s[1])+'順</span>';
  }).join("")+'</div>';

  /* 相対比較用の基準値 */
  var boats=rc.boats.slice();
  var sts=boats.map(function(r){return parseFloat(g(r,"平均ST"));}).filter(function(x){return !isNaN(x);});
  var minST=Math.min.apply(null,sts), maxST=Math.max.apply(null,sts);
  var motors=boats.map(function(r){return parseFloat(g(r,"モーター2連率"));}).filter(function(x){return !isNaN(x);});
  var maxMotor=Math.max.apply(null,motors);

  /* 並び替え適用 */
  function sortKey(r){
    if(view.sort==="ST"){ var s=parseFloat(g(r,"平均ST")); return isNaN(s)?99:s; }
    if(view.sort==="機力"){ var m=parseFloat(g(r,"モーター2連率")); return isNaN(m)?-1:-m; }
    if(view.sort==="当地"){ var t=parseFloat(g(r,"当地勝率")); return isNaN(t)?-1:-t; }
    return parseInt(g(r,"枠"));
  }
  boats.sort(function(a,b){ return sortKey(a)-sortKey(b); });

  ensureCL10();
  ensureTJ();
  ensureRS();
  html+=cmp6Table(boats);
  html+=wakuStatsTable(rc.boats);
  html+=nigeSecondTable(rc.boats);
  html+='<div class="card-legend">札：<span class="sw sw-j">点線</span>数字から出した判定<span class="sw sw-l">丸</span>地元<span class="sw sw-f">太線</span>F持ち</div>';
  html+=boats.map(function(row){ return boatCard(row,v,hl,minST,maxST,maxMotor); }).join("");

  html+=yomiBox(v,view.rno);
  html+='<div class="legend-note">出典: BOATRACE公式出走表（勝率・2連率・3連率・モーター・ボート・今節成績。モーターとボートは勝率なし）｜決まり手構成は直近183日集計｜1号艇の決着は枠別成績と同じ期間｜機力評価・展開・荒れ指数は当ポータル生成｜風はOpen-Meteo。<br>本ページは水面傾向・展開の可視化に留め、勝敗の断定・買い目・確率は提示しません。</div>';

  html+=raceNavBar(v,view.rno);
  /* レースの帯：レースの頭が画面の上に消えたら出る。艇番の札は枠の色・押すとその艇へ */
  html+='<div class="rbar" id="rbar" hidden><div class="rbar-in"><span class="rbar-t">'+esc(v.name)+' '+view.rno+'R</span><span class="rbar-d">'+(chR?'中止':esc(rc.deadline||''))+'</span><span class="rbar-l">'
    +rc.boats.map(function(r){ var ln=parseInt(g(r,"枠")); var c=LANE_COLOR[ln]||["#333","#fff"]; return isNaN(ln)?'':'<a class="rbar-b wk'+ln+'" href="#bt'+ln+'" data-ln="'+ln+'" aria-label="'+ln+'号艇へ" style="background:'+c[0]+';color:'+c[1]+'">'+ln+'</a>'; }).sort().join("")
    +'</span></div></div>';
  app.innerHTML=html;
  setupRaceBar(app);
  document.getElementById("back0").onclick=function(e){e.preventDefault();navGo({page:"venues",sort:view.sort});};
  document.getElementById("back1").onclick=function(e){e.preventDefault();navGo({page:"races",key:view.key,sort:view.sort});};
  Array.prototype.forEach.call(app.querySelectorAll("[data-go]"),function(el){
    el.onclick=function(){ var g=el.getAttribute("data-go");
      if(g==="list") navGo({page:"races",key:view.key,sort:view.sort});
      else navGo({page:"race",key:view.key,rno:parseInt(g,10),sort:view.sort}); };
  });
  bindPeriodTabs();
  Array.prototype.forEach.call(app.querySelectorAll(".sortbtn"),function(el){
    el.onclick=function(){ view.sort=el.getAttribute("data-s"); render(); };
  });
  var wb=document.getElementById("watchbtn");
  if(wb) wb.onclick=function(){ toggleWatch(v,view.rno); render(); };
  Array.prototype.forEach.call(app.querySelectorAll(".oshibtn"),function(el){
    el.onclick=function(e){ e.stopPropagation(); toggleOshi(el.getAttribute("data-toban"),el.getAttribute("data-name")); render(); };
  });
  Array.prototype.forEach.call(app.querySelectorAll(".yomibtn"),function(el){
    el.onclick=function(){ yomiSet(v,view.rno,parseInt(el.getAttribute("data-y"),10)); render(); };
  });
}

function numPct(s){ var x=parseFloat(s); return isNaN(x)?'-':x.toFixed(1); }
function boatCard(row,v,hl,minST,maxST,maxMotor){
  var lane=parseInt(g(row,"枠"));
  var lc=LANE_COLOR[lane]||["#333","#fff"];
  var kl=g(row,"級別");
  var zk=parseFloat(g(row,"全国勝率")), tk=parseFloat(g(row,"当地勝率"));
  var hot=!isNaN(zk)&&!isNaN(tk)&&tk>zk;
  var fn=parseInt(g(row,"F数"))||0;
  var local=g(row,"支部")===HOME_BRANCH[v.jcd];
  var name=g(row,"氏名").replace(/　+/g,"　");
  var toban=g(row,"登録番号");
  var km=KMR[toban], pf=PROF[toban]||{}, hb=(hl&&hl.boats[lane])||null;

  var st=parseFloat(g(row,"平均ST"));
  var fastest=!isNaN(st)&&st===minST;
  var motor=parseFloat(g(row,"モーター2連率"));
  var bestMotor=!isNaN(motor)&&motor===maxMotor;
  var machEval=hb?hb["機力評価"]:null, sharpST=hb?hb["鋭ST"]:false, localAdv=hb?hb["当地優位"]:false;

  var nick=pf.nickname||pf.tagline||"";
  var bdMark=(BIRTHDAYS[g(row,"開催日")]||{})[toban];
  var badges=''
    +(fastest?'<span class="badge-st">最速ST</span>':'')
    +(bestMotor?'<span class="badge-mach">機力上位</span>':'')
    +(local?'<span class="badge-local">地元</span>':'')
    +(fn>0?'<span class="badge-f">F'+fn+'</span>':'')
    +(bdMark?'<span class="badge-bd">誕</span>':'');

  /* タグ */
  var tags=[];
  if(sharpST) tags.push('<span class="tag" style="border:1.5px dashed #c3ccd6;border-radius:3px;color:#e0e6ed">鋭いST</span>');
  if(localAdv||hot) tags.push('<span class="tag tag-local">当地得意</span>');
  if(machEval==="high") tags.push('<span class="tag tag-mach-high">機力◎</span>');
  else if(machEval==="low") tags.push('<span class="tag tag-mach-low">機力△</span>');
  var tagsHtml=(badges||tags.length)?'<div class="badges">'+badges+tags.join("")+'</div>':'';

  var nameHtml=toban
    ?'<a class="pname" href="../players/?toban='+esc(toban)+'" style="color:inherit;text-decoration:none;">'+esc(name)+'<span class="badge-detail">詳細</span></a>'
    :'<span class="pname">'+esc(name)+'</span>';
  var oshi=isOshi(toban);
  var oshiBtn=toban?'<button type="button" class="oshibtn'+(oshi?' on':'')+'" data-toban="'+esc(toban)+'" data-name="'+esc(name)+'" title="推しフォロー" aria-pressed="'+(oshi?'true':'false')+'" aria-label="'+esc(name)+(oshi?'のフォローを解除':'をフォロー')+'">'+(oshi?'⭐':'☆')+'</button>':'';

  return '<div class="boat'+(oshi?' oshi-on':'')+'" id="bt'+lane+'"><div class="lane-bar" style="background:'+lc[0]+'"></div><div class="boat-body">'
    +'<div class="boat-top">'
    +'<span class="lane-num" style="background:'+lc[0]+';color:'+lc[1]+';'+((lane===1||lane===2)?'border:1px solid #445;':'')+'">'+lane+'</span>'
    +'<span class="klass k-'+esc(kl)+'">'+esc(kl)+'</span>'+nameHtml+oshiBtn
    +'</div>'
    +(KANA[toban]?'<div class="pkana">'+esc(KANA[toban])+'</div>':'')
    +(nick?'<div class="nick">“'+esc(nick)+'”</div>':'')
    +'<div class="boat-sub">'+esc(g(row,"支部"))+'／'+esc(g(row,"出身"))+'・'+esc(g(row,"年齢"))+'歳　平均ST <span class="boat-st">'+(isNaN(st)?"-":st.toFixed(2))+'</span></div>'
    +tagsHtml
    +'<div class="nums">'
    +'<span></span><span class="h">全国</span><span class="h">当地'+(hot?' ↑':'')+'</span>'
    +'<span class="h">モーター<br>'+(g(row,"モーターNo")?'<a href="../motor-maintenance/#m'+esc(g(row,"場コード"))+'-'+esc(parseInt(g(row,"モーターNo"),10))+'" onclick="event.stopPropagation()">'+esc(g(row,"モーターNo"))+'号 整備</a>':'-')+'</span>'
    +'<span class="h">ボート<br>'+(g(row,"ボートNo")?esc(g(row,"ボートNo"))+'号':'-')+'</span>'
    +'<span class="l">勝率</span><span class="v">'+fmtNum(g(row,"全国勝率"))+'</span><span class="v">'+fmtNum(g(row,"当地勝率"))+'</span><span class="v na" aria-label="なし">-</span><span class="v na" aria-label="なし">-</span>'
    +'<span class="l">2連率%</span><span class="v">'+numPct(g(row,"全国2連率"))+'</span><span class="v">'+numPct(g(row,"当地2連率"))+'</span><span class="v">'+numPct(g(row,"モーター2連率"))+'</span><span class="v">'+numPct(g(row,"ボート2連率"))+'</span>'
    +'<span class="l">3連率%</span><span class="v">'+numPct(g(row,"全国3連率"))+'</span><span class="v">'+numPct(g(row,"当地3連率"))+'</span><span class="v">'+numPct(g(row,"モーター3連率"))+'</span><span class="v">'+numPct(g(row,"ボート3連率"))+'</span>'
    +'</div>'
    +kinMotorLine(row)
    +kimariteBar(km)
    +tenjiBlock(toban)
    +courseLast10Block(toban,lane)
    +(toban?'<a class="snLink" href="../players/card.html?toban='+esc(toban)+'#snSec" onclick="event.stopPropagation()">進入実績（枠から入ったコースの回数）<span>選手カード →</span></a>':'')
    +maezukeBlock(toban)
    +k1Block(toban,lane)
    +e30Block(toban,v.jcd)
    +shuTable(row)
    +'</div></div>';
}

function rerender(){ render(); }
render();
/* 締切カウントダウンを毎分更新（race画面のみ再描画） */
setInterval(function(){ if(view.page==="race") render(); }, 30000);
</script>
<script>
/* PWA: Service Worker 登録 ＋「ホーム画面に追加」導線 */
(function(){
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){ navigator.serviceWorker.register("../sw.js").catch(function(){}); });
  }
  var el=document.getElementById("a2hs");
  if(!el) return;
  function standalone(){ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; }
  function dismissed(){ try{ return localStorage.getItem("br_a2hs")==="1"; }catch(e){ return false; } }
  function dismiss(){ try{ localStorage.setItem("br_a2hs","1"); }catch(e){} el.hidden=true; }
  if(standalone()||dismissed()) return;
  var ICON='<img src="../icon180.png" alt="">';
  var deferred=null;
  window.addEventListener("beforeinstallprompt",function(ev){
    ev.preventDefault(); deferred=ev;
    el.innerHTML=ICON+'<div class="a2t"><b>ホーム画面に追加</b>：アプリのように1タップで開けます。</div>'
      +'<button class="a2add" id="a2add">追加</button><button class="a2x" id="a2x">×</button>';
    el.hidden=false;
    document.getElementById("a2x").onclick=dismiss;
    document.getElementById("a2add").onclick=function(){
      el.hidden=true; deferred.prompt();
      deferred.userChoice.finally(function(){ deferred=null; dismiss(); });
    };
  });
  // iOS Safari は beforeinstallprompt が無いので手順を案内
  var ua=navigator.userAgent||"";
  var isIOS=/iPhone|iPad|iPod/.test(ua) && !window.MSStream;
  var isSafari=/Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
  if(isIOS && isSafari){
    el.innerHTML=ICON+'<div class="a2t"><b>ホーム画面に追加</b>：共有 <span style="font-size:14px">⬆️</span> →「ホーム画面に追加」でアプリのように使えます。</div>'
      +'<button class="a2x" id="a2x">×</button>';
    el.hidden=false;
    document.getElementById("a2x").onclick=dismiss;
  }
})();
</script>
