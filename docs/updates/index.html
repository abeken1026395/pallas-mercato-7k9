<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="author" content="あべけん（データ攻め）">
<link rel="canonical" href="https://abeken1026395.github.io/pallas-mercato-7k9/updates/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>更新履歴 | データ攻め</title>
<style>
  :root{
    --bg:#0b1219; --card:#121c26;
    --line:#1f2e3c; --txt:#e7eef5; --sub:#8aa0b4;
    --accent:#ffd166; --accent-dim:#caa23f;
    /* 1行の高さ。リスト枠の寸法予約（CLS対策）と同じ値を使う。 */
    --row-h:46px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.6;padding-bottom:60px}
  a{color:inherit}
  [hidden]{display:none !important}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}

  .hero{position:relative;padding:30px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .hero .row{display:flex;align-items:center;gap:12px}
  .hero .icon{flex:none;width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,#1d2c3a,#0e1822);border:1px solid var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:24px;font-weight:800;letter-spacing:.02em;line-height:1.2}
  .lead{color:var(--sub);font-size:13px;margin-top:8px;max-width:560px}
  .count{color:var(--sub);font-size:12px;margin-top:10px;font-variant-numeric:tabular-nums}
  .count b{color:var(--accent);font-size:14px}

  /* リスト枠。読み込み中は1行分だけ確保し、件数が分かった時点で
     実際の件数（最大10件）ぶんを --rows に入れて予約し直す。
     0件のままなら1行分のまま＝空パネルを作らない。 */
  .list{
    list-style:none;
    --rows:1;
    min-height:calc(var(--row-h) * var(--rows));
    border:1px solid var(--line);border-radius:12px;
    background:var(--card);
    padding:0 12px;
  }
  .item{
    display:grid;grid-template-columns:96px 104px 1fr;gap:0 12px;align-items:baseline;
    min-height:var(--row-h);padding:12px 2px;
    border-bottom:1px solid var(--line);
  }
  .item:last-child{border-bottom:none}
  .item .d{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
  .item .p{font-size:12px;color:var(--sub);word-break:break-all}
  .item .t{font-size:14px;color:var(--txt)}
  @media (max-width:520px){
    /* 狭い画面では「日付・ページ名」と「本文」を2段にする。
       行が高くなるぶん、寸法の予約値（--row-h）も同じ値に合わせる。 */
    :root{--row-h:69px}
    .item{grid-template-columns:88px 1fr;gap:0 10px}
    .item .t{grid-column:1 / -1;margin-top:2px}
  }

  /* 読み込み中・0件・失敗時。1行分＋メッセージだけの高さに収める。 */
  .note{
    min-height:var(--row-h);
    display:flex;align-items:center;justify-content:center;
    color:var(--sub);font-size:13px;text-align:center;padding:12px;
  }

  .more{
    display:block;width:100%;margin-top:14px;
    min-height:48px;padding:12px 16px;
    background:#16222e;color:var(--txt);
    border:1px solid var(--line);border-radius:12px;
    font-size:14px;font-family:inherit;line-height:1.5;cursor:pointer;
  }
  .more:hover{border-color:var(--accent-dim)}
  .more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .back{display:inline-block;margin-top:22px;padding:10px 4px;font-size:13px;color:var(--sub);text-decoration:underline}
  .back:hover{color:var(--txt)}
  .footer{margin-top:26px;font-size:11px;color:#4a6070;line-height:1.7}
.siteback{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;margin:6px 0 2px;font-size:13px;line-height:1;color:inherit;text-decoration:underline;text-underline-offset:3px}
.siteback:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.wrap::after{content:"データ攻め ／ YouTube あべけん";display:block;margin:16px 0 0;font-size:11px;color:#8a8f98;letter-spacing:.02em}
html[data-vr] .wrap::after{content:none;margin:0}
.vr-note{display:block;margin:16px 0 0;font-size:11px;color:#8a8f98;letter-spacing:.02em}
</style>
</head>
<body>
<a class="siteback" href="../">← データ攻め トップ</a>
<div class="wrap">

  <div class="hero">
    <div class="row">
      <div class="icon" aria-hidden="true">🗒️</div>
      <h1>更新履歴</h1>
    </div>
    <p class="lead">どのページの何を変えたかの記録です。新しいものが上にあります。</p>
    <p class="count" id="count">　</p>
  </div>

  <ul class="list" id="list" aria-live="polite">
    <li class="note" id="note">読み込み中</li>
  </ul>

  <!-- リストより下の要素は、件数が確定してから初めて描画する。
       先に置いて後から押し下げると、その分がレイアウトのずれになるため。 -->
  <div id="after" hidden>
    <button type="button" class="more" id="more" hidden>すべて見る</button>

    <div class="footer">
      © 2026 データ攻め ── 制作・運営 あべけん
    </div>
  </div>

</div>
<script>
// 更新履歴の描画。初期10件、「すべて見る」で全件。自動リロード・既読管理はしない。
(function(){
  var INITIAL = 10;
  var LIST  = document.getElementById("list");
  var NOTE  = document.getElementById("note");
  var MORE  = document.getElementById("more");
  var AFTER = document.getElementById("after");
  var COUNT = document.getElementById("count");
  var data = [], shown = 0;

  function note(msg){
    LIST.innerHTML = "";
    var li = document.createElement("li");
    li.className = "note";
    li.textContent = msg;
    LIST.appendChild(li);
  }

  function makeItem(e){
    var li = document.createElement("li");
    li.className = "item";
    var d = document.createElement("span");
    d.className = "d";
    d.textContent = String(e.date || "").replace(/-/g, "/");
    var p = document.createElement("span");
    p.className = "p";
    p.textContent = e.page || "";
    var t = document.createElement("span");
    t.className = "t";
    t.textContent = e.text || "";
    li.appendChild(d); li.appendChild(p); li.appendChild(t);
    return li;
  }

  function baseRows(){
    var c = document.querySelector('link[rel="canonical"]');
    var ok = !!(c && c.href && location.href.slice(0, c.href.length) === c.href);
    if(ok){
      document.documentElement.setAttribute("data-vr", "1");
    }else if(!document.querySelector(".vr-note")){
      var n = document.createElement("small");
      n.className = "vr-note";
      n.style.cssText = "display:block;margin:16px 0 0;font-size:11px;color:#8a8f98";
      n.textContent = "データ攻め ／ YouTube あべけん";
      var w = document.querySelector(".wrap");
      if(w) w.appendChild(n);
    }
    return INITIAL;
  }

  function render(upto){
    var frag = document.createDocumentFragment();
    for(var i = shown; i < upto && i < data.length; i++) frag.appendChild(makeItem(data[i]));
    LIST.appendChild(frag);
    shown = Math.min(upto, data.length);
    var rest = data.length - shown;
    if(rest > 0){
      MORE.textContent = "すべて見る（残り" + rest + "件）";
      MORE.hidden = false;
    }else{
      MORE.hidden = true;
    }
  }

  MORE.addEventListener("click", function(){ render(data.length); });

  fetch("../data/updates.json", { cache: "no-store" })
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(d){
      if(!Array.isArray(d)) return Promise.reject();
      data = d;
      COUNT.textContent = "全 " + data.length + " 件";
      if(data.length === 0){ note("まだ記録はありません。"); return; }
      // このページを開いた時点の最新 date を既読として記録し、トップの更新サインを消す。
      // 触るのは専用キー br_updates_seen だけ。他のキーは読みも書きもしない。
      var latest = String((data[0] || {}).date || "");
      if(/^\d{4}-\d{2}-\d{2}$/.test(latest)){
        try { localStorage.setItem("br_updates_seen", latest); } catch(e){}
      }
      // 実際に出す件数（最大10件）ぶんの高さを予約してから描画する。
      LIST.style.setProperty("--rows", Math.min(data.length, baseRows()));
      LIST.innerHTML = "";
      render(baseRows());
    })
    .catch(function(){
      COUNT.textContent = "　";
      note("更新履歴を読み込めませんでした。");
    })
    .then(function(){ AFTER.hidden = false; });
})();
</script>
<script src="../assets/guard.js" defer></script>
</body>
</html>
