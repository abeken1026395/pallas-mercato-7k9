<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="author" content="あべけん（データ攻め）">
<link rel="canonical" href="https://abeken1026395.github.io/pallas-mercato-7k9/updates/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>更新履歴 | データ攻め</title>
<style>
  :root{
    --bg:#0b1219; --card:#121c26; --card2:#16283a;
    --line:#1f2e3c; --txt:#e7eef5; --sub:#a3b5c6; --dim:#8aa0b4;
    --hi:#f2b155;
    --c-race:#e05b4b; --c-mido:#f2b155; --c-ken:#9b8cf0; --c-sen:#cdd6e0; --c-mo:#3fb1c9; --c-jo:#7fd4a8; --c-etc:#8a9bb0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.7;-webkit-text-size-adjust:100%;padding-bottom:60px}
  a{color:inherit}
  [hidden]{display:none !important}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px}

  .hero{padding:22px 0 4px}
  h1{font-size:24px;font-weight:800;letter-spacing:.02em;line-height:1.2}
  .lead{color:var(--sub);font-size:14px;margin-top:8px}

  /* 種類で絞る。押した札だけを出す */
  .flt{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px;min-height:36px}
  .flt button{font:inherit;font-size:13.5px;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 13px;min-height:36px;cursor:pointer}
  .flt button[aria-pressed="true"]{border-color:var(--hi);color:var(--hi);font-weight:700}
  .flt button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}

  /* 日ごとに束ねる */
  .rows{min-height:240px}
  .day{margin:22px 0 6px;display:flex;align-items:baseline;gap:10px}
  .day b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
  .seen{display:flex;align-items:center;gap:10px;margin:22px 0 0;font-size:12.5px;color:var(--dim)}
  .seen:before,.seen:after{content:"";flex:1;height:1px;background:var(--line)}
  .it{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:11px 13px 10px;margin:8px 0}
  .it .t{font-size:16px;line-height:1.7;margin-top:5px}
  .it .go{display:block;margin-top:4px;font-size:13px;color:var(--hi);font-weight:700}
  .it.fresh{background:var(--card2)}
  a.it:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
  /* ページの札：色はページの種類ごとに固定。文字でもページ名を書く（色だけで伝えない） */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--txt);padding:1px 9px 1px 7px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);white-space:nowrap}
  .chip:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
  .newmk{margin-left:8px;font-size:11px;font-weight:800;color:#0b1219;background:var(--hi);border-radius:4px;padding:0 6px;vertical-align:1px}

  .note{min-height:46px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;text-align:center;padding:12px}
  .morebtn{display:block;width:100%;margin-top:16px;min-height:48px;padding:12px 16px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;line-height:1.5;cursor:pointer}
  .morebtn:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
  .footer{margin-top:26px;font-size:11px;color:#4a6070;line-height:1.7}
.sitelink{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;margin:6px 0 2px;font-size:13px;line-height:1;color:inherit;text-decoration:underline;text-underline-offset:3px}
.sitelink:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.siteback{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;margin:6px 0 2px;font-size:13px;line-height:1;color:inherit;text-decoration:underline;text-underline-offset:3px}
.siteback:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.wrap::after{content:"データ攻め ／ YouTube あべけん";display:block;margin:16px 0 0;font-size:11px;color:#8a8f98;letter-spacing:.02em}
html[data-vr] .wrap::after{content:none;margin:0}
.vr-note{display:block;margin:16px 0 0;font-size:11px;color:#8a8f98;letter-spacing:.02em}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Dela+Gothic+One&amp;display=swap" rel="stylesheet">

<body>
<a class="siteback" href="../">← データ攻め トップ</a>
<a class="sitelink" href="../torisetsu/#g11">📘 トリセツ</a>
<div class="wrap">

  <div class="hero">
    <h1>更新履歴</h1>
    <p class="lead">どのページの何が変わったか。押すと、そのページが開きます。新しいものが上にあります。</p>
  </div>

  <div class="flt" id="flt" role="group" aria-label="ページの種類で絞る"></div>
  <div class="rows" id="rows" aria-live="polite"><p class="note">読み込み中</p></div>

  <div id="after" hidden>
    <button type="button" class="morebtn" id="moreBtn" hidden>もっと前の更新を見る</button>

    <div class="footer">
      © 2026 データ攻め ── 制作・運営 あべけん
    </div>
  </div>

</div>
<script>
// 更新履歴の描画。日ごとに束ね、ページの種類で絞れる。初期20件、押すごとに30件ずつ足す。自動リロードはしない。
// ページ名→種類・開く先の対応はトップ（docs/index.html）と同じ（直すときは2か所そろえる）。
// 既読：開いた時点の前回の値で「ここから下は前にもあった」の線を引き、そのあと最新の日付を br_updates_seen に書く。
// 触るのは専用キー br_updates_seen だけ。他のキーは読みも書きもしない。
(function(){
  var KINDS = [
    { k: "race", nm: "出走表", c: "--c-race", re: /出走表/, href: "../racers/" },
    { k: "mido", nm: "見どころ・朝刊", c: "--c-mido", re: /見どころ|朝刊|観戦記/, href: "../highlights/" },
    { k: "ken",  nm: "検証", c: "--c-ken", re: /検証/, href: "../kensho/" },
    { k: "sen",  nm: "選手", c: "--c-sen", re: /選手|占い|アナ/, href: "../players/" },
    { k: "mo",   nm: "モーター", c: "--c-mo", re: /モーター/, href: "../motor/" },
    { k: "jo",   nm: "24場・結果", c: "--c-jo", re: /24場|場|結果|万舟/, href: "../stadium/" },
    { k: "etc",  nm: "そのほか", c: "--c-etc", re: /./, href: "" }
  ];
  var HREF = [ [/朝刊|観戦記/, "../choukan/"], [/選手占い|^占い/, "../uranai/"], [/選手カード/, "../players/card.html"], [/アナ/, "../announcers/"],
               [/モーター整備/, "../motor-maintenance/"], [/万舟/, "../payouts/"], [/結果/, "../results/"], [/トリセツ/, "../torisetsu/"], [/用語/, "../glossary/"],
               [/^トップ$/, "../"], [/更新履歴|全ページ/, ""] ];
  function kind(p){ for(var i = 0; i < KINDS.length; i++) if(KINDS[i].re.test(p)) return KINDS[i]; return KINDS[KINDS.length - 1]; }
  function href(p, k){ for(var i = 0; i < HREF.length; i++) if(HREF[i][0].test(p)) return HREF[i][1]; return k.href; }
  var WD = "日月火水木金土";
  // 日付の文字列をそのまま読む（端末の時間帯で1日ずれないように）
  function md(d){ var y = +d.slice(0,4), m = +d.slice(5,7), dd = +d.slice(8,10); return m + "月" + dd + "日（" + WD[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()] + "）"; }
  function mk(tag, cls, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
  function chip(p, k){ var c = mk("span", "chip", p); c.style.setProperty("--c", "var(" + k.c + ")"); return c; }

  var ROWS = document.getElementById("rows"), FLT = document.getElementById("flt");
  var MORE = document.getElementById("moreBtn"), AFTER = document.getElementById("after");
  var data = [], cur = "", limit = 20, seen = "";
  try { seen = localStorage.getItem("br_updates_seen") || ""; } catch(e){}

  function note(msg){ ROWS.innerHTML = ""; ROWS.appendChild(mk("p", "note", msg)); }

  function draw(){
    ROWS.innerHTML = "";
    var rows = data.filter(function(x){ return !cur || kind(String(x.page || "")).k === cur; });
    if(!rows.length){ note("まだ記録はありません。"); MORE.hidden = true; return; }
    var lastDay = "", putSeen = false;
    rows.slice(0, limit).forEach(function(x){
      var ds = String(x.date);
      if(seen && !putSeen && ds <= seen && lastDay){ ROWS.appendChild(mk("p", "seen", "ここから下は、前に見たときにもあった更新")); putSeen = true; lastDay = ""; }
      if(ds <= seen) putSeen = true;
      if(ds !== lastDay){ var h = mk("p", "day"); h.appendChild(mk("b", "", md(ds))); ROWS.appendChild(h); lastDay = ds; }
      var p = String(x.page || ""), k = kind(p), u = href(p, k), fresh = seen && ds > seen;
      var a = mk(u ? "a" : "div", "it" + (fresh ? " fresh" : ""));
      if(u) a.href = u;
      a.style.setProperty("--c", "var(" + k.c + ")");
      a.appendChild(chip(p, k));
      if(fresh) a.appendChild(mk("span", "newmk", "新しい"));
      a.appendChild(mk("p", "t", String(x.text || "")));
      if(u) a.appendChild(mk("span", "go", "このページを開く →"));
      ROWS.appendChild(a);
    });
    MORE.hidden = rows.length <= limit;
  }

  function baseRows(){
    var c = document.querySelector('link[rel="canonical"]');
    var ok = !!(c && c.href && location.href.slice(0, c.href.length) === c.href);
    if(ok){
      document.documentElement.setAttribute("data-vr", "1");
    }else if(!document.querySelector(".vr-note")){
      var n = document.createElement("small");
      n.className = "vr-note";
      n.style.cssText = "display:block;margin:16px 0 0;font-size:11px;color:#8a8f98";
      n.textContent = "データ攻め ／ YouTube あべけん";
      var w = document.querySelector(".wrap");
      if(w) w.appendChild(n);
    }
  }

  MORE.addEventListener("click", function(){ limit += 30; draw(); });

  fetch("../data/updates.json", { cache: "no-store" })
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(d){
      if(!Array.isArray(d)) return Promise.reject();
      data = d.filter(function(x){ return x && /^\d{4}-\d{2}-\d{2}$/.test(String(x.date || "")); });
      baseRows();
      if(!data.length){ note("まだ記録はありません。"); return; }
      // 絞り込みの札は、記録にある種類だけを出す
      var used = {}; data.forEach(function(x){ used[kind(String(x.page || "")).k] = 1; });
      [{ k: "", nm: "すべて" }].concat(KINDS.filter(function(k){ return used[k.k]; })).forEach(function(k){
        var b = mk("button", "", k.nm); b.type = "button"; b.setAttribute("aria-pressed", k.k === "" ? "true" : "false");
        b.onclick = function(){ cur = k.k; Array.prototype.forEach.call(FLT.children, function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); }); limit = 20; draw(); };
        FLT.appendChild(b);
      });
      draw();
      // 線を引いたあとで既読を書く。トップの更新サインはこれで消える
      try { localStorage.setItem("br_updates_seen", String(data[0].date)); } catch(e){}
    })
    .catch(function(){ note("更新履歴を読み込めませんでした。"); })
    .then(function(){ AFTER.hidden = false; });
})();
</script>
