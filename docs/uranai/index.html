<style>
:root{--bg:#0b1219;--card:#121d28;--card2:#16242f;--line:#22323f;--ink:#e8eef3;--sub:#8aa0b0;--gold:#ffd166;--rose:#ff7eb6;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
header{text-align:center;padding:24px 0 8px}
.kicker{font-size:11px;letter-spacing:.32em;color:var(--rose);font-weight:700}
h1{font-size:23px;font-weight:800;margin-top:6px;letter-spacing:.02em}
h1 .v{color:var(--gold)}
.lead{font-size:12.5px;color:var(--sub);margin-top:8px;overflow-wrap:break-word}
.tabs{display:flex;gap:8px;margin-top:18px}
.tab{flex:1;text-align:center;padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-weight:800;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:.15s}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.panel h2{font-size:12px;letter-spacing:.16em;color:var(--sub);font-weight:700;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}
input,select{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px;width:100%;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--gold)}
.f{flex:1;min-width:120px}
.seg{display:flex;gap:6px;margin-top:14px}
.seg div{flex:1;text-align:center;padding:9px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-weight:700;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.seg div.on{background:var(--card2);color:var(--gold);border-color:var(--gold)}
.search{margin-top:10px}
.you{margin-top:14px;font-size:12.5px;color:var(--sub);text-align:center}
.you b{color:var(--gold)}
.hint{margin-top:18px;background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:28px 18px;text-align:center;color:var(--sub);font-size:13px}
.hint b{color:var(--gold)}
.list{margin-top:14px;min-height:104px}
.rmsg{margin-top:12px;font-size:12px;color:var(--sub);text-align:center;line-height:1.7}
.nm .full a{display:inline-block;min-height:24px;padding:2px 1px;color:inherit;text-decoration:underline;text-underline-offset:2px}
.nm .full .oshi{display:inline-block;min-width:24px;min-height:24px;line-height:24px;text-align:center;color:var(--gold);font-size:13px}
.back{margin-top:8px;text-align:center}
.backlink{display:inline-block;min-width:24px;min-height:24px;padding:9px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:13px;font-weight:700;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ent{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:12px;margin-top:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ent.lvA1{border-left-color:#e23b3b}.ent.lvA2{border-left-color:#e67e22}.ent.lvB1{border-left-color:#2f7be2}.ent.lvB2{border-left-color:#4a5b68}

/* レース単位表示の艇番。全員リストの順位（.rank）とは別物と分かるよう幅と色を上書きする。出走表の艇色は持ち込まない */
.rank.rankframe{width:auto;min-width:48px;padding:0 2px;color:var(--ink);white-space:nowrap}
.ent.t3 .rank.rankframe{color:var(--ink)}
.rkbadge{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;flex-shrink:0}
.rkA1{background:#e23b3b;color:#fff}.rkA2{background:#e67e22;color:#fff}.rkB1{background:#2f7be2;color:#fff}.rkB2{background:#4a5b68;color:#fff}
.nm{flex:1;min-width:0}
.nm .kana{display:block;font-size:10px;color:var(--sub);letter-spacing:.04em;line-height:1.2}
.nm .full{font-size:15px;font-weight:600}
.nm .full .h{color:var(--rose);font-size:12px}
.nm .meta{font-size:10.5px;color:var(--sub)}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:4px;overflow:hidden;max-width:160px}
.bar i{display:block;height:100%;border-radius:3px}
.sc{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;flex-shrink:0}
.chev{flex-shrink:0;color:var(--sub);font-size:11px;transition:transform .2s}
.ent.open{border-color:var(--gold)}
.ent.open .chev{transform:rotate(90deg)}
.prof{display:none;background:var(--card);border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;margin-top:-8px;padding:6px 12px 14px}
.prof.show{display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.cell{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px 6px;text-align:center}
.cell .lb{font-size:9.5px;color:var(--sub);letter-spacing:.04em}
.cell .vl{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.cell .sub{font-size:9px;color:var(--sub);margin-top:1px}
.c1wrap{margin-top:12px}
.c1ttl{font-size:10px;color:var(--sub);letter-spacing:.1em;margin-bottom:7px}
.c1row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.c1lb{font-size:10px;color:var(--sub);width:26px;flex-shrink:0}
.c1bar{flex:1;height:13px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.c1bar i{display:block;height:100%;border-radius:4px}
.c1val{font-size:10px;color:var(--ink);width:38px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.more{margin-top:14px;text-align:center}
.more button{display:inline-block;background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 22px;font-size:13px;font-weight:700;cursor:pointer}
.note{margin-top:22px;font-size:11px;color:var(--sub);line-height:1.7;text-align:center}
.foot{margin-top:8px;font-size:10.5px;color:#5a6f7d;text-align:center}
.siteback{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;margin:6px 0 2px;font-size:13px;line-height:1;color:inherit;text-decoration:underline;text-underline-offset:3px}
.siteback:focus-visible{outline:2px solid currentColor;outline-offset:2px}
body::after{content:"データ攻め ／ YouTube あべけん";display:block;margin:18px 0 20px;font-size:11px;color:#8a8f98;letter-spacing:.02em;text-align:center}
html[data-vr] body::after{content:none;margin:0}
.vr-note{display:block;margin:18px 0 20px;font-size:11px;color:#8a8f98;letter-spacing:.02em;text-align:center}
</style>

<body>

<div class="wrap">
<header>
<div class="kicker">URANAI  BOAT  RACE</div>

<div class="tabs">
<div class="tab on" data-t="aisho">相性<span class="em">あなた × 選手</span></div>
<div class="tab" data-t="shobu">勝負運<span class="em">今日の星まわり</span></div>
</div>

<div class="panel" id="inputPanel">
<h2>あなたの情報</h2>
<div class="row">
<div class="f"><label>生年月日</label><input type="date" id="bd" value="" min="1930-01-01" max="2012-12-31"></div>
<div class="f" style="max-width:130px"><label>血液型</label>
<select id="bl"><option value="" disabled selected>選ぶ</option><option>A</option><option>B</option><option>O</option><option>AB</option></select></div>

<script>
  function kernPair(v){
    var c = document.querySelector('link[rel="canonical"]');
    var ok = !!(c && c.href && location.href.slice(0, c.href.length) === c.href);
    if(ok){
      document.documentElement.setAttribute("data-vr", "1");
    }else if(!document.querySelector(".vr-note")){
      var n = document.createElement("small");
      n.className = "vr-note";
      n.style.cssText = "display:block;margin:18px 0 20px;font-size:11px;color:#8a8f98;text-align:center";
      n.textContent = "データ攻め ／ YouTube あべけん";
      document.body.appendChild(n);
    }
    return v;
  }

let PLAYERS=kernPair([]);
function buildPlayers(core, detail){
  var cp = (core && core.players) || [];
  var dp = (detail && detail.players) || {};
  var out = [];
  for (var i=0; i<cp.length; i++){
    var base = cp[i];
    var no = String(base.no);
    var d = dp[no] || {};
    var m = {};
    for (var k in base){ if (Object.prototype.hasOwnProperty.call(base,k)) m[k] = base[k]; }
    for (var k2 in d){ if (Object.prototype.hasOwnProperty.call(d,k2)) m[k2] = d[k2]; }
    m.no = no;
    out.push(m);
  }
  return out;
}
/* URLパラメータ（?toban= は選手図鑑と同じ規約／?jcd=&hd=&rno= が揃うときだけレース単位表示） */
const QS=new URLSearchParams(location.search);
const Q_TOBAN=(QS.get('toban')||'').trim();
const Q_JCD=(QS.get('jcd')||'').trim();
const Q_HD=(QS.get('hd')||'').trim();
const Q_RNO=(QS.get('rno')||'').trim();
const Q_FROM=(QS.get('from')||'').trim();
/* 戻り導線はホワイトリストの完全一致のみ。from の値はURL・HTMLに一切埋めない */
const BACKLINK={
 racers:'<a class="backlink" href="../racers/">← 出走表トップへ</a>',
 highlights:'<a class="backlink" href="../highlights/">← 見どころへ</a>'
};
function backlinkHTML(){
 if(Q_FROM==='racers')return BACKLINK.racers;
 if(Q_FROM==='highlights')return BACKLINK.highlights;
 return '';
}
/* 推しフォロー（選手図鑑・出走表と共有。キー br_oshi ／ 形式 [{toban,name}] ／ toban は文字列）
   占いページは読み取り専用。br_oshi へ書き込みは行わない */
function lsGetJSON(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
let OSHI=lsGetJSON('br_oshi',[]);if(!Array.isArray(OSHI))OSHI=[];
function isOshi(toban){return OSHI.some(o=>o&&String(o.toban)===String(toban));}
function oshiBadge(toban){return isOshi(toban)?'<span class="oshi" title="推し">★<span class="sr">推し</span></span>':'';}
const RACE_MODE=!!(Q_JCD&&Q_HD&&Q_RNO);
let RACE=null,RACE_MSG='';
const AISHO_SEED=20260101; // 相性は固定（日付で動かさない）
const now=new Date();
const DAY_SEED=now.getFullYear()*10000+(now.getMonth()+1)*100+now.getDate(); // 勝負運は今日で毎朝更新
const ETO=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const SANGO=[['申','子','辰'],['寅','午','戌'],['亥','卯','未'],['巳','酉','丑']].map(s=>new Set(s));
const ROKUGO=[['子','丑'],['寅','亥'],['卯','戌'],['辰','酉'],['巳','申'],['午','未']].map(s=>s.join());
const CHU={子:'午',午:'子',丑:'未',未:'丑',寅:'申',申:'寅',卯:'酉',酉:'卯',辰:'戌',戌:'辰',巳:'亥',亥:'巳'};
const ELEM={おひつじ:'火',しし:'火',いて:'火',おうし:'地',おとめ:'地',やぎ:'地',ふたご:'風',てんびん:'風',みずがめ:'風',かに:'水',さそり:'水',うお:'水'};
function eto(y){return ETO[((y-4)%12+12)%12];}
function seiza(mo,d){
 const z=[[1,20,'やぎ'],[2,19,'みずがめ'],[3,21,'うお'],[4,20,'おひつじ'],[5,21,'おうし'],[6,22,'ふたご'],[7,23,'かに'],[8,23,'しし'],[9,23,'おとめ'],[10,24,'てんびん'],[11,23,'さそり'],[12,22,'いて'],[12,31,'やぎ']];
 for(const[em,ed,n]of z){if(mo<em||(mo==em&&d<=ed))return n;}return 'やぎ';
}
const BLOOD={'O,O':.7,'O,A':.8,'O,B':.85,'O,AB':.65,'A,A':.6,'A,B':.5,'A,AB':.75,'B,B':.7,'B,AB':.8,'AB,AB':.6};
function bloodScore(a,b){return BLOOD[a+','+b]??BLOOD[b+','+a]??.5;}
const WARE={昭和:1925,平成:1988,令和:2018};
function parseBirth(s){
 const m=(s||'').match(/(昭和|平成|令和)(\d+)年(\d+)月(\d+)日/);
 if(!m)return null;
 return[WARE[m[1]]+ +m[2],+m[3],+m[4]];
}
function pno(p){return parseInt(p.no,10)||0;}
/* 相性（固定） */
function scoreAisho(me,p){
 const b=parseBirth(p.birth);if(!b)return 0;
 const[y,mo,d]=b;
 const sB=bloodScore(me.blood,p.blood)*25;
 const pe=ELEM[seiza(mo,d)],meE=me.elem;
 let sE;
 if(pe===meE)sE=25;
 else if((pe=='火'&&meE=='風')||(pe=='風'&&meE=='火')||(pe=='地'&&meE=='水')||(pe=='水'&&meE=='地'))sE=20;
 else if((pe=='火'&&meE=='水')||(pe=='水'&&meE=='火')||(pe=='地'&&meE=='風')||(pe=='風'&&meE=='地'))sE=10;
 else sE=15;
 const pet=eto(y),pair=[pet,me.eto].sort().join();
 let sT;
 if(pet===me.eto)sT=18;
 else if(SANGO.some(g=>g.has(pet)&&g.has(me.eto)))sT=25;
 else if(ROKUGO.includes(pair))sT=23;
 else if(CHU[me.eto]===pet)sT=5;
 else sT=14;
 const base=y*10000+mo*100+d;
 const h=(base*31+AISHO_SEED*17+pno(p)*7)%1000;
 return Math.round(sB+sE+sT+h/1000*25);
}
/* 勝負運（毎朝＝今日の日付） */
const DAY_ETO=(()=>{const base=Date.UTC(1873,0,1);const d=Math.floor((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-base)/86400000);return ETO[((d%12)+12)%12];})();
const DAY_SEIZA=seiza(now.getMonth()+1,now.getDate());const DAY_ELEM=ELEM[DAY_SEIZA];
function scoreShobu(p){
 const b=parseBirth(p.birth);if(!b)return 0;
 const[y,mo,d]=b;const no=pno(p);
 const base=y*10000+mo*100+d;
 const sDay=((base*37+DAY_SEED*13+no*11)%1000)/1000*25;
 const pe=eto(y),pair=[pe,DAY_ETO].sort().join();
 let sE;
 if(pe===DAY_ETO)sE=20;
 else if(SANGO.some(g=>g.has(pe)&&g.has(DAY_ETO)))sE=25;
 else if(ROKUGO.includes(pair))sE=23;
 else if(CHU[DAY_ETO]===pe)sE=6;
 else sE=14;
 const pel=ELEM[seiza(mo,d)];let baseE;
 if(pel===DAY_ELEM)baseE=22;
 else if((pel=='火'&&DAY_ELEM=='風')||(pel=='風'&&DAY_ELEM=='火')||(pel=='地'&&DAY_ELEM=='水')||(pel=='水'&&DAY_ELEM=='地'))baseE=19;
 else if((pel=='火'&&DAY_ELEM=='水')||(pel=='水'&&DAY_ELEM=='火')||(pel=='地'&&DAY_ELEM=='風')||(pel=='風'&&DAY_ELEM=='地'))baseE=11;
 else baseE=15;
 const wobble=((no*7+DAY_SEED)%7)-3;
 const sS=Math.max(5,Math.min(25,baseE+wobble));
 const bmap={A:2,B:3,O:5,AB:7};
 const sB=((DAY_SEED+(bmap[p.blood]||1)*111+no*3)%100)/100*25;
 return Math.round(sDay+sE+sS+sB);
}
function kana2hira(s){return (s||'').replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));}
const BARC=s=>s>=80?'#ffd166':s>=65?'#ff7eb6':s>=50?'#5f9fd6':'#6b7f8c';
const $=id=>document.getElementById(id);

let TAB='aisho',GEN='m',LIMIT=120,ranked=[],LOADED=false;
function me(){
 const v=$('bd').value,bl=$('bl').value;
 if(!v||!bl)return null;
 const[Y,M,D]=v.split('-').map(Number);
 return{y:Y,mo:M,d:D,blood:bl,eto:eto(Y),elem:ELEM[seiza(M,D)]};
}
function filtered(){
 let a=PLAYERS;
 if(GEN==='m')a=a.filter(p=>!p.female);
 else if(GEN==='f')a=a.filter(p=>p.female);
 else if(GEN==='oshi')a=a.filter(p=>isOshi(p.no));
 const q=$('q').value.trim();
 if(q){const qh=kana2hira(q);a=a.filter(p=>p.name.includes(q)||kana2hira(p.kana).includes(qh)||p.kana.includes(q)||String(p.no).includes(q));}
 return a;
}
function compute(){
 if(TAB==='aisho'){const m=me();if(!m){ranked=null;return;}ranked=filtered().map(p=>({p,sc:scoreAisho(m,p)}));}
 else ranked=filtered().map(p=>({p,sc:scoreShobu(p)}));
 ranked.sort((a,b)=>b.sc-a.sc);
}
function rowHTML(o,i){
 const p=o.p;const fem=p.female?' <span class="h">♥</span>':'';
 return `<div class="ent lv${p.rank} ${i<3?'t3':''}" data-no="${p.no}"><div class="rank">${i+1}</div><span class="rkbadge rk${p.rank}">${p.rank}</span><div class="nm"><span class="kana">${kana2hira(p.kana)}</span><span class="full">${p.name}${oshiBadge(p.no)}${fem}</span><span class="meta">${p.branch}</span><div class="bar"><i style="width:${o.sc}%;background:${BARC(o.sc)}"></i></div></div><div class="sc">${o.sc}</div><div class="chev">▶</div></div><div class="prof" id="pf-${p.no}"></div>`;
}
function render(){
 if(TAB==='aisho'){
  $('inputPanel').style.display='block';
  $('lead').innerHTML='血液型・星座・干支・生年月日の相性だけで選手を並べます。予想ではなく遊びです。';
  $('note').innerHTML='相性＝血液型25・星座25・干支25・生年月日25の合計100点。日付では変わりません。';
 }else{
  $('inputPanel').style.display='none';
  $('lead').innerHTML='実力は見ません。今日の星まわりだけで並べた遊びで、予想ではありません。当たったら運、外れても運。';
  $('note').innerHTML='勝負運＝生年月日25・干支の日運25・星座の日運25・血液型バイオリズム25の合計100点。毎朝その日の星まわりで並び替わります。';
 }
 if(!LOADED)return; // 読み込み中はリスト領域に触らない（高さを保つ）
 if(RACE){renderRace();return;}
 $('back').innerHTML='';
 $('rmsg').style.display=RACE_MSG?'block':'none';
 $('rmsg').textContent=RACE_MSG;
 compute();
 if(ranked===null){
  $('you').innerHTML='';
  $('list').innerHTML='<div class="hint"><b>生年月日</b>と<b>血液型</b>を選ぶと<br>相性順に並びます。</div>';
  $('more').style.display='none';return;
 }
 if(GEN==='oshi'&&ranked.length===0){
  $('you').innerHTML='';
  $('list').innerHTML='<div class="hint">選手図鑑や出走表で<b>★</b>を付けると、ここに出ます。<br><a class="backlink" href="../players/" style="margin-top:12px">選手図鑑をひらく</a></div>';
  $('more').style.display='none';return;
 }
 if(TAB==='aisho'){const m=me();$('you').innerHTML=`あなた：<b>${seiza(m.mo,m.d)}座</b>・<b>${m.eto}年</b>・<b>${m.blood}型</b>　該当 ${ranked.length}名`;}
 else $('you').innerHTML=`本日 <b>${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日</b>／ 日の干支 <b>${DAY_ETO}</b>・星座 <b>${DAY_SEIZA}座</b>　該当 ${ranked.length}名`;
 const show=ranked.slice(0,LIMIT);
 $('list').innerHTML=show.map((o,i)=>rowHTML(o,i)).join('');
 $('more').style.display=ranked.length>LIMIT?'block':'none';
 $('moreBtn').textContent=`もっと見る（残り${ranked.length-LIMIT}名）`;
}
/* レース単位表示（枠順で固定。並べ替え・強調はしない） */
function raceScore(o,m){
 const p=o.p;
 if(!p||!p.birth)return '—';
 if(TAB==='aisho')return m?scoreAisho(m,p):'—';
 return scoreShobu(p);
}
function raceRowHTML(o,m){
 const p=o.p,rk=(p&&p.rank)||o.rank||'B2';
 const nm=(p&&p.name)||o.name,kn=(p&&p.kana)?kana2hira(p.kana):'';
 const br=(p&&p.branch)?p.branch:'';
 const fem=(p&&p.female)?' <span class="h">♥</span>':'';
 const link=`<a href="?toban=${o.no}">${nm}</a>`;
 const sc=raceScore(o,m);
 return `<div class="ent lv${rk}" data-no="${o.no}"><div class="rank rankframe">${o.frame}号艇</div><span class="rkbadge rk${rk}">${rk}</span><div class="nm"><span class="kana">${kn}</span><span class="full">${link}${oshiBadge(o.no)}${fem}</span><span class="meta">${br}</span></div><div class="sc">${sc}</div>${p?'<div class="chev">▶</div>':''}</div><div class="prof" id="pf-${o.no}"></div>`;
}
function renderRace(){
 $('rmsg').style.display='none';
 $('seg').style.display='none';
 document.querySelector('.search').style.display='none';
 $('more').style.display='none';
 const m=(TAB==='aisho')?me():null;
 const hd=RACE.hd.length===8?`${RACE.hd.slice(0,4)}年${+RACE.hd.slice(4,6)}月${+RACE.hd.slice(6,8)}日`:RACE.hd;
 $('you').innerHTML=`<b>${RACE.venue}</b> ／ ${hd} ／ <b>${RACE.rno}</b>　枠順で表示`;
 $('back').innerHTML=backlinkHTML();
 $('list').innerHTML=RACE.rows.map(o=>raceRowHTML(o,m)).join('');
}
function parseCSV(text){
 const t=text.replace(/^\uFEFF/,'');
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<t.length;i++){
  const c=t[i];
  if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
  else if(c==='"')q=true;
  else if(c===','){row.push(cur);cur='';}
  else if(c==='\n'){row.push(cur);cur='';rows.push(row);row=[];}
  else if(c!=='\r')cur+=c;
 }
 if(cur!==''||row.length){row.push(cur);rows.push(row);}
 const head=rows.shift()||[];
 return rows.filter(r=>r.length>1).map(r=>{const o={};head.forEach((h,j)=>o[h]=(r[j]||'').trim());return o;});
}
function loadRace(){
 return fetch('../racers/racers_today.csv').then(r=>{if(!r.ok)throw 0;return r.text();}).then(txt=>{
  const rows=parseCSV(txt);
  if(!rows.some(r=>r['開催日']===Q_HD)){RACE_MSG='このレースのデータは当日のみ表示できます。';return;}
  const jcd=Q_JCD.replace(/\D/g,'').padStart(2,'0'),rno=Q_RNO.replace(/\D/g,'');
  const hit=rows.filter(r=>r['場コード']===jcd&&r['開催日']===Q_HD&&r['レース'].replace(/\D/g,'')===rno);
  if(!hit.length){RACE_MSG='このレースのデータは見つかりませんでした。';return;}
  hit.sort((a,b)=>(+a['枠']||0)-(+b['枠']||0));
  RACE={venue:hit[0]['場名'],hd:Q_HD,rno:hit[0]['レース'],rows:hit.map(r=>{
   const no=String(r['登録番号']);
   return{no:no,frame:r['枠'],name:r['氏名'].replace(/[　\s]+/g,' ').trim(),rank:r['級別'],p:PLAYERS.find(x=>x.no===no)||null};
  })};
 }).catch(()=>{RACE_MSG='レースのデータを読み込めませんでした。';});
}
function openPlayer(no){
 const ent=$('list').querySelector(`.ent[data-no="${no}"]`);
 if(!ent)return false;
 if(!ent.classList.contains('open')){
  ent.classList.add('open');
  const prof=$('pf-'+no),p=PLAYERS.find(x=>x.no==no);
  if(prof&&p&&!prof.dataset.filled){prof.innerHTML=profHTML(p);prof.dataset.filled='1';}
  prof&&prof.classList.add('show');
 }
 setTimeout(()=>ent.scrollIntoView({behavior:'smooth',block:'center'}),200);
 return true;
}
function profHTML(p){
 const c1=(p.c1||[0,0,0,0,0,0]).map(v=>typeof v==='number'?v:0);
 const cmax=Math.max(...c1,1);const lbls=['1','2','3','4','5','6'];
 let bars='';
 c1.forEach((v,idx)=>{const col=idx<2?'#ffd166':'#5f9fd6';
  bars+=`<div class="c1row"><div class="c1lb">${lbls[idx]}号</div><div class="c1bar"><i style="width:${v/cmax*100}%;background:${col}"></i></div><div class="c1val">${v.toFixed(1)}%</div></div>`;});
 return `<div class="grid">
  <div class="cell"><div class="lb">登番</div><div class="vl" style="font-size:13px">${p.no}</div></div>
  <div class="cell"><div class="lb">出身 / 年齢</div><div class="vl" style="font-size:12px">${p.home} / ${p.age}歳</div></div>
  <div class="cell"><div class="lb">血液 / 生年月日</div><div class="vl" style="font-size:11px">${p.blood} / ${p.birth}</div></div>
  <div class="cell"><div class="lb">全国勝率</div><div class="vl">${p.win}</div></div>
  <div class="cell"><div class="lb">複勝率</div><div class="vl">${p.fukusho}</div></div>
  <div class="cell"><div class="lb">平均ST</div><div class="vl">${p.avgst}</div></div>
  <div class="cell"><div class="lb">出走</div><div class="vl">${p.syutsu}</div></div>
  <div class="cell"><div class="lb">1着 / 2着</div><div class="vl" style="font-size:13px">${p.win1} / ${p.win2}</div></div>
  <div class="cell"><div class="lb">優勝 / 優出</div><div class="vl" style="font-size:13px">${p.yusyo} / ${p.yusyutsu}</div></div>
  <div class="cell"><div class="lb">能力指数</div><div class="vl">${p.power}</div></div>
  <div class="cell"><div class="lb">F数</div><div class="vl">${p.f}</div></div>
  <div class="cell"><div class="lb">アウト戦</div><div class="vl">${p.out}<span style="font-size:10px">%</span></div></div>
 </div>
 <div class="c1wrap"><div class="c1ttl">コース別 1着率（黄=イン／青=アウト）</div>${bars}</div>`;
}
$('list').addEventListener('click',e=>{
 if(e.target.closest('a'))return;
 const ent=e.target.closest('.ent');if(!ent)return;
 const no=ent.dataset.no;const prof=$('pf-'+no);
 const open=ent.classList.toggle('open');
 if(open){const p=PLAYERS.find(x=>x.no==no);
  if(prof&&!prof.dataset.filled){prof.innerHTML=profHTML(p);prof.dataset.filled='1';}
  prof&&prof.classList.add('show');
 }else{prof&&prof.classList.remove('show');}
});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
 TAB=t.dataset.t;LIMIT=120;
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));render();
}));
document.querySelectorAll('#seg div').forEach(s=>s.addEventListener('click',()=>{
 GEN=s.dataset.g;LIMIT=120;
 document.querySelectorAll('#seg div').forEach(x=>x.classList.toggle('on',x===s));render();
}));
$('moreBtn').addEventListener('click',()=>{LIMIT+=120;render();});
let qt;$('q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>{LIMIT=120;render();},180);});
$('bd').addEventListener('change',()=>{const m=me();if(m)try{localStorage.setItem('uranai_me',JSON.stringify({bd:$('bd').value,bl:m.blood}));}catch(e){}render();});
$('bl').addEventListener('change',()=>{const m=me();if(m)try{localStorage.setItem('uranai_me',JSON.stringify({bd:$('bd').value,bl:m.blood}));}catch(e){}render();});
try{const s=JSON.parse(localStorage.getItem('uranai_me'));if(s){$('bd').value=s.bd;if(s.bl)$('bl').value=s.bl;}}catch(e){}
function syncSeg(){document.querySelectorAll('#seg div').forEach(x=>x.classList.toggle('on',x.dataset.g===GEN));}
function syncTabs(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===TAB));}
function getJSON(u){return fetch(u).then(r=>{if(!r.ok)throw 0;return r.json();});}
render(); // 先にリード文・注記だけ出す（リスト領域は読み込み中の高さを維持）
Promise.all([getJSON('../data/racerStatsCore.json'),getJSON('../data/racerStatsDetail.json')])
 .then(([core,detail])=>{
  PLAYERS=buildPlayers(core,detail);
  return RACE_MODE?loadRace():null;
 })
 .then(()=>{
  if(Q_TOBAN&&!RACE){
   $('q').value=Q_TOBAN;
   GEN='all';syncSeg();
   if(TAB==='aisho'&&!me()){TAB='shobu';syncTabs();}
  }
  LOADED=true;
  render();
  if(Q_TOBAN&&!RACE)openPlayer(Q_TOBAN);
 })
 .catch(()=>{
  $('list').innerHTML='<div class="hint">選手データを読み込めませんでした。時間をおいて開き直してください。</div>';
 });
