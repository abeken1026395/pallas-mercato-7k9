<script>
(function () {
  var fig = document.getElementById('tiltFig'), g = document.getElementById('tiltSvg'), btn = document.getElementById('tiltRe');
  if (!fig || !g || !btn || !('IntersectionObserver' in window) || !window.requestAnimationFrame) return;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var pick = function (sel) {
    return Array.prototype.filter.call(g.querySelectorAll(sel), function (r) { return r.getAttribute('y') < 260; })
      .map(function (r) { return { r: r, w: r.getAttribute('width'), lb: r.nextElementSibling }; });
  };
  var F = pick('rect[fill="#e0a070"]'), O = pick('rect[fill="none"]');
  if (F.length !== 4 || O.length !== 4) return;
  var GROW = 400, GAP = 250, WAIT = 700, SHRINK = 900;
  var S2 = (F.length - 1) * (GROW + GAP) + GROW + WAIT, TOTAL = S2 + SHRINK;
  var ease = function (k) { return 1 - Math.pow(1 - k, 3); };
  var clamp = function (v) { return Math.max(0, Math.min(1, v)); };
  function paint(ms) {
    var k2 = clamp((ms - S2) / SHRINK);
    F.forEach(function (f, i) {
      var k = clamp((ms - i * (GROW + GAP)) / GROW), o = O[i];
      f.r.setAttribute('width', k >= 1 ? f.w : +f.w * ease(k));
      f.lb.style.opacity = k >= 1 ? 1 : 0;
      o.r.setAttribute('width', k2 >= 1 ? o.w : ms < S2 ? 0 : +f.w + (o.w - f.w) * ease(k2));
      o.lb.style.opacity = k2 >= 1 ? 1 : 0;
    });
  }
  var busy = false;
  function run() {
    if (busy) return; busy = true;
    var t0 = 0;
    requestAnimationFrame(function step(t) {
      if (!t0) t0 = t;
      if (t - t0 < TOTAL) { paint(t - t0); requestAnimationFrame(step); } else { paint(TOTAL); busy = false; }
    });
  }
  paint(0);
  btn.hidden = false;
  btn.onclick = function () { if (!busy) { paint(0); run(); } };
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { run(); io.disconnect(); } });
  }, { threshold: 0.6 });
  io.observe(fig);
})();
</script>
