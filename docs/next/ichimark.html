function how(){

  $("how").innerHTML="展示の前に分かっている材料（出走表・過去のレースの結果・前日までの直前情報）だけで作った見立てから、1マークの形を描いています。スタート展示と展示タイムは使っていません。見立ては毎朝、出走表が出たあとに作ります。<br>"
   +"<b>1マーク</b>：スタートの後ろ斜め上から見下ろした絵です。1コースの艇がマークの頂点の手前にいる瞬間、つまり勝負が決まる直前の位置関係を描いています。色の付いた艇が逃げと攻め筋（いちばん高い見立てと、その次）、灰色はそのほかの艇です。細い線は、その攻めが決まったときに抜けていく先です。決まり手の型は、まくり＝1コースの外に並びかける／差し＝1コースの後ろ・内から懐へ／まくり差し＝1コースの後ろ・外から航跡を越えて内へ、です。艇の前後には出走表の平均STの差を使っています。旋回の大きさや艇どうしの間隔は公式の数値がないため推定で、実際の距離を表した図ではありません。<br>"
   +"<b>見立て</b>：過去のレースの集計から、1着の「コース×決まり手」の確率を出しています。材料は、級別・全国と当地の勝率系・F本数・平均ST・モーターとボートの2連率（出走表）、今節の成績（同じ場の直前6日）、過去1年にその枠から出たときの成績、前づけの癖、ふだんのスタート展示ST、今節の展示タイムの傾向（前日まで）、レースの格です。<br><b>目安の言葉</b>：場の平均との差が8ポイント以上で「逃げ寄り」「逃げにくめ」、15ポイント以上で「かなり」を付けています。<br><b>要素ごとの内訳</b>：場の平均から見立てまでの差（ポイント）を、要素ごとに分けたものです。要素の多いレースは近い値で出しています。F持ちの点数は小さいことが多く、その場合は「そのほか」に入ります。<br>"
