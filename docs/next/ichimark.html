<details><summary>この図の読み方と、当たり方</summary><div class="dbody" id="how"></div></details>
<p class="stamp">過去のレースの集計にもとづく見立てです（実験）。スローとダッシュの境と起こし位置は未確認のため、図には描いていません。潮の流れも見立てに使っていません。舟券の購入は20歳になってから。</p>
</div>
<script>
(function(){
var LC=["","#f2f2f0","#1b1b1b","#e2382f","#2a6fd6","#f2c200","#1f9a55"],LT=["","#111","#fff","#fff","#fff","#111","#fff"];
var D=null,J=null,R=null;
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pct(x){return Math.round(x*100)}
function isF(b){return b.tenjiF===1||(b.st!=null&&b.st<0)}
function stTxt(b){return b.st==null?"—":(isF(b)?"F":b.st.toFixed(2).slice(1))}
var q=new URLSearchParams(location.search),day=q.get("d")||"20261030";
fetch("ichimark/v10_"+day+".json").then(function(r){return r.ok?r.json():Promise.reject()}).then(function(d){D=d;init()}).catch(function(){$("main").innerHTML='<div class="err">この日のデータがありません。</div>'});

/* 組み合わせ（例 "3まくり差し"）→ コースと決まり手。「その他」と「6〜」は形を描けないのでまとめる */
function split(k){var m=/^(\d)(.*)$/.exec(k);return m?{c:+m[1],t:m[2]}:{c:0,t:k}}
function drawable(k){var s=split(k);return s.c>=2&&/^(まくり|まくり差し|差し)$/.test(s.t)}
function init(){
  $("d").textContent=(+day.slice(4,6))+"月"+(+day.slice(6,8))+"日";
  var vs=[];D.races.forEach(function(r){if(vs.indexOf(r.jcd)<0)vs.push(r.jcd)});vs.sort();
  J=q.get("j")&&vs.indexOf(q.get("j"))>=0?q.get("j"):vs[0];
  $("pick").innerHTML=vs.map(function(j){var r=D.races.filter(function(x){return x.jcd===j})[0];return '<button type="button" data-j="'+j+'">'+esc(r.venue)+"</button>"}).join("");
  $("pick").onclick=function(e){var b=e.target.closest("button");if(!b)return;J=b.dataset.j;R=null;draw()};
  $("rs").onclick=function(e){var b=e.target.closest("button");if(!b||b.disabled)return;R=+b.dataset.r;draw()};
  how();draw();
}
function how(){
  var e=D.eval||{},cal=(D.calib||[]).filter(function(c){return c.n>=100}),ed=D.edge;
  $("how").innerHTML="スタート展示の隊形と、過去のレースの集計にもとづく見立てから、1マークの形を描いています。<br><b>スリット</b>：スタート展示のSTで6艇を並べたもの。縦の線がスタートラインで、右にあるほど早い。展示でF（フライング）だった艇は、線の右の帯に「F」と出します。展示のFは本番の早さの目安にならないため、凹みの判定と平均比には使いません。隣の艇より0.05以上遅い艇1つに「凹み」の印を付けます。<br>"
   +"<b>1マーク</b>：上が1マーク、下がスタートライン。艇は下から上へ進み、1マークを左に回ります。艇の並びはスタート展示の進入、前後はスタート展示STの差です。白の線は1コースの逃げ、金の線は「逃げ以外」でいちばん高い見立ての航跡です。絞れないときは、候補の上位3つを灰色の破線で重ねます。航跡は決まり手の型（まくり＝1コースの前を絞って外を回る／まくり差し＝外を回ってから内へ切り返す／差し＝1コースが回ったあとに内へ入る）で描いた模式で、実際の位置や距離は表していません。<br>"
   +"<b>見立て</b>：過去のレースの集計から、1着の「コース×決まり手」の確率を出しています。展示のFは、その選手の本番の平均STに置き換えて使っています。1〜4コースのF持ち（直近180日のF本数）と、進入が枠なりかどうかも材料に入れています。<br>"
   +(e.top1!=null?"<b>当たり方</b>（集計に使っていない "+esc(e.span||"2026年8月以降")+"・"+(e.nEval||0).toLocaleString()+"レース）：いちばん高い見立てが当たった割合は "+(e.top1*100).toFixed(1)+"%で、毎回「1コース逃げ」と答えた場合（"+(e.baseTop1*100).toFixed(1)+"%）とほとんど変わりません。この見立ての強みは、確率の大きさが実際の割合とよく合うことです（下の表）。":"")
   +(e.compare?"<br>逃げたかどうかに対する誤差（ブライアスコア。小さいほど実際に近い）は、場の逃げの平均だけだと <b>"+e.compare.a_venueRate.brier.toFixed(3)+"</b>、場と1コースの級別の実績だと <b>"+e.compare.b_venue_x_c1cls.brier.toFixed(3)+"</b>、この見立てで <b>"+e.compare.c_model.brier.toFixed(3)+"</b>。":"")
   +(ed?"<br>逃げの見立てが50%未満だった "+ed.n.toLocaleString()+"レースでは、実際の逃げは "+(ed.nigeRate*100).toFixed(1)+"%。逃げ以外でいちばん高い見立てのコースの艇が1着になったのは "+(ed.hitTop*100).toFixed(1)+"%（毎回2コースの艇と答えた場合は "+(ed.hitBase2*100).toFixed(1)+"%）。":"")
   +(cal.length?'<table><tr><th>逃げの見立て</th><th>レース数</th><th>実際に逃げた</th></tr>'+cal.map(function(c){return '<tr><td>'+esc(c.bin)+'%</td><td class="n">'+c.n.toLocaleString()+'</td><td class="n">'+(c.nige*100).toFixed(1)+"%</td></tr>"}).join("")+"</table>":"");
}
function draw(){
  [].forEach.call($("pick").children,function(b){b.setAttribute("aria-pressed",b.dataset.j===J)});
  var rr=D.races.filter(function(x){return x.jcd===J}),have={};rr.forEach(function(x){have[x.rno]=x});
  if(R==null||!have[R])R=rr[0].rno;
  var h="";for(var i=1;i<=12;i++)h+='<button type="button" data-r="'+i+'" aria-pressed="'+(i===R)+'"'+(have[i]?"":" disabled")+">"+i+(have[i]?"":"<small>未</small>")+"</button>";
  $("rs").innerHTML=h;
  race(have[R]);
}
function boatAt(bs,c){return bs.filter(function(b){return b.course===c})[0]}
/* 凹み：2〜5コース（壁として効く艇）だけを見る。展示Fでない隣（片側でもよい）より0.05以上遅い、いちばん差の大きい1艇 */
function dent(bs){var best=null,bd=0;bs.forEach(function(b){if(b.course<2||b.course>5||b.st==null||isF(b))return;var ns=[boatAt(bs,b.course-1),boatAt(bs,b.course+1)].filter(function(x){return x&&x.st!=null&&!isF(x)});if(!ns.length)return;var d=Math.min.apply(null,ns.map(function(x){return b.st-x.st}));if(d>=.05&&d>bd){bd=d;best=b}});return best}
var THIN=.12;   // 攻め筋の見立てがこれ未満なら「絞れない」として線を引かない
function telop(bs,a1,a2,pj){
  if(!a1||pj[a1]<THIN)return '<div class="tel off"><span class="l">逃げ以外の攻め筋</span><span class="r">絞れない</span></div>';
  function one(k,op){var o=split(k),b=boatAt(bs,o.c);return '<div class="tel" style="opacity:'+op+'"><span class="l">'+o.c+'コース'+(b&&b.waku!==o.c?'（'+b.waku+'号艇）':'')+' '+esc(o.t)+'</span><span class="r">'+pct(pj[k])+'<small>%</small></span></div>'}
  return one(a1,1)+(a2&&pj[a2]>=THIN?one(a2,.6):'');
}

  var b1=boatAt(bs,1),e0=[lx(1),b1?ly(b1)-20:SY-2];

    ?'M'+pt(e0[0],e0[1])+' C '+pt(e0[0],e0[1]-70)+', '+pt(BX+30,BY+40)+', '+pt(BX+22,BY-2)+' C '+pt(BX+16,BY-36)+', '+pt(BX-30,BY-44)+', '+pt(BX-66,BY-30)
    :'M'+pt(e0[0],e0[1])+' C '+pt(e0[0],e0[1]-70)+', '+pt(BX+30,BY+40)+', '+pt(BX+22,BY-2)+' C '+pt(BX+16,BY-32)+', '+pt(BX-18,BY-34)+', '+pt(BX-44,BY-12);
  s+='<path class="ln" d="'+dEsc+'" fill="none" stroke="#f2f2f0" stroke-opacity=".9" stroke-width="'+(1.5+pn*3.5).toFixed(1)+'" stroke-linecap="round" marker-end="url(#aw)"/>';
  function attPath(k){var o=split(k),b=boatAt(bs,o.c);if(!b)return "";var x0=lx(o.c),y0=ly(b)-20;
    if(o.t==="まくり") return 'M'+pt(x0,y0)+' L'+pt(BX+48,BY+26)+' C '+pt(BX+44,BY-8)+', '+pt(BX+20,BY-62)+', '+pt(BX-48,BY-52);   // 1の前を絞って外を大きく
    if(o.t==="まくり差し") return 'M'+pt(x0,y0)+' L'+pt(x0+4,BY+48)+' C '+pt(x0+2,BY+16)+', '+pt(BX+46,BY+2)+', '+pt(BX+30,BY-16)+' C '+pt(BX+16,BY-34)+', '+pt(BX-14,BY-34)+', '+pt(BX-34,BY+4);   // 外を回ってから内へ（くの字）
    return 'M'+pt(x0,y0)+' C '+pt(x0-6,y0-80)+', '+pt(BX+52,BY+56)+', '+pt(BX+34,BY+18)+' C '+pt(BX+26,BY-12)+', '+pt(BX-4,BY-30)+', '+pt(BX-30,BY+6);   // 差し：1が回ったあとに内へ
  }
  var lab=function(k,c,dy){var o=split(k),b=boatAt(bs,o.c);var q=P(lx(o.c),(b?ly(b):SY)-40);return '<text x="'+(q[0]+8)+'" y="'+(q[1]-dy)+'" font-size="12" font-weight="700" font-family="Barlow Condensed,sans-serif" fill="'+c+'">'+pct(pj[k])+'%</text>'};
  if(on){
    if(a2&&pj[a2]>=THIN) s+='<path class="ln" d="'+attPath(a2)+'" fill="none" stroke="#7f8fa3" stroke-width="1.5" stroke-dasharray="5 5" stroke-linecap="round" marker-end="url(#ag)"/>';
    s+='<path class="ln" d="'+attPath(a1)+'" fill="none" stroke="#c9a96e" stroke-width="'+(2+Math.min(.3,pj[a1])*10).toFixed(1)+'" stroke-linecap="round" marker-end="url(#ah)"/>';
  }else{
    (att||[]).slice(0,3).forEach(function(k,i){var o=split(k),b=boatAt(bs,o.c),w=b?b.waku:o.c;s+='<path class="ln" d="'+attPath(k)+'" fill="none" stroke="#7f8fa3" stroke-opacity=".8" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round" marker-end="url(#ag)"/>'
      +'<g transform="translate('+(W-116)+' '+(TOP+50+i*24)+')"><rect width="18" height="18" fill="'+LC[w]+'"'+(w===2?' stroke="#8a96a3"':'')+'/><text x="9" y="13.5" text-anchor="middle" font-size="13" font-weight="700" font-family="Barlow Condensed,sans-serif" fill="'+LT[w]+'">'+w+'</text><text x="24" y="14" font-size="12" fill="#cdd7e0">'+esc(o.t)+'</text><text x="108" y="14.5" text-anchor="end" font-size="15" font-weight="700" font-family="Barlow Condensed,sans-serif" fill="#f2f2f0">'+pct(pj[k])+'%</text></g>'});
  }
  // 1マーク（公式の橙）
  s+='<g><rect x="'+(bq[0]-7*k)+'" y="'+(bq[1]-12*k)+'" width="'+(14*k)+'" height="'+(19*k)+'" fill="#ff7a2e"/><rect x="'+(bq[0]-7*k)+'" y="'+(bq[1]-4*k)+'" width="'+(14*k)+'" height="'+(4*k)+'" fill="#f2f2f0"/><path d="M'+(bq[0]-7*k)+' '+(bq[1]-12*k)+' L'+bq[0]+' '+(bq[1]-19*k)+' L'+(bq[0]+7*k)+' '+(bq[1]-12*k)+' Z" fill="#ff9a55"/></g>';
  // 艇（上から見た細長い船体）と、後ろへ開く引き波
  bs.forEach(function(b){var q=P(lx(b.course),ly(b)),kk=sc(ly(b))*1.45,w=b.waku,f=isF(b);
    var hull='M0 -20 C4 -15 6 -8 6 0 L6 16 L-6 16 L-6 0 C-6 -8 -4 -15 0 -20 Z';
    s+='<g transform="translate('+q[0].toFixed(1)+' '+q[1].toFixed(1)+') scale('+kk.toFixed(3)+')">'
      +'<path d="M-4 16 L-15 46 M4 16 L15 46" stroke="url(#wk)" stroke-width="1.6" fill="none"/>'
      +(f?'<path d="'+hull+'" fill="#0b2a3d" stroke="'+(w===2?'#8a96a3':LC[w])+'" stroke-width="2" stroke-dasharray="3 2"/><text x="0" y="9" text-anchor="middle" font-size="13" font-weight="700" font-family="Barlow Condensed,sans-serif" fill="'+(w===2?'#cdd7e0':LC[w])+'">'+w+'</text>'
         :'<path d="'+hull+'" fill="'+LC[w]+'"'+(w===2?' stroke="#8a96a3" stroke-width="1"':"")+'/><text x="0" y="9" text-anchor="middle" font-size="13" font-weight="700" font-family="Barlow Condensed,sans-serif" fill="'+LT[w]+'">'+w+'</text>')
      +(b.waku>b.course?'<path d="M0 -25 C5 -19 9 -10 9 0 L9 19 L-9 19 L-9 0 C-9 -10 -5 -19 0 -25 Z" fill="none" stroke="#dcbd78" stroke-width="1.6"/>':'')
      +'</g>';});
  return s+'</svg>';
}
})();
