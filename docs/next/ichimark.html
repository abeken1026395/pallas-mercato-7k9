:root{--fg:#f2f2f0;--dim:#cdd7e0;--faint:#aebccb;--mute:#8a96a3;--line:rgba(232,236,239,.18);--gold:#dcbd78;--goldBg:#c8a45e;--rule:rgba(212,176,106,.6);

<body>
<div class="wrap">
<nav class="crumb"><a href="../">データ攻め</a></nav>
<header>
  <p class="no" id="d">1マーク</p>
  <h1 class="kataTitle">1マークの見立て</h1>
  <p class="sub">スタート展示の隊形と、過去のレースで学習したモデルの見立てから、1マークの形を描きました。</p>
</header>
<div class="tabsW"><div class="tabs" id="pick"></div></div>
<div class="rs" id="rs"></div>
<div id="main"><div class="err">読み込んでいます…</div></div>
<details><summary>この図の読み方と、当たり方</summary><div class="dbody" id="how"></div></details>
<p class="stamp">AIの見立て（実験）です。舟券の購入は20歳になってから。</p>
</div>
<script>
(function(){
var LC=["","#f2f2f0","#1b1b1b","#e2382f","#2a6fd6","#f2c200","#1f9a55"],LT=["","#111","#fff","#fff","#fff","#111","#fff"];
var D=null,J=null,R=null;
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pct(x){return Math.round(x*100)}
function stTxt(v){return v==null?"—":(v<0?"F"+Math.abs(v).toFixed(2).slice(1):v.toFixed(2).slice(1))}
var q=new URLSearchParams(location.search),day=q.get("d")||"20261030";
fetch("ichimark/v4_"+day+".json").then(function(r){return r.ok?r.json():Promise.reject()}).then(function(d){D=d;init()}).catch(function(){$("main").innerHTML='<div class="err">この日のデータがありません。</div>'});

/* 組み合わせのキー（例 "3まくり差し"）→ コースと決まり手 */
function split(k){var m=/^(\d)(.+)$/.exec(k);return m?{c:+m[1],t:m[2]}:{c:0,t:k}}
function init(){
  $("d").textContent=(+day.slice(4,6))+"月"+(+day.slice(6,8))+"日";
  var vs=[];D.races.forEach(function(r){if(vs.indexOf(r.jcd)<0)vs.push(r.jcd)});vs.sort();
  J=q.get("j")&&vs.indexOf(q.get("j"))>=0?q.get("j"):vs[0];
  $("pick").innerHTML=vs.map(function(j){var r=D.races.filter(function(x){return x.jcd===j})[0];return '<button type="button" data-j="'+j+'">'+esc(r.venue)+"</button>"}).join("");
  $("pick").onclick=function(e){var b=e.target.closest("button");if(!b)return;J=b.dataset.j;R=null;draw()};
  $("rs").onclick=function(e){var b=e.target.closest("button");if(!b||b.disabled)return;R=+b.dataset.r;draw()};
  how();draw();
}
function how(){
  var e=D.eval||{},cal=D.calib||[];
  $("how").innerHTML="<b>上の帯（スリット）</b>：スタート展示のSTで6艇を並べたもの。右の縦線がスタートラインで、右にあるほど早い。展示でF（フライング）だった艇は線の右に出ます。隣の2艇より0.05以上遅い艇に「凹み」の印を付けます。<br>"
   +"<b>下の図</b>：上が1マーク、下がスタートライン。艇は下から上へ進み、1マークを左に回ります。艇の並びはスタート展示の進入、前後はスタート展示STの差です（実線の位置は事実）。白の点線は1コースの逃げ、金の点線は見立ての上位の攻め筋で、どちらも見立て（推測）です。航跡は決まり手の型で描いた模式で、実際の位置や距離は表していません。<br>"
   +"<b>見立ての確率</b>：1着の「コース×決まり手」をまとめて出しています。<br>"
   +(e.top1!=null?"<b>当たり方</b>（学習に使っていない "+esc(e.span||"2026年8月以降")+" のレース）：一番高い見立てが当たった割合 "+(e.top1*100).toFixed(1)+"%（毎回「1コース逃げ」と答えると "+(e.baseTop1*100).toFixed(1)+"%）。":"")
   +(cal.length?"<br>逃げの見立ての確率と、実際に逃げた割合："+'<table><tr><th>見立て</th><th>レース数</th><th>実際に逃げた</th></tr>'+cal.map(function(c){return '<tr><td>'+esc(c.bin)+'%</td><td class="n">'+c.n.toLocaleString()+'</td><td class="n">'+(c.n?(c.nige*100).toFixed(1)+"%":"—")+"</td></tr>"}).join("")+"</table>":"");
}
function draw(){
  [].forEach.call($("pick").children,function(b){b.setAttribute("aria-pressed",b.dataset.j===J)});
  var rr=D.races.filter(function(x){return x.jcd===J}),have={};rr.forEach(function(x){have[x.rno]=x});
  if(R==null||!have[R])R=rr[0].rno;
  var h="";for(var i=1;i<=12;i++)h+='<button type="button" data-r="'+i+'" aria-pressed="'+(i===R)+'"'+(have[i]?"":" disabled")+">"+i+(have[i]?"":"<small>未</small>")+"</button>";
  $("rs").innerHTML=h;
  race(have[R]);
}
function boatAt(bs,c){return bs.filter(function(b){return b.course===c})[0]}
/* 凹み：隣の艇（片側しかない端は片側）より0.05以上遅い艇のうち、いちばん差の大きい1艇 */
function dent(bs){var best=null,bd=0;bs.forEach(function(b){if(b.st==null)return;var ns=[boatAt(bs,b.course-1),boatAt(bs,b.course+1)].filter(function(x){return x&&x.st!=null});if(!ns.length)return;var d=Math.min.apply(null,ns.map(function(x){return b.st-x.st}));if(d>=.05&&d>bd){bd=d;best=b}});return best}
function race(r){
  var bs=r.boats.slice().sort(function(a,b){return a.course-b.course});
  var pj=r.pj,keys=Object.keys(pj).sort(function(a,b){return pj[b]-pj[a]});
  var pn=pj["1逃げ"]||0,vn=(D.venueNige||{})[r.jcd];
  var att=keys.filter(function(k){var s=split(k);return s.c>=2&&/まくり|差し/.test(s.t)});
  var a1=att[0],a2=att[1]&&pj[att[1]]>=pj[a1]*.7?att[1]:null;
  var dn=dent(bs);
  var html='<figure class="fig" id="ch"><p class="ft">'+esc(r.venue)+" "+R+'R</p>'
    +'<div class="hero"><div class="big">'+pct(pn)+'<small>%</small></div><div class="lab"><b>1コースが逃げる見立て</b>'
    +(vn?'<span class="df">'+(pn*100-vn.rate*100>=0?"+":"")+(pn*100-vn.rate*100).toFixed(0)+'</span>'+esc(r.venue)+'の平均 <span class="n">'+(vn.rate*100).toFixed(0)+'</span>%（<span class="n">'+vn.n.toLocaleString()+'</span>レース）':"")+'</div></div>'
    +'<div class="cap"><b>スリット</b><span>スタート展示ST・右ほど早い</span></div>'+slit(bs,dn)
    +'<div class="cap"><b>1マーク</b><span>'+windTxt(r)+'</span></div>'+course(bs,pn,a1,a2,pj)
    +'<div class="legend"><span><i></i>逃げの見立て</span><span><i class="g"></i>攻め筋の見立て</span><span><i class="s"></i>スタートライン</span></div></figure>';
  // 見立ての上位
  var top=keys.slice(0,5),mx=pj[top[0]];
  html+='<div class="sec"><h2>見立ての上位<small>1着のコースと決まり手</small></h2><div class="cmb">'
    +top.map(function(k,i){var s=split(k),b=boatAt(bs,s.c);return '<span class="k">'+s.c+'コース '+esc(s.t)+(b&&b.waku!==s.c?'<small>'+b.waku+'号艇</small>':"")+'</span><span class="t"><i class="'+(k===a1?"top":"")+'" style="width:'+(pj[k]/mx*100).toFixed(1)+'%"></i></span><span class="v">'+pct(pj[k])+'<small>%</small></span>'}).join("")+'</div>';
  var sec=(D.second||{})[a1];
  if(sec){var tot=0,arr=Object.keys(sec).map(function(c){tot+=sec[c];return [c,sec[c]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,3);
    html+='<div class="sec2">'+split(a1).c+'コースの'+esc(split(a1).t)+'が決まったときの2着（過去の実績・<span class="n">'+tot.toLocaleString()+'</span>レース）：'+arr.map(function(x){return x[0]+'コース <span class="n">'+(x[1]/tot*100).toFixed(0)+'</span>%'}).join("・")+'</div>';}
  html+='</div>';
  // スタート展示の表
  html+='<div class="sec"><h2>スタート展示</h2><table><tr><th>枠</th><th>選手</th><th>ST</th><th>平均比</th><th>展示</th><th>チルト</th></tr>'
    +bs.map(function(b){return '<tr><td><span class="c C'+b.waku+'">'+b.waku+'</span></td><td>'+esc(b.name||"")+"<small>"+b.course+"コース・"+esc(b.cls||"")+'</small></td><td class="n">'+stTxt(b.st)+'</td><td class="n">'+(b.stDiff==null?"—":(b.stDiff>0?"+":"")+b.stDiff.toFixed(2))+'</td><td class="n">'+(b.tenji?b.tenji.toFixed(2):"—")+(b.tenjiRank?"<small>"+b.tenjiRank+"位</small>":"")+'</td><td class="n">'+(b.tilt==null?"—":b.tilt.toFixed(1))+"</td></tr>"}).join("")
    +'</table><div class="sec2" style="font-size:12.5px;color:var(--faint)">平均比＝スタート展示STから、その選手の本番の平均ST（前日まで）を引いた差。マイナスは普段より早い。</div></div>';
  $("main").innerHTML=html;
}
function windTxt(r){var wd=r.wind||{};if(wd.code===17||wd.ms===0)return "無風";if(wd.code==null||r.bearing==null)return "";
  var a=((wd.code-1)*22.5-r.bearing+360)%360,df=Math.min(a,360-a);
  var t=df<=45?"追い風":df>=135?"向かい風":(a>180?"横風（右から）":"横風（左から）");
  return t+' <span class="n" style="font-size:17px;color:#fff">'+(wd.ms!=null?wd.ms:"")+'</span>m';}
/* スリット：行＝コース（上が1）。横＝スタート展示ST。右端寄りの縦線がスタートライン */
function slit(bs,dn){
  var W=340,RH=26,H=RH*6+18,SX=250,K=400;   // 0.10秒 = 40px。Fは線の右へ（0.20まで）
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="スタート展示STの並び">';
  for(var c=1;c<=6;c++){var y=8+(c-1)*RH;s+='<line x1="30" y1="'+(y+RH)+'" x2="'+(W-6)+'" y2="'+(y+RH)+'" stroke="rgba(232,236,239,.08)"/><text x="8" y="'+(y+RH/2+5)+'" font-size="13" font-family="Barlow Condensed,sans-serif" fill="#8a96a3">'+c+'</text>'}
  [.1,.2,.3].forEach(function(v){var x=SX-v*K;s+='<line x1="'+x+'" y1="6" x2="'+x+'" y2="'+(H-10)+'" stroke="rgba(232,236,239,.07)"/><text x="'+x+'" y="'+(H-1)+'" text-anchor="middle" font-size="11" font-family="Barlow Condensed,sans-serif" fill="#8a96a3">.'+(v*10)+'0</text>'});
  s+='<line x1="'+SX+'" y1="4" x2="'+SX+'" y2="'+(H-10)+'" stroke="#8a96a3" stroke-width="1.5"/>';
  bs.forEach(function(b){var y=8+(b.course-1)*RH+RH/2,st=b.st==null?.3:b.st,x=SX-Math.max(-.2,Math.min(.5,st))*K,w=b.waku;
    s+='<line x1="34" y1="'+y+'" x2="'+(x-28)+'" y2="'+y+'" stroke="rgba(232,236,239,.12)" stroke-width="1"/>'
      +'<path d="M'+(x-28)+' '+(y-6)+' L'+(x-8)+' '+(y-6)+' L'+x+' '+y+' L'+(x-8)+' '+(y+6)+' L'+(x-28)+' '+(y+6)+' Z" fill="'+LC[w]+'"'+(w===2?' stroke="#8a96a3"':"")+'/>'
      +'<text x="'+(x-16)+'" y="'+(y+4.5)+'" text-anchor="middle" font-size="12" font-weight="700" font-family="Barlow Condensed,sans-serif" fill="'+LT[w]+'">'+w+'</text>'
      +'<text x="'+(x-34)+'" y="'+(y+5)+'" text-anchor="end" font-size="14" font-weight="600" font-family="Barlow Condensed,sans-serif" fill="'+(b.st!=null&&b.st<0?"#dcbd78":"#f2f2f0")+'">'+stTxt(b.st)+'</text>';
    if(dn&&dn===b)s+='<rect x="'+(x+6)+'" y="'+(y-9)+'" width="34" height="18" fill="none" stroke="#dcbd78"/><text x="'+(x+23)+'" y="'+(y+4.5)+'" text-anchor="middle" font-size="11.5" font-weight="800" fill="#dcbd78">凹み</text>';
  });
  return s+'</svg>';
}
/* 1マーク：上が1マーク。スタートの瞬間の隊形（横一線＋ST差）と、決まり手の型で描いた見立ての航跡 */
function course(bs,pn,a1,a2,pj){
  var W=340,H=340,CX=170,TOP=20,BX=96,BY=76,SY=268;
  var sc=function(y){return .62+.38*Math.max(0,Math.min(1,(y-TOP)/(H-TOP)))};
  var P=function(x,y){return [CX+(x-CX)*sc(y),y]};
  var pt=function(x,y){var q=P(x,y);return q[0].toFixed(1)+" "+q[1].toFixed(1)};
  var lx=function(c){return 110+(c-1)*38};
  var ly=function(b){var st=b.st==null?.15:b.st;return SY+14+Math.max(-.2,Math.min(.3,st))*120};   // 0.10秒 = 12px。Fは線より前
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="1マークの見立ての図">'
    +'<defs><pattern id="rp" width="24" height="10" patternUnits="userSpaceOnUse"><path d="M0 6 Q6 2 12 6 T24 6" fill="none" stroke="#0e3a52" stroke-width="1" opacity=".5"/></pattern>'
    +'<linearGradient id="wk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>'
    +'<rect width="'+W+'" height="'+H+'" fill="#0b2a3d"/><rect width="'+W+'" height="'+H+'" fill="url(#rp)"/>';
  // スタートライン（事実＝実線）
  s+='<path d="M'+pt(18,SY)+' L'+pt(W-18,SY)+'" stroke="#8a96a3" stroke-width="1.5"/>';
  // 航跡（見立て＝点線）
  var b1=boatAt(bs,1),e0=[lx(1),b1?ly(b1)-16:SY-2];
  var dEsc='M'+pt(e0[0],e0[1])+' C '+pt(e0[0],e0[1]-110)+', '+pt(BX+36,BY+66)+', '+pt(BX+26,BY+6)+' S '+pt(BX+2,BY-42)+', '+pt(BX-40,BY-10);
  s+='<path class="ln" d="'+dEsc+'" fill="none" stroke="#f2f2f0" stroke-width="'+(2+pn*4).toFixed(1)+'" stroke-dasharray="7 6" stroke-linecap="round"/>';
  function attPath(k){var o=split(k),b=boatAt(bs,o.c);if(!b)return "";var x0=lx(o.c),y0=ly(b)-16,t=o.t;
    if(t==="まくり") return 'M'+pt(x0,y0)+' C '+pt(x0-4,y0-110)+', '+pt(BX+56,BY+60)+', '+pt(BX+54,BY+10)+' S '+pt(BX+18,BY-62)+', '+pt(BX-40,BY-46);          // 1の前を横切り、外を全速で叩く
    if(t==="まくり差し") return 'M'+pt(x0,y0)+' C '+pt(x0+6,y0-120)+', '+pt(BX+92,BY+40)+', '+pt(BX+62,BY+2)+' C '+pt(BX+40,BY-26)+', '+pt(BX+4,BY-30)+', '+pt(BX-22,BY+6);  // 外から入り、1の内へ切り込む
    return 'M'+pt(x0,y0)+' C '+pt(x0-6,y0-120)+', '+pt(BX+62,BY+84)+', '+pt(BX+44,BY+24)+' C '+pt(BX+32,BY-8)+', '+pt(BX+2,BY-32)+', '+pt(BX-20,BY-2);  // 差し：1の後ろを横切り、ブイのすぐ外を小さく回る
  }
  if(a2) s+='<path class="ln" d="'+attPath(a2)+'" fill="none" stroke="#dcbd78" stroke-opacity=".55" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round"/>';
  if(a1) s+='<path class="ln" d="'+attPath(a1)+'" fill="none" stroke="#dcbd78" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>';
  // 1マーク（公式の橙）
  var bq=P(BX,BY),k=sc(BY);
  s+='<g><rect x="'+(bq[0]-8*k)+'" y="'+(bq[1]-14*k)+'" width="'+(16*k)+'" height="'+(22*k)+'" fill="#ff7a2e"/><rect x="'+(bq[0]-8*k)+'" y="'+(bq[1]-5*k)+'" width="'+(16*k)+'" height="'+(5*k)+'" fill="#f2f2f0"/><path d="M'+(bq[0]-8*k)+' '+(bq[1]-14*k)+' L'+bq[0]+' '+(bq[1]-22*k)+' L'+(bq[0]+8*k)+' '+(bq[1]-14*k)+' Z" fill="#ff9a55"/></g>'
    +'<text x="'+(bq[0]-6)+'" y="'+(bq[1]+30)+'" text-anchor="end" font-size="13" font-weight="700" fill="#cdd7e0">1マーク</text>';
  // 名札（攻め筋の先・金の枠）
  function tag(k2,y,op){if(!k2)return "";var o=split(k2),b=boatAt(bs,o.c),t=o.c+'コース'+(b&&b.waku!==o.c?'（'+b.waku+'号艇）':'')+' '+o.t,w=t.length*12.5+46,x=W-10-w;
    return '<g opacity="'+op+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="24" fill="#0d1c2f" stroke="#dcbd78"/><text x="'+(x+10)+'" y="'+(y+16.5)+'" font-size="12.5" font-weight="800" fill="#dcbd78">'+t+'</text><text x="'+(x+w-8)+'" y="'+(y+17.5)+'" text-anchor="end" font-size="17" font-weight="700" font-family="Barlow Condensed,sans-serif" fill="#f2f2f0">'+pct(pj[k2])+'%</text></g>';}
  s+=tag(a1,TOP+2,1)+tag(a2,TOP+30,.75);
  // 艇（上から見た細長い船形・艇番は胴体の中）と引き波
  bs.forEach(function(b){var q=P(lx(b.course),ly(b)),kk=sc(ly(b))*1.1,w=b.waku;
    s+='<g transform="translate('+q[0].toFixed(1)+' '+q[1].toFixed(1)+') scale('+kk.toFixed(3)+')">'
      +'<path d="M-6 14 L-20 50 M6 14 L20 50" stroke="url(#wk)" stroke-width="2" fill="none"/>'
      +'<path d="M0 -16 L7 -7 L7 14 L-7 14 L-7 -7 Z" fill="'+LC[w]+'"'+(w===2?' stroke="#8a96a3" stroke-width="1"':"")+'/>'
      +'<text x="0" y="8" text-anchor="middle" font-size="13" font-weight="700" font-family="Barlow Condensed,sans-serif" fill="'+LT[w]+'">'+w+'</text>'
      +(b.waku>b.course?'<rect x="-22" y="17" width="44" height="16" fill="#0d1c2f" stroke="#dcbd78"/><text x="0" y="29" text-anchor="middle" font-size="10.5" font-weight="800" fill="#dcbd78">前づけ</text>':'')
      +'</g>';});
  return s+'</svg>';
}
})();
</script>
