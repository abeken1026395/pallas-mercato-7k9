<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="author" content="あべけん（データ攻め）">
<link rel="canonical" href="https://abeken1026395.github.io/pallas-mercato-7k9/next/kisetsuYearly.html">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冬夏差を1年ずつ 試作 | データ攻め</title>
<style>
:root { --bg:#0b1219; --card:#121c28; --line:#1f2b3a; --fg:#e0e6ed; --sub:#8a94a3; --acc:#ffd166; --win:#7cc4ff; --sum:#ff9f6b; --grid:#4a627f; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--fg); font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif; -webkit-text-size-adjust:100%; padding-bottom:48px; }
.wrap { max-width:560px; margin:0 auto; padding:18px 16px; }
.crumb { font-size:12px; color:var(--sub); margin-bottom:10px; }
.crumb a { color:var(--acc); text-decoration:none; }
h1 { font-size:22px; line-height:1.4; letter-spacing:.5px; text-align:center; }
.lead { font-size:13px; color:var(--sub); text-align:center; margin-top:6px; line-height:1.7; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 12px 12px; margin-top:16px; }
.ttl { font-size:14px; font-weight:bold; line-height:1.5; }
.ttl small { display:block; font-size:12px; color:var(--sub); font-weight:normal; margin-top:2px; }
svg { display:block; width:100%; height:auto; margin-top:8px; }
.yr { fill:var(--fg); font-size:12px; font-variant-numeric:tabular-nums; }
.tk { fill:var(--sub); font-size:12px; }
.vl { fill:var(--fg); font-size:12px; font-variant-numeric:tabular-nums; }
.end { font-size:14px; line-height:1.6; min-height:3.2em; margin-top:8px; text-align:center; }
.end b { color:var(--win); font-weight:normal; }
.nw { display:inline-block; white-space:nowrap; }
.note .nw { display:inline; }
.cap { font-size:12px; color:var(--sub); line-height:1.7; margin-top:6px; }
.btn { display:block; margin:18px auto 0; min-height:44px; background:none; border:1px solid var(--acc); color:var(--acc); border-radius:22px; padding:8px 22px; font-size:14px; cursor:pointer; }
.note { font-size:12px; color:var(--sub); line-height:1.8; margin-top:18px; }
.note b { color:var(--fg); font-weight:normal; }
</style>
</head>
<body>
<div class="wrap">
<div class="crumb"><a href="./">実験場</a> ／ 冬夏差を1年ずつ</div>
<h1><span class="nw">冬のインは、</span><br><span class="nw">毎年強かったのか</span></h1>
<p class="lead"><span class="nw">検証07「冬はインか」の図を、</span><span class="nw">1年ずつ描く試作です</span></p>

<div class="card" id="card" role="img" aria-label="年ごとの冬夏差。10年のうち9年で冬が上、2022年だけ夏が上">
  <div class="ttl"><span class="nw">1コースの1着率、</span><span class="nw">冬から夏を引いた差</span><small>条件を揃えたあと・年ごと（ポイント）</small></div>
  <svg id="g" viewBox="0 0 360 262" aria-hidden="true"></svg>
  <p class="end" id="end" aria-live="polite"></p>
  <p class="cap"><span class="nw">右が冬の勝ち（青）、</span><span class="nw">左が夏の勝ち（橙）。</span><span class="nw">12月は翌年の冬に</span><span class="nw">入れています。</span></p>
</div>

<button class="btn" id="re" type="button">もう一度見る</button>

<div class="note" id="note"></div>
</div>
<footer style="margin:24px auto 8px;max-width:900px;text-align:center;font-size:10px;color:#8a94a3;letter-spacing:.3px;line-height:1.7;">&copy; 2026 データ攻め ── 制作・運営 <a href="https://www.youtube.com/@abe-ken" target="_blank" rel="noopener" style="color:#9aa4b3;text-decoration:underline;">あべけん</a></footer>
<script>
const D = {"rows":[[2017,0.954,6906,9344],[2018,2.158,13555,9151],[2019,0.905,13876,9376],[2020,0.328,13809,9277],[2021,2.04,13504,8729],[2022,-0.679,14088,9528],[2023,2.977,13831,9746],[2024,0.422,13991,9567],[2025,1.813,13990,10041],[2026,1.494,13603,9722]],"races":541558,"sameSign":9};
const NS = 'http://www.w3.org/2000/svg';
const X0 = 70, U = 63, TOP = 26, ROW = 22;
const x = v => X0 + (v + 1) * U;
const fmt = v => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(1);
const g = document.getElementById('g');
const el = (tag, a, txt) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; g.appendChild(e); return e; };
const yB = TOP + ROW * (D.rows.length - 1) + 14;
[-1, 0, 1, 2, 3].forEach(t => {
  el('line', { x1: x(t), y1: TOP - 14, x2: x(t), y2: yB, stroke: t ? 'var(--grid)' : 'var(--fg)', 'stroke-width': t ? .6 : 1 });
  el('text', { class: 'tk', x: x(t), y: yB + 18, 'text-anchor': 'middle' }, t < 0 ? '−1' : t ? '+' + t : '0');
});
const R = D.rows.map(([yr, d], i) => {
  const y = TOP + ROW * i, v = Math.round(d * 10) / 10, c = d < 0 ? 'var(--sum)' : 'var(--win)';
  const t = el('text', { class: 'yr', x: 12, y: y + 4 }, yr);
  const ln = el('line', { x1: x(0), y1: y, x2: x(0), y2: y, stroke: c, 'stroke-width': 2.4, 'stroke-linecap': 'round' });
  const dot = el('circle', { cx: x(0), cy: y, r: 5, fill: c });
  const lb = el('text', { class: 'vl', x: x(d) + (d < 0 ? -9 : 9), y: y + 4, 'text-anchor': d < 0 ? 'end' : 'start' }, fmt(v));
  return { d, t, ln, dot, lb };
});
const win = D.rows.filter(r => r[1] > 0).length;
const endEl = document.getElementById('end');
const GROW = 380, GAP = 140, PER = GROW + GAP;
const ease = k => 1 - Math.pow(1 - k, 3);
function paint(ms) {
  R.forEach((r, i) => {
    const k = Math.max(0, Math.min(1, (ms - i * PER) / GROW));
    const on = ms >= i * PER;
    r.t.style.opacity = on ? 1 : .25;
    const xe = x(r.d * ease(k));
    r.ln.setAttribute('x2', xe); r.dot.setAttribute('cx', xe);
    r.dot.style.opacity = on ? 1 : 0; r.ln.style.opacity = on ? 1 : 0;
    r.lb.style.opacity = k >= 1 ? 1 : 0;
  });
  endEl.innerHTML = ms >= R.length * PER + 200 ? '<span class="nw">' + D.rows.length + '年のうち<b>' + win + '年</b>で冬が上。</span><br><span class="nw">夏が上だったのは' + D.rows.filter(r => r[1] < 0).map(r => r[0] + '年').join('・') + 'だけ</span>' : '';
}
const TOTAL = R.length * PER + 200;
let busy = false;
function run() {
  if (busy) return; busy = true;
  let t0 = 0;
  const step = t => {
    if (!t0) t0 = t;
    const ms = t - t0;
    paint(ms);
    if (ms < TOTAL) requestAnimationFrame(step); else busy = false;
  };
  requestAnimationFrame(step);
}
const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
if (still || !('IntersectionObserver' in window)) paint(TOTAL);
else {
  paint(0);
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { run(); io.disconnect(); } }), { threshold: 0.6 });
  io.observe(document.getElementById('card'));
}
document.getElementById('re').onclick = () => { if (!busy) { paint(0); run(); } };
const n = (a) => '<span class="nw">' + Math.min(...a).toLocaleString('ja-JP') + 'から</span><span class="nw">' + Math.max(...a).toLocaleString('ja-JP') + 'レース</span>';
document.getElementById('note').innerHTML =
  '<b>数え方</b>　<span class="nw">冬は12月から2月、</span><span class="nw">夏は7月と8月。</span><span class="nw">同じ場・同じ年・同じレースの区分で、</span><span class="nw">1コースの選手と外の5艇の強さ</span><span class="nw">（直前12か月の1着率）を</span><span class="nw">揃えて差を取った</span><br>' +
  '<b>レース数</b>　各年の冬 ' + n(D.rows.map(r => r[2])) + '、<span class="nw">夏 </span>' + n(D.rows.map(r => r[3])) + '<br>' +
  '<b>期間</b>　<span class="nw">2016年11月から2026年8月</span><span class="nw">（検証07と同じ）</span><br>' +
  '<b>出典</b>　<span class="nw">Kファイル（BOAT RACE 公式の競走成績）を</span><span class="nw">集計した analysis/kensho07/stage1.json</span>';
</script>
<script src="../assets/guard.js" defer></script>

</body>
</html>
