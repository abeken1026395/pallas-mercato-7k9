<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【実験場】展示の届く時刻を測る</title>
<style>
/* 1マークの見立ての直前版を作れるか確かめるための計測ページ。
   公開の直前情報（boatraceopenapi）を、このページを開いている間だけ数分おきに読み、
   各レースのスタート展示が「締切の何分前に」読めるようになったかを、この端末に記録する。
   読み方を2通り交互に試す：A＝毎回ちがうURL（配信側の5分キャッシュを避ける）、B＝同じURL。 */
:root{--fg:#f2f2f0;--sub:#cdd7e0;--dim:#aebccb;--line:rgba(232,236,239,.18);--gold:#dcbd78;--goldBg:#c8a45e}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#0d1c2f}
body{color:var(--fg);font:15px/1.8 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 64px}
h1{font-size:22px;padding:14px 0 8px;border-bottom:1px solid rgba(212,176,106,.6);margin-bottom:10px}
p{color:var(--sub);font-size:14px;margin:6px 0}
.st{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:10px}
.st div{padding:8px 0;border-bottom:1px solid var(--line)}
.st b{display:block;font-size:22px}
.st small{color:var(--dim);font-size:12px}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--goldBg);background:var(--goldBg);color:#111;font:700 14px inherit;margin:10px 6px 0 0;cursor:pointer}
.btn.sub{background:none;color:var(--sub);border-color:var(--line)}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:600;font-size:12px}
.ok{color:#9be39b}.ng{color:#ff9c8f}
textarea{width:100%;min-height:120px;background:#132b46;color:var(--fg);border:1px solid var(--line);font:12px monospace;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>展示の届く時刻を測る</h1>
<p>このページを開いている間だけ、公開の直前情報を2分おきに読み、各レースのスタート展示が締切の何分前に読めるようになったかを、この端末に記録します。画面を消すと止まります（iPhone は裏に回ると読みません）。</p>
<p>1回の読み込みは約1.3MB。2分おきで1時間に約40MBです。Wi-Fi でどうぞ。</p>
<div class="st" id="st"></div>
<button class="btn" type="button" id="go">いま読む</button><button class="btn sub" type="button" id="out">記録を書き出す</button><button class="btn sub" type="button" id="clr">今日の記録を消す</button>
<table id="tb"></table>
<textarea id="ta" hidden readonly></textarea>
</div>
<script>
(function(){
var V=["","桐生","戸田","江戸川","平和島","多摩川","浜名湖","蒲郡","常滑","津","三国","びわこ","住之江","尼崎","鳴門","丸亀","児島","宮島","徳山","下関","若松","芦屋","福岡","唐津","大村"];
var BASE="https://raw.githubusercontent.com/boatraceopenapi/api/gh-pages/docs/v1/";
var INT=120000;
function $(i){return document.getElementById(i)}
function jstNow(){return new Date(Date.now()+9*3600e3)}
function day(){return jstNow().toISOString().slice(0,10).replace(/-/g,"")}
function hm(ms){var d=new Date(ms+9*3600e3);return d.toISOString().slice(11,16)}
var KEY="dz_tenji_watch_"+day(), S;
try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
if(!S)S={races:{},polls:[],bytes:0};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function vals(o){return Array.isArray(o)?o:o?Object.keys(o).map(function(k){return o[k]}):[]}
function parseDl(s){var m=/(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/.exec(s||"");return m?Date.UTC(+m[1],+m[2]-1,+m[3],+m[4]-9,+m[5]):null}
var n=0,busy=false;
function poll(){
  if(busy)return;busy=true;n++;
  var mode=(S.polls.length%2===0)?"A":"B",d=day(),url=BASE+d.slice(0,4)+"/"+d+".json"+(mode==="A"?"?t="+Date.now():"");
  var t0=Date.now();
  fetch(url,{cache:mode==="A"?"no-store":"default"}).then(function(r){return r.text()}).then(function(tx){
    S.bytes+=tx.length;var j=JSON.parse(tx),now=Date.now();
    vals(((j.programs||{}).stadiums)).forEach(function(s){vals(s.races).forEach(function(r){
      var k=("0"+r.stadium_number).slice(-2)+"-"+r.race_number,dl=parseDl(r.closed_at);
      var ex=vals(((r.preview||{}).racers)).filter(function(x){return x&&x.exhibition_time}).length;
      var R=S.races[k]||(S.races[k]={dl:dl});
      if(ex){if(!R[mode])R[mode]=now}else{R["no"+mode]=now}
    })});
    S.polls.push({t:now,m:mode,ms:now-t0});save();draw();
  }).catch(function(e){S.polls.push({t:Date.now(),m:mode,err:String(e)});save();draw()}).then(function(){busy=false});
}
function draw(){
  var ks=Object.keys(S.races).filter(function(k){var R=S.races[k];return (R.A||R.B)&&(R.noA||R.noB)}).sort(function(a,b){return S.races[a].dl-S.races[b].dl});
  var leads=[];
  $("tb").innerHTML='<tr><th>レース</th><th>締切</th><th>A（避ける）</th><th>B（同じURL）</th><th>締切まで</th></tr>'+ks.map(function(k){var R=S.races[k],f=Math.min(R.A||9e15,R.B||9e15),pre=Math.max(R.noA||0,R.noB||0);
    var lo=Math.round((R.dl-f)/60000),hi=pre<f?Math.round((R.dl-pre)/60000):lo;if(pre<f)leads.push(lo);
    return '<tr><td>'+V[+k.slice(0,2)]+" "+k.slice(3)+'R</td><td>'+hm(R.dl)+'</td><td>'+(R.A?hm(R.A):"—")+'</td><td>'+(R.B?hm(R.B):"—")+'</td><td class="'+(lo>=10?"ok":"ng")+'">'+(pre<f?lo+"〜"+hi+"分前":"—")+"</td></tr>"}).join("");
  leads.sort(function(a,b){return a-b});
  var med=leads.length?leads[Math.floor(leads.length/2)]:null,ok=leads.filter(function(x){return x>=10}).length;
  $("st").innerHTML='<div><small>測れたレース</small><b>'+leads.length+'</b></div><div><small>締切まで（中央）</small><b>'+(med==null?"—":med+"分")+'</b></div><div><small>10分前までに届いた</small><b>'+(leads.length?ok+"/"+leads.length:"—")+'</b></div>'
    +'<div><small>読んだ回数</small><b>'+S.polls.length+'</b></div><div><small>通信量</small><b>'+(S.bytes/1048576).toFixed(0)+'MB</b></div><div><small>最後に読んだ</small><b>'+(S.polls.length?hm(S.polls[S.polls.length-1].t):"—")+'</b></div>';
}
$("go").onclick=poll;
$("out").onclick=function(){var ta=$("ta");ta.hidden=false;ta.value=JSON.stringify({day:day(),races:S.races,polls:S.polls.length,bytes:S.bytes});ta.select()};
$("clr").onclick=function(){S={races:{},polls:[],bytes:0};save();draw()};
draw();poll();setInterval(function(){if(!document.hidden)poll()},INT);
document.addEventListener("visibilitychange",function(){if(!document.hidden)poll()});
})();
</script>
<script src="../assets/guard.js" defer></script>
</body>
</html>
