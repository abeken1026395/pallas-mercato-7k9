<!-- YouTube の動画への中継（2026-11-13 けん「カード作れ」）。
     LINE のトークでカードを押すと LINE の中の画面で開き、YouTube アプリへ移れない。
     1) LINE の中で開かれたら、同じページを ?openExternalBrowser=1 付きで開き直して外のブラウザ（Safari など）へ出す
     2) 外のブラウザでは待たずに YouTube アプリを開く。開けなければ 1.2秒後にブラウザの YouTube へ移る。パソコンではすぐブラウザの YouTube へ。念のため押せるボタンも画面に出す
     開いた回数は Cloudflare Web Analytics の表示数（このページ）で数える -->
<style>
html,body{margin:0;background:#0b1726;color:#e8edf3;font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif}
main{max-width:480px;margin:0 auto;padding:24px 16px 40px}
img{display:block;width:100%;height:auto;aspect-ratio:1200/661;object-fit:cover;border:1px solid rgba(233,180,90,.5)}
h1{font-size:18px;line-height:1.5;margin:16px 0 8px}
p{font-size:14px;line-height:1.6;color:#c9d4e0;margin:0 0 20px}
.go{display:flex;align-items:center;justify-content:center;min-height:52px;background:#e9b45a;color:#0b1726;font-size:16px;font-weight:700;text-decoration:none}
.sub{display:flex;align-items:center;justify-content:center;min-height:44px;margin-top:8px;color:#9fc3ff;font-size:14px}
</style>
<script>
(function(){
  /* 待ち時間を作らない（けん 11/13「限りなく0秒で」）：読み込みを待たず、頭の時点ですぐ移る */
  var V = "5qJUnjHq_AM";
  try {
    var ua = navigator.userAgent, inLine = / Line\//i.test(ua);
    if (inLine && location.search.indexOf("openExternalBrowser=1") < 0) {
      location.replace(location.pathname + "?openExternalBrowser=1");
      return;
    }
    if (inLine) return;
    if (/iPhone|iPad|iPod|Android/i.test(ua)) {
      location.href = "youtube://www.youtube.com/watch?v=" + V;
      /* アプリが無い・断られたときだけ、1.2秒後にブラウザの YouTube へ。アプリへ移れたら（ページが隠れたら）何もしない */
      setTimeout(function () { if (!document.hidden) location.replace("https://www.youtube.com/watch?v=" + V); }, 1200);
    } else {
      location.replace("https://www.youtube.com/watch?v=" + V);
    }
  } catch (e) { /* 何もしない。画面のボタンから開ける */ }
})();
</script>
