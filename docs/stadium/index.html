。SGは企画が消えるぶんイン1着率が下がるが、穏やかな水面で実力者のインは堅め。番組が歪んで1号艇B級・他コースA級のレースはセオリーが効きにくい。"}, {"code": "16", "name": "児島", "area": "中国", "water": "海水", "in1": "56.2%", "feature": "潮の影響を受ける。比較的インが強いが満潮時はうねる。", "arare": "中", "sign": "満潮前後でうねりが出ると差し・まくり差しが台頭。干潮の穏やかな時間帯はイン中心でOK。", "kikaku": true, "sg": "通常時の数値は企画込み。SGは企画が消えてイン1着率が低下。満潮のうねりと全A級が重なると2・3コースの攻めが活発。潮の時間帯を要チェック。"}, {"code": "17", "name": "宮島", "area": "中国", "water": "海水", "in1": "56.9%", "feature": "潮の流れが速い。流れに乗る差しが決まりやすいがインも強い。", "arare": "中", "sign": "潮の流れが速い時間帯は差しが一気に決まる。干満の変わり目を要チェック。普段はイン軸。", "kikaku": true, "sg": "通常時の数値は企画込み。SGは企画が消えるぶんイン1着率が下がる。潮の流れが速い時間帯+全A級で差しが一段と決まりやすい。干満の変わり目が勝負所。"}, {"code": "18", "name": "徳山", "area": "中国", "water": "海水", "in1": "62.9%(企画ゲタ大)", "feature": "1マークが狭く全国屈指のイン天国。1コースが圧倒的に強い。ただし12R中9Rが1号艇A級固定の企画で、通常時の高1着率はかさ上げされている。", "arare": "低", "sign": "荒れるのは1号艇がB級・前づけで隊形が乱れたとき。干潮時に波乱が出やすい。", "kikaku": true, "sg": "通常時の高1着率は企画ゲタが大きい(12R中9R=1号艇A級)。SGは企画が消えるため、見かけより1着率は大きく下がる。それでも狭水面でインは強いが、通常時ほどの鉄板感は無くなる。"}, {"code": "19", "name": "下関", "area": "中国", "water": "海水", "in1": "60.0%", "feature": "ナイター。穏やかでインが非常に強い。干満差の影響は小さく静水面に近い。", "arare": "低", "sign": "イン超優勢で堅い。荒れ要素は少ない。1号艇がB級のときだけ2・3コースの差しまくりを警戒。", "kikaku": true, "sg": "通常時の数値は企画込み。SGは企画が消えるぶんイン1着率が下がるが、穏やかな静水面で実力者のインは堅め。スジ舟券が通りやすく、相手を絞りやすい。"}, {"code": "20", "name": "若松", "area": "九州", "water": "海水", "in1": "56.7%", "feature": "ナイター。潮と風で水面が動く。ダッシュ勢のまくりが決まりやすい。", "arare": "高", "sign": "狙い目が水面状況で変わる玄人場。風・潮でダッシュまくりが一気。4・5コースの実力者に注意。", "kikaku": true, "sg": "通常時の数値は企画込み。SGは企画が消えてイン1着率が低下。全A級のダッシュ勢が風・潮に乗ると4・5コースのまくりで高配当。番組が歪むレースほど波乱。"}, {"code": "21", "name": "芦屋", "area": "九州", "water": "淡水", "in1": "61.3%(企画ゲタ大)", "feature": "淡水で穏やか。スタートが揃いやすくまくりにくい。イン天国。ただし12R中9Rが1号艇A級固定の企画で、通常時の高1着率はかさ上げされている。", "arare": "低", "sign": "イン非常に強く堅い。荒れるのはインのスタート遅れ時のみ。初心者でも狙いやすい鉄板場。", "kikaku": true, "sg": "通常時の高1着率は企画ゲタが大きい(12R中9R=1号艇A級)。SGは企画が消えるため見かけより1着率は下がる。それでも静穏な淡水面でインは強いが、通常時ほどの鉄板感は薄れる。"}, {"code": "22", "name": "福岡", "area": "九州", "water": "汽水", "in1": "54.3%", "feature": "川と海が交わりうねりが名物。1マーク付近の硬めのうねりで難水面。3コースまくり率が全国最高クラス。", "arare": "高", "sign": "名物うねりで荒れる玄人場。風向き(特に博多湾からの風)とうねりで差し・まくり差し台頭。当地巧者最重視。", "kikaku": true, "sg": "通常時の数値は企画込み。SGは企画が消えてイン信頼度が低下。名物うねり+全A級で3コースまくり・2コース差しが活発。当地経験差が大きく出る玄人場。"}, {"code": "23", "name": "唐津", "area": "九州", "water": "淡水", "in1": "54.3%", "feature": "淡水で穏やかだが冬場は強風。前づけ・進入の乱れが起きやすい。干満差なし。", "arare": "中", "sign": "冬の強風日は荒れる。前づけ巧者がいると隊形が乱れて波乱。普段は穏やかでイン中心。", "kikaku": true, "sg": "通常時の数値は企画込み。SGは企画が消えてイン1着率が下がる。風の弱い日は実力者のインが堅く、強風・前づけで隊形が乱れると荒れる。"}, {"code": "24", "name": "大村", "area": "九州", "water": "海水", "in1": "63.6%", "feature": "全国屈指のイン天国として有名。1マークが広く風も少なくイン有利条件が揃う。前半Rで1着率低下、後半Rは68%と高い。", "arare": "低", "sign": "注意は前半R(1〜6R)で1着率が5割割れの日があること。", "kikaku": true, "sg": "「SG・G1はインが飛ぶ」。よく言われます。大村では飛んでいませんでした。A級だけで組まれた3節・216戦の1コース1着率は61.1%、全レース平均は60.7%です（2,817戦）。1コースが4着以下に沈む割合も12.5%と14.3%で、A級だけの節のほうがむしろ低く出ています。\n\n大レースで1号艇が沈む場面は、中継で何度も見ます。平凡に逃げ切ったレースのほうは覚えていません。思い出しやすさは、起きやすさではありませんでした。\n\n企画レースが効いていないわけではありません。効いている場所が前半ではないだけです。1〜6Rの1コース1着率は49.8%（1,411戦）、7〜12Rは71.7%（1,406戦）。1号艇にA1級が入るのは、1Rでは235レース中6回、11Rでは108回でした。\n\nでは後ろの顔ぶれが揃うとどうなるか。1号艇がA1級のレースを、後ろ5人のA1級の人数で分けます。\n\n・後ろにA1級が0人 … 1着率78.7% ／ 4着以下6.4%（282戦）\n・1人 … 79.9% ／ 5.1%（294戦）\n・5人（6艇すべてA1級）… 69.8% ／ 6.9%（116戦）\n\n6艇すべてA1級。字面だけで手が止まります。ですが落ちたのは1着率だけで、8.9ポイント。4着以下の割合は動きませんでした。飛ぶのが怖いと1号艇を消したくなりますが、消す理由になるのは着外率のほうです。ここでは動いていません。\n\n桐生を同じ数え方で見ると、75.7%から55.1%に落ち、4着以下は5.2%から20.4%へ4倍になります。同じ「全員A1級」でも、場によって意味が違いました。\n\n顔ぶれだけでは説明しきれない差も残ります。1号艇をA1級に揃えて比べても、1〜6Rは68.8%（189戦）、7〜12Rは78.6%（697戦）。同じ級別でも10ポイント違いました。前半Rの弱さは、番組だけの話ではありません。\n\nこの3節はレース数が少なく、1着率の誤差は3ポイントほどあります。全体との0.4ポイント差を「上がった」とは書けません。書けるのは、下がると決めてかかる根拠がなかったことだけです。\n\n持ち帰れるのは一つです。率を比べる前に、比べている中身を揃えること。大村のA級だけの節では、1号艇が飛ぶかどうかより、頭が誰になるかを見てください。（当サイト集計・2025/07/15〜2026/09/04）"}], "in1Note": "1コース1着率は進入コース基準。2016-11-01〜2026-11-07・全24場551,927艇（出典: 公式競走成績・24場番付と同じ数字）"};</script>
